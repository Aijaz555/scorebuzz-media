<!doctype html>
<html><head><meta charset="utf-8"><title>ScoreBuzz Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060914;--panel:rgba(16,22,46,.92);--panel2:#0C1128;--line:rgba(255,255,255,.08);--ink:#F4F6FC;--mute:#9AA3C7;--dim:#5B638C;--lime:#BEFF3C;--acc:#FF8A3D;--red:#FF2D46;--away:#3D7BFF;--home:#FF8A3D;--awayInk:#fff;--homeInk:#fff}
html{overflow:hidden;background:var(--bg)}
body{width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--bg);color:var(--ink);font-family:Inter,'Segoe UI',Roboto,sans-serif;position:relative}
.num{font-family:'Barlow Condensed',Inter,sans-serif;font-variant-numeric:tabular-nums}
.bgfx{position:absolute;inset:0;background:radial-gradient(900px 600px at 0% 0%,color-mix(in srgb,var(--away) 28%,transparent),transparent 70%),radial-gradient(900px 600px at 100% 0%,color-mix(in srgb,var(--home) 28%,transparent),transparent 70%),radial-gradient(1200px 500px at 50% 120%,#1B2A6B55,transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(#000,transparent 60%);opacity:.35}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 50px #0008,inset 0 1px 0 #ffffff10;backdrop-filter:blur(8px);position:relative;overflow:hidden}
.h{font-size:19px;font-weight:800;letter-spacing:3px;color:var(--mute);text-transform:uppercase}

/* header */
header{position:absolute;top:22px;left:28px;right:28px;height:56px;display:flex;align-items:center;gap:16px}
.logo{font-size:38px;font-weight:900;letter-spacing:-1.4px}.logo b{color:var(--lime)}
.pill{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:2px;padding:9px 18px;border-radius:999px;background:#ffffff12;border:1px solid var(--line)}
.pill.live{background:var(--red);border-color:transparent;box-shadow:0 0 30px #FF2D4666}
.pill i{width:11px;height:11px;border-radius:50%;background:#fff}.pill.live i{animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.hc{margin-left:auto;display:flex;gap:12px;align-items:center}
.chip{font-size:20px;font-weight:800;letter-spacing:2px;padding:9px 16px;border-radius:12px;background:#ffffff0d;border:1px solid var(--line);color:var(--mute)}
.chip.acc{color:var(--acc)}

/* team sidebars */
.side{position:absolute;top:96px;bottom:104px;width:452px;display:flex;flex-direction:column;gap:16px}
.side.l{left:28px}.side.r{right:28px}
.team{height:372px;padding:24px 28px 20px;display:flex;flex-direction:column;align-items:center}
.team:before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 70%,transparent),transparent 62%);opacity:.75}
.team:after{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:var(--tc)}
.team>*{position:relative}
.trow{display:flex;align-items:center;gap:20px;width:100%}
.lg{width:112px;height:112px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#ffffff22,transparent 60%),var(--tc);border:3px solid #ffffff30;position:relative;overflow:hidden;box-shadow:0 10px 30px #0007}
.lg span{font-weight:900;font-size:34px;color:var(--ti)}
.lg img{position:absolute;inset:12%;width:76%;height:76%;object-fit:contain;filter:drop-shadow(0 4px 8px #0008)}
.lg.ok{background:radial-gradient(circle,#ffffff26,#ffffff08 70%);border-color:#ffffff22}.lg.ok span{display:none}
.tn{min-width:0}.tn .n{font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .rec{font-size:19px;color:#ffffffcc;font-weight:700;margin-top:8px}
.tn .poss{display:inline-block;margin-top:8px;font-size:18px;font-weight:900;letter-spacing:2px;color:var(--bg);background:var(--lime);padding:4px 10px;border-radius:8px}
.score{font-size:160px;font-weight:800;line-height:.88;margin-top:6px;letter-spacing:-2px;text-shadow:0 8px 40px #0009}
.score.lose{color:#ffffff80}
.score.flash{animation:sflash 2.6s ease-out}
@keyframes sflash{0%{color:var(--lime);transform:scale(1.18);text-shadow:0 0 60px var(--lime)}100%{transform:scale(1)}}
.ls{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.ls div{min-width:58px;padding:7px 8px;border-radius:10px;background:#00000040;border:1px solid var(--line);text-align:center}
.ls b{display:block;font-size:18px;color:var(--mute);letter-spacing:1px}.ls span{font-size:26px;font-weight:700}
.ls div.cur{border-color:var(--lime)}.ls div.cur b{color:var(--lime)}
.card{padding:20px 24px}
.ldr{display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ldr:first-of-type{border-top:none}
.ldr .c{font-size:19px;font-weight:800;color:var(--mute);letter-spacing:1px}
.ldr .p{font-size:23px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldr .v{font-size:40px;font-weight:800;color:var(--tc2)}
.st{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;padding:6px 0}
.st .k{font-size:18px;font-weight:700;color:var(--mute)}.st .v{font-size:28px;font-weight:800}
.st .bar{grid-column:1/3;height:6px;border-radius:9px;background:#ffffff10;overflow:hidden}.st .bar i{display:block;height:100%;background:var(--tc2);border-radius:9px;transition:width 1s}
.st .bar.win i{box-shadow:0 0 12px var(--tc2)}


/* football match centre views */
.mc-tabs{position:absolute;top:14px;right:18px;display:flex;gap:6px;z-index:3}
.mc-tabs span{font-size:17px;font-weight:800;letter-spacing:1.5px;padding:5px 9px;border-radius:7px;color:var(--mute);background:#ffffff08;text-transform:uppercase}
.mc-tabs span.on{background:var(--lime);color:#0A0E1E}
.mc{width:100%;height:100%;padding:50px 26px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.mc svg{display:block}
.mc .sub{font-size:19px;font-weight:700;color:var(--mute);letter-spacing:1px;margin-top:8px;text-align:center}
.mstat{display:grid;grid-template-columns:1fr 1fr;column-gap:34px;row-gap:2px;width:100%}
.mstat .row{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;gap:10px;padding:1px 0}
.mstat .k{grid-column:1/-1;text-align:center;font-size:17px;font-weight:800;letter-spacing:1.5px;color:var(--mute);text-transform:uppercase;margin-bottom:-2px}
.mstat .v{font-size:23px;font-weight:800;line-height:1.1}.mstat .v.r{text-align:right}
.mstat .b{height:9px;border-radius:9px;background:#ffffff10;overflow:hidden;display:flex}
.mstat .b i{height:100%}
.ltab{width:100%;border-collapse:collapse}
.ltab td,.ltab th{padding:3px 10px;font-size:19px;text-align:center}
.ltab th{font-size:18px;letter-spacing:2px;color:var(--mute)}
.ltab td.t{text-align:left;font-weight:700}.ltab tr.hl td{background:#BEFF3C1f;color:#fff;font-weight:900}.ltab tr.hl td:first-child{border-left:4px solid var(--lime)}
.ltab td.n{font-family:'Barlow Condensed',Inter;font-size:26px;font-weight:700}
.formb{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;font-weight:900;font-size:20px;margin:0 2px;color:#0A0E1E}
/* center */
.status{flex-shrink:0}.sbon .stage{flex:0 0 auto;height:560px;padding:0;background:#0A0E1E}.sbon .plays .pl ~ .pl ~ .pl{display:none}
body:has(.center.sbon) .side{width:372px}body:has(.center.sbon) .tn .n{font-size:31px;letter-spacing:-.5px}body:has(.center.sbon) .trow{gap:14px}body:has(.center.sbon) .center{left:416px;right:416px}
.lclk-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#FF2D46;margin-left:12px;vertical-align:middle;animation:lblink 1s infinite}@keyframes lblink{50%{opacity:.2}}


.center{position:absolute;top:96px;bottom:104px;left:500px;right:500px;display:flex;flex-direction:column;gap:16px}
.status{height:84px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px}
.status .clk{text-align:center}.status .clk .p{font-size:20px;font-weight:800;letter-spacing:3px;color:var(--acc)}
.status .clk .t{font-size:52px;font-weight:800;line-height:.95;white-space:nowrap}.status .clk .t.w{font-size:40px;letter-spacing:1px}
.lead{font-size:20px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.lead i{width:12px;height:12px;border-radius:3px;background:var(--lc,#fff)}
.lead.r{justify-content:flex-end;color:var(--mute);font-size:20px;font-weight:700;letter-spacing:1px}
.runb{font-size:19px;font-weight:900;letter-spacing:2px;color:var(--bg);background:var(--lime);padding:5px 10px;border-radius:8px;margin-left:6px}
.stage{flex:1;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stage svg{display:block}
.stage .cap{position:absolute;top:16px;left:20px}
.legend{position:absolute;top:50px;right:18px;display:flex;gap:14px;font-size:18px;font-weight:700;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.wp{height:74px;padding:12px 22px;display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:16px}
.wp .s{font-size:34px;font-weight:800}.wp .s small{display:block;font-family:Inter;font-size:17px;letter-spacing:2px;color:var(--mute);font-weight:800}
.wp .s.r{text-align:right}
.wpbar{height:16px;border-radius:99px;background:var(--home);overflow:hidden;position:relative}
.wpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--away);transition:width 1.2s;border-right:3px solid #fff}
.wpwrap{position:relative}.wpwrap svg{position:absolute;left:0;right:0;bottom:30px;width:100%;height:22px;opacity:.6}
.plays{height:268px;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.pl{display:grid;grid-template-columns:6px 46px 108px 1fr auto;gap:14px;align-items:center;min-height:48px;padding:4px 0;padding-right:12px;border-radius:12px;background:#ffffff08}
@keyframes slide{from{opacity:0;transform:translateY(-14px)}}
.pl .bar{height:100%;border-radius:12px 0 0 12px;background:var(--pc)}
.pl .lg{width:38px;height:38px;border-width:2px}.pl .lg span{font-size:17px}
.pl .k{font-size:20px;font-weight:700;color:var(--mute)}
.pl .x{font-size:20px;font-weight:600;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pl .pts{font-size:24px;font-weight:800;color:var(--bg);background:var(--lime);border-radius:9px;padding:0 10px}
.pl.big{background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 35%,transparent),#ffffff06)}
/* popup on stage */
.pop{position:absolute;left:50%;top:440px;transform:translate(-50%,-50%) scale(.6);opacity:0;width:620px;padding:22px 26px;border-radius:22px;background:linear-gradient(120deg,var(--pc),color-mix(in srgb,var(--pc) 40%,#0C1128));box-shadow:0 30px 80px #000b;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;transition:all .45s cubic-bezier(.2,1.4,.4,1);z-index:5}
.pop.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.pop .t{font-size:20px;font-weight:900;letter-spacing:3px;color:#ffffffcc}.pop .x{font-size:26px;font-weight:800;line-height:1.2;margin-top:4px}
.pop .v{font-size:84px;font-weight:800;line-height:.9;color:var(--lime);text-shadow:0 0 30px #BEFF3C88}
/* break / pre views */
.cmp{width:100%;height:100%;padding:24px 34px;display:flex;flex-direction:column}
.cmp .row{display:grid;grid-template-columns:110px 1fr 220px 1fr 110px;align-items:center;gap:12px;padding:9px 0}
.cmp .row .v{font-size:34px;font-weight:800}.cmp .row .v.r{text-align:right}
.cmp .row .k{text-align:center;font-size:20px;font-weight:800;letter-spacing:1px;color:var(--mute);text-transform:uppercase}
.cmp .row .b{height:10px;border-radius:9px;background:#ffffff10;overflow:hidden;display:flex}
.cmp .row .b.l{justify-content:flex-end}.cmp .row .b i{height:100%;border-radius:9px}
.boxt{width:100%;border-collapse:collapse}.boxt td,.boxt th{padding:7px 8px;font-size:21px;text-align:center}
.boxt th{font-size:18px;letter-spacing:2px;color:var(--mute)}.boxt td:first-child,.boxt th:first-child{text-align:left}
.boxt td.n{font-family:'Barlow Condensed',Inter;font-size:28px;font-weight:700}
.pre{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;text-align:center}
.pre .vs{display:flex;align-items:center;gap:46px}.pre .vs .lg{width:150px;height:150px}.pre .vs .lg span{font-size:44px}
.pre .vs b{font-size:56px;font-weight:900;color:var(--mute)}
.pre .cd{font-size:120px;font-weight:800;line-height:.9}
.pre .when{font-size:24px;font-weight:700;color:var(--mute)}
/* full-screen transition banner */
.trans{position:absolute;inset:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;opacity:0;pointer-events:none;transition:opacity .5s}
.trans.on{opacity:1}
.trans .half{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.trans .half.a{background:linear-gradient(110deg,var(--away),color-mix(in srgb,var(--away) 45%,#000))}
.trans .half.b{background:linear-gradient(250deg,var(--home),color-mix(in srgb,var(--home) 45%,#000))}
.trans .lg{width:220px;height:220px}.trans .lg span{font-size:64px}
.trans .half .s{font-size:220px;font-weight:800;line-height:.85}
.trans .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#060914;border:2px solid #ffffff22;border-radius:26px;padding:26px 50px;text-align:center;box-shadow:0 30px 90px #000}
.trans .mid .t{font-size:58px;font-weight:900;letter-spacing:-1px}.trans .mid .s2{font-size:20px;font-weight:800;letter-spacing:4px;color:var(--lime);margin-top:6px}
/* subscribe toast */
.sub{position:absolute;bottom:120px;left:50%;transform:translate(-50%,40px);opacity:0;display:flex;align-items:center;gap:18px;padding:14px 18px 14px 14px;border-radius:20px;background:#0C1128;border:1px solid #ffffff22;box-shadow:0 20px 60px #000c;transition:all .5s;z-index:10}
.sub.on{opacity:1;transform:translate(-50%,0)}
.sub .av{width:62px;height:62px;border-radius:50%;background:var(--lime);color:var(--bg);display:grid;place-items:center;font-weight:900;font-size:24px}
.sub .tx b{display:block;font-size:24px}.sub .tx span{color:var(--mute);font-size:20px;font-weight:600}
.btn{background:var(--red);color:#fff;font-weight:900;font-size:19px;letter-spacing:1px;padding:12px 20px;border-radius:12px;display:flex;align-items:center;gap:8px}
.bell{display:inline-block;animation:ring 2.4s infinite;transform-origin:50% 0}
@keyframes ring{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(18deg)}75%{transform:rotate(-16deg)}85%{transform:rotate(10deg)}}
/* footer */
footer{position:absolute;left:0;right:0;bottom:0;height:80px;background:#04060E;border-top:1px solid var(--line);display:flex;align-items:center}
.fb{flex:none;height:100%;display:flex;align-items:center;gap:10px;padding:0 26px;background:var(--lime);color:var(--bg);font-weight:900;font-size:22px;letter-spacing:1px}
.tick{flex:1;overflow:hidden;white-space:nowrap;height:100%;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tick>div{display:inline-flex;align-items:center;animation:scroll var(--dur,80s) linear infinite}
@keyframes scroll{to{transform:translateX(-50%)}}
.tk{display:inline-flex;align-items:center;gap:10px;margin-right:44px;font-size:21px;font-weight:700}
.tk .lg{width:30px;height:30px;border-width:1px}.tk .lg span{font-size:14px}
.tk b{font-family:'Barlow Condensed',Inter;font-size:27px}.tk em{font-style:normal;font-size:19px;color:var(--mute);font-weight:800;letter-spacing:1px;margin-left:4px}
.tk.lab{color:var(--lime);font-weight:900;letter-spacing:2px}
.fsub{flex:none;margin:0 20px}
.err{position:absolute;inset:0;display:grid;place-items:center;font-size:36px;color:var(--mute)}

.rdots{float:right;display:flex;gap:6px;margin-top:4px}.rdots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.rdots i.on{background:var(--tc2,var(--acc))}

.ldr.sl{grid-template-columns:60px 1fr}.ldr.sl small{display:block;font-size:19px;font-weight:600;color:var(--mute);margin-top:2px}
.bxh{text-align:right;font-size:15px;font-weight:800;letter-spacing:2px;color:var(--mute);margin:-4px 0 -2px}.ldr.bxr{grid-template-columns:1fr auto}.ldr.bxr .v{font-size:30px}.ldr.bxr .v em{font-style:normal;color:var(--dim);margin:0 6px}
/* league colour touch: header stripe, league chip and accents in the league's brand colours (body.lgc, vars set in render) */
.lgc header:after{content:'';position:absolute;left:0;right:0;bottom:-6px;height:6px;background:linear-gradient(90deg,var(--lg1) 0 55%,var(--lg2) 55% 80%,var(--lg3) 80%);z-index:4}
.lgc .chip#lg{background:var(--lg1);border-color:var(--lg2);color:var(--lg4)}
.lgc footer{box-shadow:inset 0 3px 0 var(--lg1)}
/* ===== light theme (matches scorebuzz.net: #f2f2f2 page, white cards, black header, lime "Buzz", blue accents) ===== */
body.light{--bg:#f2f2f2;--panel:#ffffff;--panel2:#f7f7f8;--line:#e6e6e6;--ink:#1b1b1b;--mute:#6b6b6b;--dim:#9a9a9a;--lime:#2f80ed;--acc:#2f80ed;--red:#e53935;--brand:#c6f432}
html:has(body.light){background:#f2f2f2}
.light .bgfx{opacity:.35}
.light .grid{opacity:.35}
.light .panel{box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);backdrop-filter:none}
.light header{top:0;left:0;right:0;height:84px;padding:0 28px;background:#000;color:#fff;z-index:4}
.light .logo{color:#fff}.light .logo b{color:var(--brand)}
.light .pill{background:#1c1c1c;border-color:#2a2a2a;color:#fff}.light .pill.live{background:var(--red);box-shadow:none}
.light .chip{background:#1c1c1c;border-color:#2a2a2a;color:#d6d6d6}.light .chip.acc{color:var(--brand)}
.light .team:before{opacity:.18}
.light .lg{border-color:rgba(0,0,0,.1);box-shadow:0 3px 10px rgba(0,0,0,.15)}
.light .lg.ok{background:#f7f7f8;border-color:var(--line)}
.light .lg img{filter:none}
.light .tn .rec{color:var(--mute)}
.light .tn .poss,.light .runb,.light .pl .pts{color:#fff}
.light .score{text-shadow:none}.light .score.lose{color:#a3a3a3}
.light .score.flash{animation:sflashL 2.6s ease-out}@keyframes sflashL{0%{color:var(--acc);transform:scale(1.18)}100%{transform:scale(1)}}
.light .ls div{background:#f7f7f8}
.light .st .bar,.light .mstat .b,.light .cmp .row .b{background:#ececec}
.light .mc-tabs span{background:#f2f2f2}.light .mc-tabs span.on{background:var(--acc);color:#fff}
.light .ltab tr.hl td{background:#2f80ed14;color:var(--ink)}
.light .sbon .stage{background:#fff}
.light .pl{background:#f7f7f8}
.light .pl.big{background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 20%,#fff),#f7f7f8)}
.light .pop .v{color:#fff;text-shadow:none}
.light .trans .mid{background:#fff;border-color:var(--line);color:var(--ink);box-shadow:0 30px 90px rgba(0,0,0,.35)}.light .trans .mid .s2{color:var(--acc)}
.light .sub{background:#fff;border-color:var(--line);box-shadow:0 12px 40px rgba(0,0,0,.15)}
.light .sub .av{background:#000;color:var(--brand)}
.light .mc .sub{background:none;box-shadow:none}
.light footer{background:#000;border-top:none;color:#fff}
.light .fb{background:var(--brand);color:#000}
.light .tk em{color:#9a9a9a}.light .tk.lab{color:var(--brand)}
.light .tk .lg.ok{background:#fff}
.light footer [style*="var(--lime)"]{color:var(--brand)!important}
.light .wpbar i{border-right-color:#fff}
.light [style*="color:#fff"]{color:var(--ink)!important}
/* charts drawn on the panel (not on a pitch/court): dark ink instead of white */
.light .ch text[fill^="#fff"]{fill:var(--mute)}
.light .ch [stroke^="#fff"]{stroke:rgba(0,0,0,.3)}
.light .ch polyline[stroke="#fff"]{stroke:var(--ink)}
.light .ch rect[fill^="#ffffff"]{fill:#f7f7f8}
.light .ch circle[fill="#fff"]{stroke:rgba(0,0,0,.3);stroke-width:1.5}
.light .legend svg circle[fill="#fff"]{fill:var(--ink)}
.light .legend svg[stroke="#fff"]{stroke:var(--ink)}

<body><script>(function(){

<script>
const FEED = (function () {
  const module = { exports: {} };
  const require = () => ({});
  const process = { env: {} };
  const fetch = (url) => window.fetch(url, { cache: 'no-store' }); // plain GET: no custom headers, no CORS preflight
  // Live data feed for ScoreBuzz score streams.
// Reads ESPN's public JSON (site.api.espn.com) and turns it into one simple shape the
// scoreboard page understands. ESPN's API is unofficial and undocumented: if a field moves,
// fix it here, nowhere else.
//
// Mock mode: set SCOREBUZZ_MOCK=1 to read tools/live/fixtures/<league>.json instead of ESPN.
const fs = require('fs');
const path = require('path');

const LEAGUES = {
  nba: { path: 'basketball/nba', label: 'NBA', sport: 'nba', periods: 4, otLabel: 'OT' },
  nfl: { path: 'football/nfl', label: 'NFL', sport: 'nfl', periods: 4, otLabel: 'OT' },
  nhl: { path: 'hockey/nhl', label: 'NHL', sport: 'nhl', periods: 3, otLabel: 'OT' },
  ncaaf: { path: 'football/college-football', label: 'NCAAF', sport: 'nfl', periods: 4, otLabel: 'OT' },
  mlb: { path: 'baseball/mlb', label: 'MLB', sport: 'mlb', periods: 9, otLabel: 'X' },
  epl: { path: 'soccer/eng.1', label: 'PREMIER LEAGUE', name: 'Premier League', sport: 'football', periods: 2, soccer: true },
  ucl: { path: 'soccer/uefa.champions', label: 'CHAMPIONS LEAGUE', name: 'Champions League', sport: 'football', periods: 2, soccer: true },
  uel: { path: 'soccer/uefa.europa', label: 'EUROPA LEAGUE', name: 'Europa League', sport: 'football', periods: 2, soccer: true },
  laliga: { path: 'soccer/esp.1', label: 'LALIGA', name: 'LaLiga', sport: 'football', periods: 2, soccer: true },
  seriea: { path: 'soccer/ita.1', label: 'SERIE A', name: 'Serie A', sport: 'football', periods: 2, soccer: true },
  bundesliga: { path: 'soccer/ger.1', label: 'BUNDESLIGA', name: 'Bundesliga', sport: 'football', periods: 2, soccer: true },
  ligue1: { path: 'soccer/fra.1', label: 'LIGUE 1', name: 'Ligue 1', sport: 'football', periods: 2, soccer: true },
  mls: { path: 'soccer/usa.1', label: 'MLS', sport: 'football', periods: 2, soccer: true },
};

const BASE = 'https://site.api.espn.com/apis/site/v2/sports';
const MOCK = process.env.SCOREBUZZ_MOCK === '1';
const cache = new Map();

async function getJSON(url, ttlMs = 8000) {
  const hit = cache.get(url);
  if (hit && Date.now() - hit.t < ttlMs) return hit.v;
  const res = await fetch(url, { headers: { 'user-agent': 'ScoreBuzz live scoreboard (scorebuzz.net)' } });
  if (!res.ok) throw new Error(`${res.status} ${url}`);
  const v = await res.json();
  cache.set(url, { t: Date.now(), v });
  return v;
}

function mock(league) {
  return JSON.parse(fs.readFileSync(path.join(__dirname, 'fixtures', `${league}.json`), 'utf8'));
}

// date: optional YYYYMMDD
async function scoreboard(league, date) {
  const L = LEAGUES[league];
  if (!L) throw new Error(`unknown league ${league}. Use one of: ${Object.keys(LEAGUES).join(', ')}`);
  if (MOCK) return mock(league).scoreboard;
  return getJSON(`${BASE}/${L.path}/scoreboard${date ? `?dates=${date}` : ''}`);
}

async function summary(league, eventId) {
  if (MOCK) return mock(league).summary || {};
  try {
    return await getJSON(`${BASE}/${LEAGUES[league].path}/summary?event=${eventId}`, 10000);
  } catch {
    return {}; // play-by-play is a bonus; the scoreboard still works without it
  }
}

const hex = (c, d) => (c && /^[0-9a-f]{6}$/i.test(c) ? `#${c}` : d);

function team(c) {
  const t = c.team || {};
  return {
    id: t.id,
    name: t.shortDisplayName || t.name || t.displayName || '?',
    full: t.displayName || t.name || '?',
    abbr: t.abbreviation || (t.name || '?').slice(0, 3).toUpperCase(),
    logo: t.logo || t.logos?.[0]?.href || '', // ESPN team logo / national flag URL
    color: hex(t.color, '#2A3570'),
    alt: hex(t.alternateColor, '#FFFFFF'),
    score: c.score ?? '0',
    record: (c.records || []).find((r) => r.type === 'total' || r.name === 'overall')?.summary || c.records?.[0]?.summary || '',
    lines: (c.linescores || []).map((l) => l.displayValue ?? String(l.value ?? '')),
  };
}

// Top performer per category for both teams: [{ cat, home: {name, value}, away: {name, value} }]
function leaders(comp) {
  const by = {};
  const order = [];
  for (const c of comp.competitors || []) {
    for (const cat of (c.leaders || []).slice(0, 3)) {
      const top = cat.leaders?.[0];
      if (!top) continue;
      const k = cat.abbreviation || cat.shortDisplayName || cat.name || '';
      if (!by[k]) { by[k] = { cat: k }; order.push(k); }
      let value = top.displayValue || String(top.value ?? '');
      // football season leaders come as "188/233, 2425 YDS, 25 TD, 1 INT": keep the yards so it fits the panel
      if (value.length > 9) value = (value.match(/[\d,]+ YDS/) || [value.split(',')[0]])[0].replace(' YDS', '');
      by[k][c.homeAway] = { name: top.athlete?.shortName || top.athlete?.displayName || '', value };
    }
  }
  return order.map((k) => by[k]);
}

// Game leaders from the summary (all categories ESPN gives: NFL passing/rushing/receiving/sacks/tackles,
// NBA points/rebounds/assists, NHL goals/assists/points): [{ cat, home: {name, value, detail}, away: {...} }]
const LCAT = { passingYards: 'PASS', rushingYards: 'RUSH', receivingYards: 'REC', sacks: 'SACK', totalTackles: 'TKL', interceptions: 'INT',
  points: 'PTS', rebounds: 'REB', assists: 'AST', steals: 'STL', blocks: 'BLK', goals: 'G', saves: 'SV', plusMinus: '+/-' };
function summaryLeaders(sum, home, away, sport) {
  const by = {}, order = [];
  for (const t of sum.leaders || []) {
    const side = String(t.team?.id) === String(home.id) ? 'home' : String(t.team?.id) === String(away.id) ? 'away' : null;
    if (!side) continue;
    for (const c of t.leaders || []) {
      const top = c.leaders?.[0];
      if (!top?.athlete) continue;
      const k = LCAT[c.name] || (c.shortDisplayName || c.abbreviation || c.name || '').toUpperCase().slice(0, 4);
      const k2 = sport === 'nhl' && c.name === 'assists' ? 'A' : sport === 'nhl' && c.name === 'points' ? 'PTS' : k;
      if (!by[k2]) { by[k2] = { cat: k2 }; order.push(k2); }
      const detail = top.displayValue || String(top.value ?? '');
      let value = detail;
      if (value.length > 6) value = ((value.match(/([\d,]+) YDS/) || [])[1]) || value.split(',')[0];
      by[k2][side] = { name: top.athlete.shortName || top.athlete.displayName || '', value, detail };
    }
  }
  return order.map((k) => by[k]).filter((x) => x.home || x.away);
}

// football: goalscorers in the "game leaders" panel (cat = ball icon, value = minute)
function soccerLeaders(home, away) {
  const n = Math.min(4, Math.max(home.scorers?.length || 0, away.scorers?.length || 0));
  return Array.from({ length: n }, (_, i) => ({ cat: 'GOAL', home: home.scorers[i], away: away.scorers[i] }));
}
function periodLabel(n, L) {
  if (!n) return '';
  if (L.sport === 'mlb') return `INN ${n}`;
  if (n > L.periods) return n - L.periods > 1 ? `OT${n - L.periods}` : 'OT';
  return `${L.sport === 'nhl' ? 'P' : 'Q'}${n}`;
}

// Soccer live tracker: last actions with pitch coordinates from ESPN commentary.
// fieldPositionX/Y are 0-100 from the acting team's view (attacking towards x=100);
// we draw home attacking right, so away actions are mirrored.
function tracker(sum, comp, home, away) {
  const byName = {};
  for (const c of comp.competitors || []) {
    const ab = c.homeAway === 'home' ? home.abbr : away.abbr;
    for (const n of [c.team?.displayName, c.team?.name, c.team?.shortDisplayName]) if (n) byName[n] = ab;
  }
  const out = [];
  for (const c of sum.commentary || []) {
    const p = c.play;
    if (!p || p.fieldPositionX == null || p.fieldPositionY == null) continue;
    const t = byName[p.team?.displayName] || '';
    if (!t) continue;
    const isHome = t === home.abbr;
    const x = isHome ? p.fieldPositionX : 100 - p.fieldPositionX;
    const y = isHome ? p.fieldPositionY : 100 - p.fieldPositionY;
    const who = p.participants?.[0]?.athlete?.displayName || '';
    out.push({ id: String(p.id || c.sequence), min: c.time?.displayValue || p.clock?.displayValue || '', team: t, home: isHome,
      x: Math.max(0, Math.min(100, x)), y: Math.max(0, Math.min(100, y)), type: p.type?.text || '', who, att: p.fieldPositionX });
  }
  const seen = new Set();
  return out.filter((e) => !seen.has(e.id) && seen.add(e.id)).slice(-6);
}

function plays(sum, comp, teamsById, L) {
  let list = [];
  if (L.soccer) {
    // goals and cards from the scoreboard; commentary from the summary when available
    list = (comp.details || []).map((d) => ({
      clock: d.clock?.displayValue || '',
      text: `${d.type?.text || 'Event'}${d.athletesInvolved?.length ? ` · ${d.athletesInvolved.map((a) => a.displayName).join(', ')}` : ''}`,
      team: teamsById[d.team?.id] || '',
      big: !!d.scoringPlay || !!d.redCard,
      id: `${d.clock?.displayValue}-${d.type?.text}`,
      type: d.scoringPlay ? 'Goal' : d.type?.text || '',
    }));
    if (Array.isArray(sum.keyEvents) && sum.keyEvents.length) {
      list = sum.keyEvents.map((k) => ({
        clock: k.clock?.displayValue || '',
        text: k.text || k.type?.text || '',
        team: teamsById[k.team?.id] || '',
        big: !!k.scoringPlay,
        id: k.id || `${k.clock?.displayValue}-${k.type?.text}`,
        type: k.scoringPlay ? 'Goal' : k.type?.text || '',
      }));
      // keep the moments that matter (goals, cards, penalties, half/full time) ahead of substitutions
      const key = list.filter((x) => x.big || /goal|card|penalty|half|kick|end|start|var/i.test(`${x.type} ${x.text}`) && !/substitution/i.test(x.text));
      if (key.length >= 4) list = key;
    }
  } else {
    const raw = sum.plays || sum.drives?.current?.plays || [];
    list = raw.map((p) => ({
      id: p.id || p.sequenceNumber || '',
      type: p.type?.text || '',
      value: p.scoreValue || 0,
      clock: [periodLabel(p.period?.number, L), p.clock?.displayValue].filter(Boolean).join(' '),
      text: p.text || p.type?.text || '',
      team: teamsById[p.team?.id] || '',
      big: !!p.scoringPlay && (L.sport !== 'nba' || (p.scoreValue || 0) >= 3),
    }));
  }
  return list.filter((p) => p.text).slice(-7).reverse();
}


// ---- extra panels (all optional: each returns null/[] when ESPN doesn't provide the data) ----

const STAT_PICK = {
  nba: ['fieldGoalPct', 'threePointFieldGoalPct', 'freeThrowPct', 'totalRebounds', 'assists', 'turnovers', 'steals', 'blocks'],
  nfl: ['totalYards', 'netPassingYards', 'rushingYards', 'firstDowns', 'turnovers', 'possessionTime', 'thirdDownEff'],
  nhl: ['shotsTotal', 'powerPlayGoals', 'faceoffPercent', 'hits', 'blockedShots', 'takeaways', 'giveaways'],
  mlb: ['hits', 'errors', 'homeRuns', 'strikeouts', 'walks', 'leftOnBase'],
  football: ['possessionPct', 'totalShots', 'shotsOnTarget', 'wonCorners', 'foulsCommitted', 'saves', 'offsides'],
};
const num = (v) => { const n = parseFloat(String(v).replace('%', '')); return Number.isFinite(n) ? n : null; };

// Team stat comparison rows: [{ label, home, away, h, a }] (h/a numeric for the bars)
// football: the full stat list for the match-centre stats view
function teamStatsAll(sum, home, away) {
  const teams = sum.boxscore?.teams || [];
  const side = (id) => teams.find((t) => String(t.team?.id) === String(id))?.statistics || [];
  const hs = side(home.id), as = side(away.id);
  const want = [['possessionPct', 'Possession %'], ['totalShots', 'Shots'], ['shotsOnTarget', 'On target'], ['wonCorners', 'Corners'], ['totalPasses', 'Passes'], ['passPct', 'Pass accuracy'], ['totalCrosses', 'Crosses'], ['foulsCommitted', 'Fouls'], ['offsides', 'Offsides'], ['yellowCards', 'Yellow cards'], ['redCards', 'Red cards'], ['saves', 'Saves']];
  return want.map(([n, label]) => {
    const h = hs.find((x) => x.name === n), a = as.find((x) => x.name === n);
    if (!h || !a) return null;
    const pct = n === 'passPct';
    const f = (x) => (pct ? `${Math.round(parseFloat(x.displayValue) * 100)}%` : x.displayValue);
    return { label, home: f(h), away: f(a), h: num(h.displayValue) ?? 0, a: num(a.displayValue) ?? 0 };
  }).filter(Boolean);
}
function teamStats(sum, L, home, away) {
  const teams = sum.boxscore?.teams || [];
  const side = (id) => teams.find((t) => String(t.team?.id) === String(id))?.statistics || [];
  const hs = side(home.id), as = side(away.id);
  if (!hs.length || !as.length) return [];
  const want = STAT_PICK[L.sport] || [];
  let names = want.filter((n) => hs.some((x) => x.name === n));
  if (names.length < 3) names = hs.filter((x) => num(x.displayValue) !== null && !String(x.displayValue).includes('-')).map((x) => x.name);
  return names.slice(0, 8).map((n) => {
    const h = hs.find((x) => x.name === n) || {}, a = as.find((x) => x.name === n) || {};
    const toNum = (x) => (n === 'possessionTime' ? (([m, sec]) => m * 60 + +sec)(String(x.displayValue || '0:0').split(':').map(Number)) : num(x.displayValue));
    return { label: (h.label || h.abbreviation || n).replace(/Percentage/i, '%'), home: h.displayValue ?? '–', away: a.displayValue ?? '–', h: toNum(h) ?? 0, a: toNum(a) ?? 0 };
  });
}

// Home win probability over the game, 0..100, max ~120 points (NBA, NFL, NCAAF)
function winProb(sum) {
  const wp = sum.winprobability || [];
  if (!wp.length) return null;
  const step = Math.max(1, Math.ceil(wp.length / 120));
  const series = wp.filter((_, i) => i % step === 0 || i === wp.length - 1).map((w) => Math.round((w.homeWinPercentage ?? 0.5) * 1000) / 10);
  return { home: series[series.length - 1], series };
}

// Score margin (home - away) after each scoring play: game-flow chart
function flow(sum) {
  const raw = (sum.plays || []).filter((p) => p.scoringPlay && p.homeScore != null);
  if (raw.length < 2) return null;
  const step = Math.max(1, Math.ceil(raw.length / 150));
  return [0, ...raw.filter((_, i) => i % step === 0 || i === raw.length - 1).map((p) => p.homeScore - p.awayScore)];
}

// NFL/NCAAF ball position on a 0..100 field drawn away end-zone left, home end-zone right
function field(sit, home, away, teamsById) {
  if (!sit || !sit.possessionText) return null;
  const m = String(sit.possessionText).match(/([A-Z&]+)\s+(\d+)/i);
  if (!m) return null;
  const side = m[1].toUpperCase(), yd = Number(m[2]);
  const ball = side === home.abbr ? 100 - yd : side === away.abbr ? yd : 50;
  const poss = teamsById[sit.possession] || '';
  const dir = poss === away.abbr ? 1 : -1; // away team attacks towards the home end zone (right)
  return { ball, firstDown: sit.distance ? Math.max(0, Math.min(100, ball + dir * sit.distance)) : null, poss, dir, text: sit.downDistanceText || '' };
}

// Football timeline: goals and cards with minute for the 0-90' bar
function timeline(comp, teamsById) {
  return (comp.details || []).map((d) => ({
    min: parseInt(d.clock?.displayValue, 10) || 0,
    team: teamsById[d.team?.id] || '',
    kind: d.scoringPlay ? 'goal' : d.redCard ? 'red' : d.yellowCard ? 'yellow' : 'other',
    who: d.athletesInvolved?.[0]?.shortName || d.athletesInvolved?.[0]?.displayName || '',
  })).filter((x) => x.kind !== 'other');
}

// Top players per team from the box score: { cols: [...], home: [[name, ...]], away: [...] }
const BOX = { nba: { sort: 'PTS', cols: ['PTS', 'REB', 'AST'] }, nhl: { sort: 'PTS', cols: ['G', 'A', 'SOG'] } };
function box(sum, L, home, away) {
  const cfg = BOX[L.sport];
  if (!cfg) return null;
  const pick = (id) => {
    const g = (sum.boxscore?.players || []).find((x) => String(x.team?.id) === String(id))?.statistics?.[0];
    if (!g) return [];
    const labels = g.labels || g.names || [];
    const idx = (k) => labels.indexOf(k);
    if (idx(cfg.sort) < 0) return [];
    return (g.athletes || []).filter((a) => a.stats?.length)
      .map((a) => ({ name: a.athlete?.shortName || a.athlete?.displayName || '', v: cfg.cols.map((c) => a.stats[idx(c)] ?? '–'), s: num(a.stats[idx(cfg.sort)]) || 0 }))
      .sort((x, y) => y.s - x.s).slice(0, 4).map((x) => [x.name, ...x.v]);
  };
  const h = pick(home.id), a = pick(away.id);
  return h.length || a.length ? { cols: cfg.cols, home: h, away: a } : null;
}

// NBA/NHL shot chart: last 60 shooting plays with court coordinates.
// ESPN NBA coordinates are feet on a half court (x 0-50 across, y 0-47 from the baseline);
// free throws and missing locations come through as huge negative numbers and are dropped.
function shots(sum, teamsById, L) {
  if (!['nba', 'nhl'].includes(L.sport)) return [];
  return (sum.plays || [])
    .filter((p) => (p.shootingPlay || /shot/i.test(p.type?.text || '')) && p.coordinate && Math.abs(p.coordinate.x) < 200 && Math.abs(p.coordinate.y) < 200)
    .slice(-60)
    .map((p) => ({ x: p.coordinate.x, y: p.coordinate.y, made: !!p.scoringPlay, team: teamsById[p.team?.id] || '', v: p.scoreValue || 0 }));
}

// Current scoring run, e.g. { team: 'MEM', for: 10, against: 0 } when one side has scored the last 8+ points
function run(sum, home, away) {
  const sp = (sum.plays || []).filter((p) => p.scoringPlay && p.homeScore != null);
  if (sp.length < 3) return null;
  let h = 0, a = 0, last = sp[sp.length - 1];
  for (let i = sp.length - 1; i > 0; i--) {
    const dh = sp[i].homeScore - sp[i - 1].homeScore, da = sp[i].awayScore - sp[i - 1].awayScore;
    if ((dh > 0 && a > 0) || (da > 0 && h > 0)) break;
    h += Math.max(0, dh); a += Math.max(0, da);
  }
  const best = Math.max(h, a);
  if (best < 8 || !last) return null;
  return { team: h > a ? home.abbr : away.abbr, for: best, against: 0 };
}

// MLB at-bat situation
function mlbSit(sit) {
  if (sit.balls == null && sit.outs == null) return null;
  return {
    balls: sit.balls ?? 0, strikes: sit.strikes ?? 0, outs: sit.outs ?? 0,
    bases: [!!sit.onFirst, !!sit.onSecond, !!sit.onThird],
    batter: sit.batter?.athlete?.shortName || '', pitcher: sit.pitcher?.athlete?.shortName || '',
  };
}

function statusText(st, L) {
  const s = st?.type || {};
  if (s.state === 'pre') return 'UPCOMING';
  if (s.completed) return (s.shortDetail || 'FINAL').toUpperCase();
  if (L.soccer) return (st.displayClock || s.shortDetail || '').toUpperCase();
  return (s.shortDetail || `${st.period} ${st.displayClock}`).toUpperCase();
}

// ---------- football match centre: momentum, shot map, lineups, table, form ----------
const SHOT = { 'shot-on-target': 'on', 'shot-off-target': 'off', 'shot-blocked': 'blocked', goal: 'goal', 'penalty---scored': 'goal', 'own-goal': 'goal' };
function teamOf(p, home, away, comp) {
  const n = p.team?.displayName || '';
  for (const c of comp.competitors || []) {
    if ([c.team?.displayName, c.team?.name, c.team?.shortDisplayName].includes(n)) return c.homeAway === 'home' ? 'home' : 'away';

// ---------------- US sports: rotating views during the game ----------------

function stage(g, ph) {

// ---- real-time football clock (mm:ss), like the website: runs locally between data updates ----
let clkBase = { id: '', sec: 0, at: 0 }, clkShown = 0;
function liveSecs(g) {
  if (clkBase.id !== g.id || g.clockSec > clkBase.sec + 1 || g.clockSec < clkBase.sec - 90) { clkBase = { id: g.id, sec: g.clockSec, at: Date.now() }; clkShown = 0; }
  const s = clkBase.sec + (Date.now() - clkBase.at) / 1000;
  clkShown = Math.max(clkShown, Math.min(s, clkBase.sec + 600)); // never runs backwards; stops if data freezes for 10 min
  return clkShown;
}
const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
setInterval(() => { const el = document.getElementById('lclk'); if (el && G) el.textContent = mmss(liveSecs(G)); }, 250);

  $('app').innerHTML = `
    <div class="side l">${side(L, R, g, lw)}</div>
    <div class="center ${sbOn(g, ph) ? 'sbon' : ''}">${statusBar(g, ph)}<div class="panel stage" id="stage">${stage(g, ph)}</div>${ph === 'pre' || sbOn(g, ph) ? '' : wpBar(g)}${TRK && g.soccer && ph === 'live' ? '' : playsPanel(g, ph)}</div>
    <div class="side r">${side(R, L, g, rw)}</div>`;
  prev = { home: g.home.score, away: g.away.score };
  placeTracker(); placeSite();

  // big-play popup
  const big = g.plays.find((p) => p.big);
  if (big && seenBig !== null && big.id !== seenBig && ph === 'live') popup(big, g);
  if (big) seenBig = big.id; else if (seenBig === null) seenBig = '';

  // period-change transition
  if (lastPhase && ph !== lastPhase && (ph === 'break' || ph === 'final')) transition(g, ph);
  lastPhase = ph;
  ticker(g);
}

// ---------------- scorebuzz.net live tracker (the website's own "Live Action" pitch) ----------------
// The match page on scorebuzz.net is embedded and cropped to its tracker card: the page is opened at
// #trkSlot (the browser scrolls the tracker to the top), the site's sticky header covers the first 64 px,
// so the visible window starts just below it. ?sbtrk=0 turns it off (our own tracker is used instead).
const SB_LEAGUE = { epl: 'football/english-premier-league', ucl: 'football/champions-league', uel: 'football/europa-league', laliga: 'football/la-liga', seriea: 'football/serie-a', bundesliga: 'football/bundesliga', ligue1: 'football/ligue-1', mls: 'football/mls',
  nba: 'basketball/nba', nfl: 'american-football/nfl', ncaaf: 'american-football/college-football', nhl: 'ice-hockey/nhl' };
const SB_US = ['nba', 'nfl', 'ncaaf', 'nhl'];
// crop of the site's tracker card (page opened at #trkSlot, 1000 px wide; measured 6 Nov 2026):
// top = first visible pixel (the sticky header covers 0-64), vh = visible height
const SB_BOX = { soccer: { top: 64, vh: 536 }, nba: { top: 64, vh: 512 }, nfl: { top: 100, vh: 456 }, ncaaf: { top: 100, vh: 456 }, nhl: { top: 74, vh: 582 } };
const SB_W = 1000, SB_X = 14, SB_VW = 972;
const sbBox = () => SB_BOX[league] || SB_BOX.soccer;
const sbOn = (g, ph) => ph === 'live' && !!sbUrl(g);
const slugify = (n) => String(n || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
function sbUrl(g) {
  const lg = SB_LEAGUE[league];
  if (!lg || q.get('sbtrk') === '0') return '';
  // per-game override written by tools/live/check_trackers.js when the website's tracker isn't working for this game
  if (typeof PIN !== 'undefined' && PIN && String(PIN.event) === String(g.id) && PIN.sbtrk === 0) return '';
  // the website only has a live tracker for some matches and that can't be checked from here (cross-origin),
  // so in auto mode use it for favourite teams and pinned/slot games (big matches, usually covered);
  // other games get our own tracker
  if (!SB_US.includes(league) && typeof AUTO !== 'undefined' && AUTO && !(typeof PIN !== 'undefined' && PIN) && q.get('sbtrk') !== '1') {
    const fav = (typeof AUTO_TEAMS !== 'undefined' ? AUTO_TEAMS : []);
    if (!fav.length || ![g.home.abbr, g.away.abbr].some((a) => fav.includes(String(a).toUpperCase()))) return '';
  }
  return `https://scorebuzz.net/${lg}/${slugify(g.home.name)}-vs-${slugify(g.away.name)}-${g.id}/${THEME_DARK ? '?ui=v1' : ''}`;
}
let sbBase = '', sbAnchored = 0;
function placeSite() {
  const L = $('sbL'), F = $('sbF'), hole = $('sbHole');
  if (!hole || !G) { L.style.display = 'none'; return; }
  const base = sbUrl(G);
  if (base !== sbBase) { sbBase = base; F.src = base + '#trkSlot'; sbAnchored = Date.now(); }
  else if (Date.now() - sbAnchored > 10 * 60000) { sbAnchored = Date.now(); F.src = base + '#t-ov'; setTimeout(() => { F.src = base + '#trkSlot'; }, 400); } // re-anchor now and then
  const r = hole.getBoundingClientRect(), root = document.body.getBoundingClientRect(), sc = parseFloat((document.body.style.transform.match(/scale\(([\d.]+)/) || [])[1]) || 1;
  const { top: SB_TOP, vh: SB_VH } = sbBox();
  const hw = r.width / sc, hh = r.height / sc, k = Math.min(hw / SB_VW, hh / SB_VH), w = SB_VW * k, h = SB_VH * k;
  Object.assign(L.style, { display: 'block', left: ((r.left - root.left) / sc + (hw - w) / 2) + 'px', top: ((r.top - root.top) / sc + (hh - h) / 2) + 'px', width: w + 'px', height: h + 'px' });
  Object.assign(F.style, { width: SB_W + 'px', height: (SB_TOP + SB_VH + 20) + 'px', left: (-SB_X * k) + 'px', top: (-SB_TOP * k) + 'px', transform: `scale(${k})` });
}

// keep one iframe alive across re-renders (moving it would reload it): it sits in a layer positioned over #trkHole
function placeTracker() {
  const L = $('trkL'), F = $('trkF'), hole = $('trkHole');
  if (!TRK || !hole) { L.style.display = 'none'; return; }
  if (!F.src) F.src = TRK;
  const r = hole.getBoundingClientRect(), root = document.body.getBoundingClientRect();
  const k = Math.min(r.width / 950, r.height / 640);
  const w = 950 * k, h = 640 * k;
  Object.assign(L.style, { display: 'block', left: (r.left - root.left + (r.width - w) / 2) + 'px', top: (r.top - root.top + (r.height - h) / 2) + 'px', width: w + 'px', height: h + 'px' });
  F.style.transform = `scale(${k})`;
}

function popup(p, g) {
  const t = p.team === g.home.abbr ? g.home : p.team === g.away.abbr ? g.away : null;
  const el = $('pop');
  if (!el || !t) return;
  const kind = g.soccer ? 'GOAL!' : g.sport === 'nfl' ? (p.value >= 6 ? 'TOUCHDOWN!' : p.value === 3 ? 'FIELD GOAL' : 'SCORE') : g.sport === 'nhl' ? 'GOAL!' : p.value >= 3 ? 'THREE!' : 'BUCKET';
  el.style.setProperty('--pc', vivid(t));
  el.innerHTML = `${logo(t)}<div><div class="t">${kind} · ${esc(t.name.toUpperCase())}</div><div class="x">${esc(p.text)}</div></div>${p.value && !g.soccer ? `<div class="v num">+${p.value}</div>` : ''}`;
  requestAnimationFrame(() => el.classList.add('on'));
  setTimeout(() => el.classList.remove('on'), 6500);
}

function transition(g, ph) {
  const el = $('trans'), [L, R] = g.soccer ? [g.home, g.away] : [g.away, g.home];
  const title = ph === 'final' ? 'FINAL' : (g.detail || g.status).toUpperCase();
  el.innerHTML = `<div class="half a">${logo(L)}<div class="s num">${esc(L.score)}</div></div><div></div><div class="half b">${logo(R)}<div class="s num">${esc(R.score)}</div></div>
    <div class="mid"><div class="t">${esc(title)}</div><div class="s2">${esc(g.label)} · SCOREBUZZ LIVE</div></div>`;
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 7000);
}

let tickKey = '';
function ticker(g) {
  const key = JSON.stringify(g.ticker);
  if (key === tickKey) return;
  tickKey = key;
  const none = g.ticker.length ? '' : `<span class="tk">No other ${esc(g.label)} games live right now</span>`;
  const items = `<span class="tk lab">${esc(g.label)} · LIVE</span>` + none + g.ticker.map((t) => `<span class="tk">${tLogo(t.a, t.al)}${esc(t.a)} <b>${esc(t.as)}</b>${tLogo(t.h, t.hl)}${esc(t.h)} <b>${esc(t.hs)}</b><em>${esc(t.st)}</em></span>`).join('')
    + '<span class="tk lab">LIVE SCORES · NO GAME FOOTAGE</span><span class="tk">Fixtures, tables and results at&nbsp;<b style="color:var(--lime);font-family:Inter;font-size:21px">scorebuzz.net</b></span>';
  $('tick').innerHTML = items + items;
  $('tick').style.setProperty('--dur', Math.max(45, g.ticker.length * 10) + 's');
}

// ---- autopilot game picker (static version) ----
// ?slot=N: a reusable "game slot" for a studio project. The game shown comes from settings.json
// "slots": {"1": {"league": "ncaaf", "event": "401858291"}, ...}, so a project's web layer never
// has to change: Claude sets the slot's game in git, retitles the project and schedules it via API.
const SLOT = q.get('slot');
const AUTO = q.get('auto') === '1' || !!SLOT;
let AUTO_LEAGUES = (q.get('leagues') || q.get('league') || 'nba').split(',').filter(Boolean);
let AUTO_TEAMS = (q.get('teams') || '').toUpperCase().split(',').filter(Boolean);
let AUTO_TOP = Number(q.get('top25') || 0);
let PIN = null;
// Remote control: in auto mode the page also reads ./settings.json next to it (committed to GitHub),
// so leagues/teams can be changed or a game pinned without touching the streaming studio.
//   { "leagues": ["nba","nfl"], "teams": ["LAL"], "top25": 10, "pin": {"league": "nba", "event": "401..."} | null }
async function loadSettings() {
  if (q.has('noremote')) return;
  try {
    const r = await window.fetch('https://raw.githubusercontent.com/Aijaz555/scorebuzz-media/main/docs/live/settings.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const c = await r.json();
    if (Array.isArray(c.leagues) && c.leagues.length) AUTO_LEAGUES = c.leagues;
    if (Array.isArray(c.teams)) AUTO_TEAMS = c.teams.map((t) => String(t).toUpperCase());
    if (c.top25 !== undefined) AUTO_TOP = Number(c.top25) || 0;
    PIN = c.pin && c.pin.event ? c.pin : null;
    // remote screen fitting for the streaming studio: {"fit": {"w": 1910, "h": 1070, "x": 0, "y": 0, "fit": "fill", "debug": true}}
    window.__fitRemote = c.fit || {}; if (window.__fit) window.__fit();
    // remote reload: bump "reload" in settings.json and every open stream page reloads itself (picks up new code)
    if (window.__reloadSeen === undefined) window.__reloadSeen = c.reload ?? null;
    else if ((c.reload ?? null) !== window.__reloadSeen) location.reload();
    if (SLOT) { const sl = (c.slots || {})[SLOT]; PIN = sl && sl.event ? sl : null;
      // dark broadcast layout (docs/live/dark.html) for the leagues listed in settings "dark": hand the slot over to it
      // NBA broadcast layout (docs/live/nba.html, owner 9 Nov 2026): loaded fresh from raw GitHub like the cricket page,
      // because the stream host caches docs/live/*.html for hours. settings "nbaPage": false falls back to dark.html.
      if (PIN && PIN.league === 'nba' && c.nbaPage !== false) { if (window.__toNba) return; window.__toNba = 1;
        window.fetch('https://raw.githubusercontent.com/Aijaz555/scorebuzz-media/main/docs/live/nba.html?t=' + Date.now(), { cache: 'no-store' })
          .then((r) => { if (!r.ok) throw 0; return r.text(); })
          .then((html) => { const top = setTimeout(() => {}, 0); for (let i = 1; i <= top + 50; i++) { clearTimeout(i); clearInterval(i); }
            document.open(); document.write(html); document.close(); })
          .catch(() => { window.__toNba = 0; });
        return; }
      if (PIN && Array.isArray(c.dark) && c.dark.includes(PIN.league)) { location.replace('dark.html' + location.search); return; }
      // cricket games (league "cricket:<espn league id>") use the cricket tracker page (docs/live/cricket2.html)
      // loaded fresh from raw GitHub (like index.html loads this page), because the stream host caches docs/live/*.html for hours
      if (PIN && /^cricket/.test(PIN.league)) { if (window.__toCricket) return; window.__toCricket = 1;
        window.fetch('https://raw.githubusercontent.com/Aijaz555/scorebuzz-media/main/docs/live/cricket2.html?t=' + Date.now(), { cache: 'no-store' })
          .then((r) => { if (!r.ok) throw 0; return r.text(); })
          .then((html) => { const top = setTimeout(() => {}, 0); for (let i = 1; i <= top + 50; i++) { clearTimeout(i); clearInterval(i); }
            document.open(); document.write(html); document.close(); })
          .catch(() => { window.__toCricket = 0; });
        return; } }
  } catch (e) { /* keep URL settings */ }
}
let finalSince = 0;
async function pickGame() {
  const all = [];
  for (const lg of AUTO_LEAGUES) {
    const ymd = (d) => d.toLocaleDateString('en-CA', { timeZone: 'America/New_York' }).replace(/-/g, '');
    for (const day of [undefined, ymd(new Date()), ymd(new Date(Date.now() + 86400e3))]) {   // ESPN's current day, today and tomorrow (ET)
      try { for (const g of await FEED.list(lg, day)) if (!all.some((x) => x.id === g.id)) all.push({ ...g, league: lg }); } catch (e) { /* no games */ }
    }
  }
  const ok = all.filter((g) => !(g.league === 'ncaaf' && AUTO_TOP && g.rank > AUTO_TOP));
  const fav = (g) => AUTO_TEAMS.length && g.abbrs.some((a) => AUTO_TEAMS.includes(String(a).toUpperCase()));
  const live = ok.filter((g) => g.state === 'in');
  if (live.length) {
    live.sort((a, b) => (fav(b) - fav(a)) || (a.rank - b.rank));
    return live[0];
  }
  const pre = ok.filter((g) => g.state === 'pre').sort((a, b) => a.start.localeCompare(b.start));
  const soonFav = pre.find((g) => fav(g) && new Date(g.start) - Date.now() < 3 * 3600e3);
  return soonFav || pre[0] || ok.filter((g) => g.state === 'post').pop() || null;
}
async function autoTick() {
  await loadSettings();
  if (PIN && (PIN.event !== event || PIN.league !== league)) { league = PIN.league; event = String(PIN.event); G = null; finalSince = 0; tickKey = ''; poll(); return; }
  if (PIN) return;
  if (SLOT) { if (!event) $('app').innerHTML = '<div class="err">ScoreBuzz live scoreboard · next game coming up</div>'; return; }
  const cur = G && G.id === event ? G : null;
  if (cur && cur.state === 'in') {
    finalSince = 0;
    // stay on a live game, unless it isn't a favourite and a favourite game is live now
    const isFav = AUTO_TEAMS.length && [cur.home.abbr, cur.away.abbr].some((a) => AUTO_TEAMS.includes(String(a).toUpperCase()));
    if (isFav || !AUTO_TEAMS.length) return;
    const better = await pickGame();
    if (better && better.state === 'in' && better.id !== event && better.abbrs.some((a) => AUTO_TEAMS.includes(String(a).toUpperCase()))) { league = better.league; event = better.id; G = null; tickKey = ''; poll(); }
    return;
  }
  if (cur && cur.state === 'post') { if (!finalSince) finalSince = Date.now(); if (Date.now() - finalSince < 15 * 60000) return; }
  const g = await pickGame();
  if (g && (g.id !== event || g.league !== league)) { league = g.league; event = g.id; G = null; finalSince = 0; tickKey = ''; poll(); }
}

async function poll() {
  try {
    if (!event) return;
    const g = await FEED.game(league, event);
    if (g.error) throw new Error(g.error);
    G = g; render(g);
    window.__ready = true; window.__state = g.state;
  } catch (e) {
    if (!G) $('app').innerHTML = `<div class="err">Waiting for live data… (${esc(e.message)})</div>`;
  }
}
setInterval(() => { $('now').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' }) + ' ET'; }, 1000);
setInterval(() => { slide++; if (G && ['break', 'final'].includes(phase(G))) render(G); }, 12000);
setInterval(() => { if (G && phase(G) === 'pre') render(G); }, 1000);
// subscribe reminder: 8 seconds every 7 minutes (first after 90 s)
const sub = () => { $('sub').classList.add('on'); setTimeout(() => $('sub').classList.remove('on'), 8000); };
setTimeout(() => { sub(); setInterval(sub, 7 * 60000); }, q.has('demo') ? 1000 : 90000);
// demo hooks for previews: ?demo=pop | trans
if (q.get('demo') === 'trans') setTimeout(() => G && transition(G, 'break'), 800);
if (q.get('demo') === 'pop') setTimeout(() => { if (G) { const p = G.plays.find((x) => x.big) || G.plays[0]; p && popup(p, G); } }, 800);
if (AUTO) { autoTick().then(poll); setInterval(autoTick, 60000); } else poll();
setInterval(poll, 5000);
</script>
</body></html>
