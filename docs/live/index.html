<!doctype html>
<html><head><meta charset="utf-8"><title>ScoreBuzz Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060914;--panel:rgba(16,22,46,.92);--panel2:#0C1128;--line:rgba(255,255,255,.08);--ink:#F4F6FC;--mute:#9AA3C7;--dim:#5B638C;--lime:#BEFF3C;--acc:#FF8A3D;--red:#FF2D46;--away:#3D7BFF;--home:#FF8A3D;--awayInk:#fff;--homeInk:#fff}
html{overflow:hidden;background:var(--bg)}
body{width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--bg);color:var(--ink);font-family:Inter,'Segoe UI',Roboto,sans-serif;position:relative}
.num{font-family:'Barlow Condensed',Inter,sans-serif;font-variant-numeric:tabular-nums}
.bgfx{position:absolute;inset:0;background:radial-gradient(900px 600px at 0% 0%,color-mix(in srgb,var(--away) 28%,transparent),transparent 70%),radial-gradient(900px 600px at 100% 0%,color-mix(in srgb,var(--home) 28%,transparent),transparent 70%),radial-gradient(1200px 500px at 50% 120%,#1B2A6B55,transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(#000,transparent 60%);opacity:.35}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 50px #0008,inset 0 1px 0 #ffffff10;backdrop-filter:blur(8px);position:relative;overflow:hidden}
.h{font-size:15px;font-weight:800;letter-spacing:3px;color:var(--mute);text-transform:uppercase}

/* header */
header{position:absolute;top:22px;left:28px;right:28px;height:56px;display:flex;align-items:center;gap:16px}
.logo{font-size:38px;font-weight:900;letter-spacing:-1.4px}.logo b{color:var(--lime)}
.pill{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:2px;padding:9px 18px;border-radius:999px;background:#ffffff12;border:1px solid var(--line)}
.pill.live{background:var(--red);border-color:transparent;box-shadow:0 0 30px #FF2D4666}
.pill i{width:11px;height:11px;border-radius:50%;background:#fff}.pill.live i{animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.hc{margin-left:auto;display:flex;gap:12px;align-items:center}
.chip{font-size:17px;font-weight:800;letter-spacing:2px;padding:9px 16px;border-radius:12px;background:#ffffff0d;border:1px solid var(--line);color:var(--mute)}
.chip.acc{color:var(--acc)}

/* team sidebars */
.side{position:absolute;top:96px;bottom:104px;width:452px;display:flex;flex-direction:column;gap:16px}
.side.l{left:28px}.side.r{right:28px}
.team{height:372px;padding:24px 28px 20px;display:flex;flex-direction:column;align-items:center}
.team:before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 70%,transparent),transparent 62%);opacity:.75}
.team:after{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:var(--tc)}
.team>*{position:relative}
.trow{display:flex;align-items:center;gap:20px;width:100%}
.lg{width:112px;height:112px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#ffffff22,transparent 60%),var(--tc);border:3px solid #ffffff30;position:relative;overflow:hidden;box-shadow:0 10px 30px #0007}
.lg span{font-weight:900;font-size:34px;color:var(--ti)}
.lg img{position:absolute;inset:12%;width:76%;height:76%;object-fit:contain;filter:drop-shadow(0 4px 8px #0008)}
.lg.ok{background:radial-gradient(circle,#ffffff26,#ffffff08 70%);border-color:#ffffff22}.lg.ok span{display:none}
.tn{min-width:0}.tn .n{font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .rec{font-size:19px;color:#ffffffcc;font-weight:700;margin-top:8px}
.tn .poss{display:inline-block;margin-top:8px;font-size:14px;font-weight:900;letter-spacing:2px;color:var(--bg);background:var(--lime);padding:4px 10px;border-radius:8px}
.score{font-size:160px;font-weight:800;line-height:.88;margin-top:6px;letter-spacing:-2px;text-shadow:0 8px 40px #0009}
.score.lose{color:#ffffff80}
.score.flash{animation:sflash 2.6s ease-out}
@keyframes sflash{0%{color:var(--lime);transform:scale(1.18);text-shadow:0 0 60px var(--lime)}100%{transform:scale(1)}}
.ls{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.ls div{min-width:58px;padding:7px 8px;border-radius:10px;background:#00000040;border:1px solid var(--line);text-align:center}
.ls b{display:block;font-size:13px;color:var(--mute);letter-spacing:1px}.ls span{font-size:26px;font-weight:700}
.ls div.cur{border-color:var(--lime)}.ls div.cur b{color:var(--lime)}
.card{padding:20px 24px}
.ldr{display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ldr:first-of-type{border-top:none}
.ldr .c{font-size:15px;font-weight:800;color:var(--mute);letter-spacing:1px}
.ldr .p{font-size:23px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldr .v{font-size:40px;font-weight:800;color:var(--tc2)}
.st{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;padding:6px 0}
.st .k{font-size:18px;font-weight:700;color:var(--mute)}.st .v{font-size:28px;font-weight:800}
.st .bar{grid-column:1/3;height:6px;border-radius:9px;background:#ffffff10;overflow:hidden}.st .bar i{display:block;height:100%;background:var(--tc2);border-radius:9px;transition:width 1s}
.st .bar.win i{box-shadow:0 0 12px var(--tc2)}

/* center */
.center{position:absolute;top:96px;bottom:104px;left:500px;right:500px;display:flex;flex-direction:column;gap:16px}
.status{height:84px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px}
.status .clk{text-align:center}.status .clk .p{font-size:16px;font-weight:800;letter-spacing:3px;color:var(--acc)}
.status .clk .t{font-size:52px;font-weight:800;line-height:.95;white-space:nowrap}.status .clk .t.w{font-size:40px;letter-spacing:1px}
.lead{font-size:20px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.lead i{width:12px;height:12px;border-radius:3px;background:var(--lc,#fff)}
.lead.r{justify-content:flex-end;color:var(--mute);font-size:16px;font-weight:700;letter-spacing:1px}
.runb{font-size:15px;font-weight:900;letter-spacing:2px;color:var(--bg);background:var(--lime);padding:5px 10px;border-radius:8px;margin-left:6px}
.stage{flex:1;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stage svg{display:block}
.stage .cap{position:absolute;top:16px;left:20px}
.legend{position:absolute;top:14px;right:18px;display:flex;gap:14px;font-size:14px;font-weight:700;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.wp{height:74px;padding:12px 22px;display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:16px}
.wp .s{font-size:34px;font-weight:800}.wp .s small{display:block;font-family:Inter;font-size:12px;letter-spacing:2px;color:var(--mute);font-weight:800}
.wp .s.r{text-align:right}
.wpbar{height:16px;border-radius:99px;background:var(--home);overflow:hidden;position:relative}
.wpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--away);transition:width 1.2s;border-right:3px solid #fff}
.wpwrap{position:relative}.wpwrap svg{position:absolute;left:0;right:0;bottom:30px;width:100%;height:22px;opacity:.6}
.plays{height:268px;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.pl{display:grid;grid-template-columns:6px 46px 108px 1fr auto;gap:14px;align-items:center;height:48px;padding-right:12px;border-radius:12px;background:#ffffff08}
@keyframes slide{from{opacity:0;transform:translateY(-14px)}}
.pl .bar{height:100%;border-radius:12px 0 0 12px;background:var(--pc)}
.pl .lg{width:38px;height:38px;border-width:2px}.pl .lg span{font-size:12px}
.pl .k{font-size:16px;font-weight:700;color:var(--mute)}
.pl .x{font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pts{font-size:24px;font-weight:800;color:var(--bg);background:var(--lime);border-radius:9px;padding:0 10px}
.pl.big{background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 35%,transparent),#ffffff06)}
/* popup on stage */
.pop{position:absolute;left:50%;top:440px;transform:translate(-50%,-50%) scale(.6);opacity:0;width:620px;padding:22px 26px;border-radius:22px;background:linear-gradient(120deg,var(--pc),color-mix(in srgb,var(--pc) 40%,#0C1128));box-shadow:0 30px 80px #000b;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;transition:all .45s cubic-bezier(.2,1.4,.4,1);z-index:5}
.pop.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.pop .t{font-size:16px;font-weight:900;letter-spacing:3px;color:#ffffffcc}.pop .x{font-size:26px;font-weight:800;line-height:1.2;margin-top:4px}
.pop .v{font-size:84px;font-weight:800;line-height:.9;color:var(--lime);text-shadow:0 0 30px #BEFF3C88}
/* break / pre views */
.cmp{width:100%;height:100%;padding:24px 34px;display:flex;flex-direction:column}
.cmp .row{display:grid;grid-template-columns:110px 1fr 220px 1fr 110px;align-items:center;gap:12px;padding:9px 0}
.cmp .row .v{font-size:34px;font-weight:800}.cmp .row .v.r{text-align:right}
.cmp .row .k{text-align:center;font-size:17px;font-weight:800;letter-spacing:1px;color:var(--mute);text-transform:uppercase}
.cmp .row .b{height:10px;border-radius:9px;background:#ffffff10;overflow:hidden;display:flex}
.cmp .row .b.l{justify-content:flex-end}.cmp .row .b i{height:100%;border-radius:9px}
.boxt{width:100%;border-collapse:collapse}.boxt td,.boxt th{padding:7px 8px;font-size:21px;text-align:center}
.boxt th{font-size:14px;letter-spacing:2px;color:var(--mute)}.boxt td:first-child,.boxt th:first-child{text-align:left}
.boxt td.n{font-family:'Barlow Condensed',Inter;font-size:28px;font-weight:700}
.pre{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;text-align:center}
.pre .vs{display:flex;align-items:center;gap:46px}.pre .vs .lg{width:150px;height:150px}.pre .vs .lg span{font-size:44px}
.pre .vs b{font-size:56px;font-weight:900;color:var(--mute)}
.pre .cd{font-size:120px;font-weight:800;line-height:.9}
.pre .when{font-size:24px;font-weight:700;color:var(--mute)}
/* full-screen transition banner */
.trans{position:absolute;inset:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;opacity:0;pointer-events:none;transition:opacity .5s}
.trans.on{opacity:1}
.trans .half{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.trans .half.a{background:linear-gradient(110deg,var(--away),color-mix(in srgb,var(--away) 45%,#000))}
.trans .half.b{background:linear-gradient(250deg,var(--home),color-mix(in srgb,var(--home) 45%,#000))}
.trans .lg{width:220px;height:220px}.trans .lg span{font-size:64px}
.trans .half .s{font-size:220px;font-weight:800;line-height:.85}
.trans .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#060914;border:2px solid #ffffff22;border-radius:26px;padding:26px 50px;text-align:center;box-shadow:0 30px 90px #000}
.trans .mid .t{font-size:58px;font-weight:900;letter-spacing:-1px}.trans .mid .s2{font-size:20px;font-weight:800;letter-spacing:4px;color:var(--lime);margin-top:6px}
/* subscribe toast */
.sub{position:absolute;bottom:120px;left:50%;transform:translate(-50%,40px);opacity:0;display:flex;align-items:center;gap:18px;padding:14px 18px 14px 14px;border-radius:20px;background:#0C1128;border:1px solid #ffffff22;box-shadow:0 20px 60px #000c;transition:all .5s;z-index:10}
.sub.on{opacity:1;transform:translate(-50%,0)}
.sub .av{width:62px;height:62px;border-radius:50%;background:var(--lime);color:var(--bg);display:grid;place-items:center;font-weight:900;font-size:24px}
.sub .tx b{display:block;font-size:24px}.sub .tx span{color:var(--mute);font-size:17px;font-weight:600}
.btn{background:var(--red);color:#fff;font-weight:900;font-size:19px;letter-spacing:1px;padding:12px 20px;border-radius:12px;display:flex;align-items:center;gap:8px}
.bell{display:inline-block;animation:ring 2.4s infinite;transform-origin:50% 0}
@keyframes ring{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(18deg)}75%{transform:rotate(-16deg)}85%{transform:rotate(10deg)}}
/* footer */
footer{position:absolute;left:0;right:0;bottom:0;height:80px;background:#04060E;border-top:1px solid var(--line);display:flex;align-items:center}
.fb{flex:none;height:100%;display:flex;align-items:center;gap:10px;padding:0 26px;background:var(--lime);color:var(--bg);font-weight:900;font-size:22px;letter-spacing:1px}
.tick{flex:1;overflow:hidden;white-space:nowrap;height:100%;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tick>div{display:inline-flex;align-items:center;animation:scroll var(--dur,80s) linear infinite}
@keyframes scroll{to{transform:translateX(-50%)}}
.tk{display:inline-flex;align-items:center;gap:10px;margin-right:44px;font-size:21px;font-weight:700}
.tk .lg{width:30px;height:30px;border-width:1px}.tk .lg span{font-size:10px}
.tk b{font-family:'Barlow Condensed',Inter;font-size:27px}.tk em{font-style:normal;font-size:15px;color:var(--mute);font-weight:800;letter-spacing:1px;margin-left:4px}
.tk.lab{color:var(--lime);font-weight:900;letter-spacing:2px}
.fsub{flex:none;margin:0 20px}
.err{position:absolute;inset:0;display:grid;place-items:center;font-size:36px;color:var(--mute)}
</style></head>
<body><script>(function(){
// Fit the 1920x1080 design to whatever window it is shown in.
//   ?fit=contain (default: whole board visible, dark bars if the shape differs) | fill (stretch to exactly fill) | none
//   ?w=1280&h=720  fit into this box (top-left) instead of the window, for studios whose web layer shows only part of the page
//   ?size=1  shows the window size the streaming studio really uses (to debug cropping)
var P=new URLSearchParams(location.search),mode=P.get('fit')||'contain';
function fit(){var W=+P.get('w')||innerWidth,H=+P.get('h')||innerHeight,b=document.body,sx=W/1920,sy=H/1080;
 b.style.marginLeft=b.style.marginTop='0px';
 if(mode==='none'||!W||!H){b.style.transform='';}
 else if(mode==='fill'){b.style.transform='scale('+sx+','+sy+')';}
 else{var s=Math.min(sx,sy);b.style.transform='scale('+s+')';b.style.marginLeft=((W-1920*s)/2)+'px';b.style.marginTop=((H-1080*s)/2)+'px';}
 var d=document.getElementById('__sz');if(P.has('size')){if(!d){d=document.createElement('div');d.id='__sz';d.style.cssText='position:fixed;left:0;top:0;z-index:99999;background:#ff0;color:#000;font:bold 28px sans-serif;padding:6px 12px';document.documentElement.appendChild(d);}d.textContent='window '+innerWidth+' x '+innerHeight+' · fit '+W+' x '+H+' · dpr '+devicePixelRatio;}}
addEventListener('resize',fit);addEventListener('DOMContentLoaded',fit);addEventListener('load',fit);setInterval(fit,2000);fit();})();</script>

<header>
  <div class="logo">Score<b>Buzz</b></div>

  <div class="hc"><div class="chip acc" id="lg"></div><div class="chip" id="venue"></div><div class="chip num" id="now" style="font-size:20px"></div></div>
</header>
<div id="app"><div class="err">Loading live data…</div></div>
<div id="trkL" style="position:absolute;overflow:hidden;z-index:4;display:none;border-radius:14px"><iframe id="trkF" scrolling="no" style="position:absolute;left:0;top:0;width:950px;height:640px;border:0;transform-origin:0 0;background:transparent"></iframe></div>

<script>
const FEED = (function () {
  const module = { exports: {} };
  const require = () => ({});
  const process = { env: {} };
  const fetch = (url) => window.fetch(url, { cache: 'no-store' }); // plain GET: no custom headers, no CORS preflight
  // Live data feed for ScoreBuzz score streams.
// Reads ESPN's public JSON (site.api.espn.com) and turns it into one simple shape the
// scoreboard page understands. ESPN's API is unofficial and undocumented: if a field moves,
// fix it here, nowhere else.
//
// Mock mode: set SCOREBUZZ_MOCK=1 to read tools/live/fixtures/<league>.json instead of ESPN.
const fs = require('fs');
const path = require('path');

const LEAGUES = {
  nba: { path: 'basketball/nba', label: 'NBA', sport: 'nba', periods: 4, otLabel: 'OT' },
  nfl: { path: 'football/nfl', label: 'NFL', sport: 'nfl', periods: 4, otLabel: 'OT' },
  nhl: { path: 'hockey/nhl', label: 'NHL', sport: 'nhl', periods: 3, otLabel: 'OT' },
  ncaaf: { path: 'football/college-football', label: 'NCAAF', sport: 'nfl', periods: 4, otLabel: 'OT' },
  mlb: { path: 'baseball/mlb', label: 'MLB', sport: 'mlb', periods: 9, otLabel: 'X' },
  epl: { path: 'soccer/eng.1', label: 'PREMIER LEAGUE', name: 'Premier League', sport: 'football', periods: 2, soccer: true },
  ucl: { path: 'soccer/uefa.champions', label: 'CHAMPIONS LEAGUE', name: 'Champions League', sport: 'football', periods: 2, soccer: true },
  uel: { path: 'soccer/uefa.europa', label: 'EUROPA LEAGUE', name: 'Europa League', sport: 'football', periods: 2, soccer: true },
  laliga: { path: 'soccer/esp.1', label: 'LALIGA', name: 'LaLiga', sport: 'football', periods: 2, soccer: true },
  seriea: { path: 'soccer/ita.1', label: 'SERIE A', name: 'Serie A', sport: 'football', periods: 2, soccer: true },
  bundesliga: { path: 'soccer/ger.1', label: 'BUNDESLIGA', name: 'Bundesliga', sport: 'football', periods: 2, soccer: true },
  mls: { path: 'soccer/usa.1', label: 'MLS', sport: 'football', periods: 2, soccer: true },
};

const BASE = 'https://site.api.espn.com/apis/site/v2/sports';
const MOCK = process.env.SCOREBUZZ_MOCK === '1';
const cache = new Map();

async function getJSON(url, ttlMs = 8000) {
  const hit = cache.get(url);
  if (hit && Date.now() - hit.t < ttlMs) return hit.v;
  const res = await fetch(url, { headers: { 'user-agent': 'ScoreBuzz live scoreboard (scorebuzz.net)' } });
  if (!res.ok) throw new Error(`${res.status} ${url}`);
  const v = await res.json();
  cache.set(url, { t: Date.now(), v });
  return v;
}

function mock(league) {
  return JSON.parse(fs.readFileSync(path.join(__dirname, 'fixtures', `${league}.json`), 'utf8'));
}

// date: optional YYYYMMDD
async function scoreboard(league, date) {
  const L = LEAGUES[league];
  if (!L) throw new Error(`unknown league ${league}. Use one of: ${Object.keys(LEAGUES).join(', ')}`);
  if (MOCK) return mock(league).scoreboard;
  return getJSON(`${BASE}/${L.path}/scoreboard${date ? `?dates=${date}` : ''}`);
}

async function summary(league, eventId) {
  if (MOCK) return mock(league).summary || {};
  try {
    return await getJSON(`${BASE}/${LEAGUES[league].path}/summary?event=${eventId}`, 10000);
  } catch {
    return {}; // play-by-play is a bonus; the scoreboard still works without it
  }
}

const hex = (c, d) => (c && /^[0-9a-f]{6}$/i.test(c) ? `#${c}` : d);

function team(c) {
  const t = c.team || {};
  return {
    id: t.id,
    name: t.shortDisplayName || t.name || t.displayName || '?',
    full: t.displayName || t.name || '?',
    abbr: t.abbreviation || (t.name || '?').slice(0, 3).toUpperCase(),
    logo: t.logo || t.logos?.[0]?.href || '', // ESPN team logo / national flag URL
    color: hex(t.color, '#2A3570'),
    alt: hex(t.alternateColor, '#FFFFFF'),
    score: c.score ?? '0',
    record: (c.records || []).find((r) => r.type === 'total' || r.name === 'overall')?.summary || c.records?.[0]?.summary || '',
    lines: (c.linescores || []).map((l) => l.displayValue ?? String(l.value ?? '')),
  };
}

// Top performer per category for both teams: [{ cat, home: {name, value}, away: {name, value} }]
function leaders(comp) {
  const by = {};
  const order = [];
  for (const c of comp.competitors || []) {
    for (const cat of (c.leaders || []).slice(0, 3)) {
      const top = cat.leaders?.[0];
      if (!top) continue;
      const k = cat.abbreviation || cat.shortDisplayName || cat.name || '';
      if (!by[k]) { by[k] = { cat: k }; order.push(k); }
      let value = top.displayValue || String(top.value ?? '');
      // football season leaders come as "188/233, 2425 YDS, 25 TD, 1 INT": keep the yards so it fits the panel
      if (value.length > 9) value = (value.match(/[\d,]+ YDS/) || [value.split(',')[0]])[0].replace(' YDS', '');
      by[k][c.homeAway] = { name: top.athlete?.shortName || top.athlete?.displayName || '', value };
    }
  }
  return order.map((k) => by[k]);
}

// football: goalscorers in the "game leaders" panel (cat = ball icon, value = minute)
function soccerLeaders(home, away) {
  const n = Math.min(4, Math.max(home.scorers?.length || 0, away.scorers?.length || 0));
  return Array.from({ length: n }, (_, i) => ({ cat: 'GOAL', home: home.scorers[i], away: away.scorers[i] }));
}
function periodLabel(n, L) {
  if (!n) return '';
  if (L.sport === 'mlb') return `INN ${n}`;
  if (n > L.periods) return n - L.periods > 1 ? `OT${n - L.periods}` : 'OT';
  return `${L.sport === 'nhl' ? 'P' : 'Q'}${n}`;
}

// Soccer live tracker: last actions with pitch coordinates from ESPN commentary.
// fieldPositionX/Y are 0-100 from the acting team's view (attacking towards x=100);
// we draw home attacking right, so away actions are mirrored.
function tracker(sum, comp, home, away) {
  const byName = {};
  for (const c of comp.competitors || []) {
    const ab = c.homeAway === 'home' ? home.abbr : away.abbr;
    for (const n of [c.team?.displayName, c.team?.name, c.team?.shortDisplayName]) if (n) byName[n] = ab;
  }
  const out = [];
  for (const c of sum.commentary || []) {
    const p = c.play;
    if (!p || p.fieldPositionX == null || p.fieldPositionY == null) continue;
    const t = byName[p.team?.displayName] || '';
    if (!t) continue;
    const isHome = t === home.abbr;
    const x = isHome ? p.fieldPositionX : 100 - p.fieldPositionX;
    const y = isHome ? p.fieldPositionY : 100 - p.fieldPositionY;
    const who = p.participants?.[0]?.athlete?.displayName || '';
    out.push({ id: String(p.id || c.sequence), min: c.time?.displayValue || p.clock?.displayValue || '', team: t, home: isHome,
      x: Math.max(0, Math.min(100, x)), y: Math.max(0, Math.min(100, y)), type: p.type?.text || '', who, att: p.fieldPositionX });
  }
  const seen = new Set();
  return out.filter((e) => !seen.has(e.id) && seen.add(e.id)).slice(-6);
}

function plays(sum, comp, teamsById, L) {
  let list = [];
  if (L.soccer) {
    // goals and cards from the scoreboard; commentary from the summary when available
    list = (comp.details || []).map((d) => ({
      clock: d.clock?.displayValue || '',
      text: `${d.type?.text || 'Event'}${d.athletesInvolved?.length ? ` · ${d.athletesInvolved.map((a) => a.displayName).join(', ')}` : ''}`,
      team: teamsById[d.team?.id] || '',
      big: !!d.scoringPlay || !!d.redCard,
      id: `${d.clock?.displayValue}-${d.type?.text}`,
      type: d.scoringPlay ? 'Goal' : d.type?.text || '',
    }));
    if (Array.isArray(sum.keyEvents) && sum.keyEvents.length) {
      list = sum.keyEvents.map((k) => ({
        clock: k.clock?.displayValue || '',
        text: k.text || k.type?.text || '',
        team: teamsById[k.team?.id] || '',
        big: !!k.scoringPlay,
        id: k.id || `${k.clock?.displayValue}-${k.type?.text}`,
        type: k.scoringPlay ? 'Goal' : k.type?.text || '',
      }));
      // keep the moments that matter (goals, cards, penalties, half/full time) ahead of substitutions
      const key = list.filter((x) => x.big || /goal|card|penalty|half|kick|end|start|var/i.test(`${x.type} ${x.text}`) && !/substitution/i.test(x.text));
      if (key.length >= 4) list = key;
    }
  } else {
    const raw = sum.plays || sum.drives?.current?.plays || [];
    list = raw.map((p) => ({
      id: p.id || p.sequenceNumber || '',
      type: p.type?.text || '',
      value: p.scoreValue || 0,
      clock: [periodLabel(p.period?.number, L), p.clock?.displayValue].filter(Boolean).join(' '),
      text: p.text || p.type?.text || '',
      team: teamsById[p.team?.id] || '',
      big: !!p.scoringPlay && (L.sport !== 'nba' || (p.scoreValue || 0) >= 3),
    }));
  }
  return list.filter((p) => p.text).slice(-7).reverse();
}


// ---- extra panels (all optional: each returns null/[] when ESPN doesn't provide the data) ----

const STAT_PICK = {
  nba: ['fieldGoalPct', 'threePointFieldGoalPct', 'freeThrowPct', 'totalRebounds', 'assists', 'turnovers', 'steals', 'blocks'],
  nfl: ['totalYards', 'netPassingYards', 'rushingYards', 'firstDowns', 'turnovers', 'possessionTime', 'thirdDownEff'],
  nhl: ['shotsTotal', 'powerPlayGoals', 'faceoffPercent', 'hits', 'blockedShots', 'takeaways', 'giveaways'],
  mlb: ['hits', 'errors', 'homeRuns', 'strikeouts', 'walks', 'leftOnBase'],
  football: ['possessionPct', 'totalShots', 'shotsOnTarget', 'wonCorners', 'foulsCommitted', 'saves', 'offsides'],
};
const num = (v) => { const n = parseFloat(String(v).replace('%', '')); return Number.isFinite(n) ? n : null; };

// Team stat comparison rows: [{ label, home, away, h, a }] (h/a numeric for the bars)
function teamStats(sum, L, home, away) {
  const teams = sum.boxscore?.teams || [];
  const side = (id) => teams.find((t) => String(t.team?.id) === String(id))?.statistics || [];
  const hs = side(home.id), as = side(away.id);
  if (!hs.length || !as.length) return [];
  const want = STAT_PICK[L.sport] || [];
  let names = want.filter((n) => hs.some((x) => x.name === n));
  if (names.length < 3) names = hs.filter((x) => num(x.displayValue) !== null && !String(x.displayValue).includes('-')).map((x) => x.name);
  return names.slice(0, 6).map((n) => {
    const h = hs.find((x) => x.name === n) || {}, a = as.find((x) => x.name === n) || {};
    const toNum = (x) => (n === 'possessionTime' ? (([m, sec]) => m * 60 + +sec)(String(x.displayValue || '0:0').split(':').map(Number)) : num(x.displayValue));
    return { label: (h.label || h.abbreviation || n).replace(/Percentage/i, '%'), home: h.displayValue ?? '–', away: a.displayValue ?? '–', h: toNum(h) ?? 0, a: toNum(a) ?? 0 };
  });
}

// Home win probability over the game, 0..100, max ~120 points (NBA, NFL, NCAAF)
function winProb(sum) {
  const wp = sum.winprobability || [];
  if (!wp.length) return null;
  const step = Math.max(1, Math.ceil(wp.length / 120));
  const series = wp.filter((_, i) => i % step === 0 || i === wp.length - 1).map((w) => Math.round((w.homeWinPercentage ?? 0.5) * 1000) / 10);
  return { home: series[series.length - 1], series };
}

// Score margin (home - away) after each scoring play: game-flow chart
function flow(sum) {
  const raw = (sum.plays || []).filter((p) => p.scoringPlay && p.homeScore != null);
  if (raw.length < 2) return null;
  const step = Math.max(1, Math.ceil(raw.length / 150));
  return [0, ...raw.filter((_, i) => i % step === 0 || i === raw.length - 1).map((p) => p.homeScore - p.awayScore)];
}

// NFL/NCAAF ball position on a 0..100 field drawn away end-zone left, home end-zone right
function field(sit, home, away, teamsById) {
  if (!sit || !sit.possessionText) return null;
  const m = String(sit.possessionText).match(/([A-Z&]+)\s+(\d+)/i);
  if (!m) return null;
  const side = m[1].toUpperCase(), yd = Number(m[2]);
  const ball = side === home.abbr ? 100 - yd : side === away.abbr ? yd : 50;
  const poss = teamsById[sit.possession] || '';
  const dir = poss === away.abbr ? 1 : -1; // away team attacks towards the home end zone (right)
  return { ball, firstDown: sit.distance ? Math.max(0, Math.min(100, ball + dir * sit.distance)) : null, poss, dir, text: sit.downDistanceText || '' };
}

// Football timeline: goals and cards with minute for the 0-90' bar
function timeline(comp, teamsById) {
  return (comp.details || []).map((d) => ({
    min: parseInt(d.clock?.displayValue, 10) || 0,
    team: teamsById[d.team?.id] || '',
    kind: d.scoringPlay ? 'goal' : d.redCard ? 'red' : d.yellowCard ? 'yellow' : 'other',
    who: d.athletesInvolved?.[0]?.shortName || d.athletesInvolved?.[0]?.displayName || '',
  })).filter((x) => x.kind !== 'other');
}

// Top players per team from the box score: { cols: [...], home: [[name, ...]], away: [...] }
const BOX = { nba: { sort: 'PTS', cols: ['PTS', 'REB', 'AST'] }, nhl: { sort: 'PTS', cols: ['G', 'A', 'SOG'] } };
function box(sum, L, home, away) {
  const cfg = BOX[L.sport];
  if (!cfg) return null;
  const pick = (id) => {
    const g = (sum.boxscore?.players || []).find((x) => String(x.team?.id) === String(id))?.statistics?.[0];
    if (!g) return [];
    const labels = g.labels || g.names || [];
    const idx = (k) => labels.indexOf(k);
    if (idx(cfg.sort) < 0) return [];
    return (g.athletes || []).filter((a) => a.stats?.length)
      .map((a) => ({ name: a.athlete?.shortName || a.athlete?.displayName || '', v: cfg.cols.map((c) => a.stats[idx(c)] ?? '–'), s: num(a.stats[idx(cfg.sort)]) || 0 }))
      .sort((x, y) => y.s - x.s).slice(0, 4).map((x) => [x.name, ...x.v]);
  };
  const h = pick(home.id), a = pick(away.id);
  return h.length || a.length ? { cols: cfg.cols, home: h, away: a } : null;
}

// NBA/NHL shot chart: last 60 shooting plays with court coordinates.
// ESPN NBA coordinates are feet on a half court (x 0-50 across, y 0-47 from the baseline);
// free throws and missing locations come through as huge negative numbers and are dropped.
function shots(sum, teamsById, L) {
  if (!['nba', 'nhl'].includes(L.sport)) return [];
  return (sum.plays || [])
    .filter((p) => (p.shootingPlay || /shot/i.test(p.type?.text || '')) && p.coordinate && Math.abs(p.coordinate.x) < 200 && Math.abs(p.coordinate.y) < 200)
    .slice(-60)
    .map((p) => ({ x: p.coordinate.x, y: p.coordinate.y, made: !!p.scoringPlay, team: teamsById[p.team?.id] || '', v: p.scoreValue || 0 }));
}

// Current scoring run, e.g. { team: 'MEM', for: 10, against: 0 } when one side has scored the last 8+ points
function run(sum, home, away) {
  const sp = (sum.plays || []).filter((p) => p.scoringPlay && p.homeScore != null);
  if (sp.length < 3) return null;
  let h = 0, a = 0, last = sp[sp.length - 1];
  for (let i = sp.length - 1; i > 0; i--) {
    const dh = sp[i].homeScore - sp[i - 1].homeScore, da = sp[i].awayScore - sp[i - 1].awayScore;
    if ((dh > 0 && a > 0) || (da > 0 && h > 0)) break;
    h += Math.max(0, dh); a += Math.max(0, da);
  }
  const best = Math.max(h, a);
  if (best < 8 || !last) return null;
  return { team: h > a ? home.abbr : away.abbr, for: best, against: 0 };
}

// MLB at-bat situation
function mlbSit(sit) {
  if (sit.balls == null && sit.outs == null) return null;
  return {
    balls: sit.balls ?? 0, strikes: sit.strikes ?? 0, outs: sit.outs ?? 0,
    bases: [!!sit.onFirst, !!sit.onSecond, !!sit.onThird],
    batter: sit.batter?.athlete?.shortName || '', pitcher: sit.pitcher?.athlete?.shortName || '',
  };
}

function statusText(st, L) {
  const s = st?.type || {};
  if (s.state === 'pre') return 'UPCOMING';
  if (s.completed) return (s.shortDetail || 'FINAL').toUpperCase();
  if (L.soccer) return (st.displayClock || s.shortDetail || '').toUpperCase();
  return (s.shortDetail || `${st.period} ${st.displayClock}`).toUpperCase();
}

async function game(league, eventId) {
  const L = LEAGUES[league];
  let sb = await scoreboard(league);
  let ev = (sb.events || []).find((e) => String(e.id) === String(eventId));
  if (!ev && !MOCK) {
    // ESPN's default scoreboard rolls over to the next US day around 6-11am ET, and a stream may start
    // before that: look the game's date up in its summary and load that day's scoreboard instead.
    try {
      const s0 = await summary(league, eventId);
      const d = s0?.header?.competitions?.[0]?.date;
      if (d) {
        const ymd = new Date(d).toLocaleDateString('en-CA', { timeZone: 'America/New_York' }).replace(/-/g, '');
        sb = await scoreboard(league, ymd);
        ev = (sb.events || []).find((e) => String(e.id) === String(eventId));
      }
    } catch (e) { /* fall through to the error below */ }
  }
  if (!ev) throw new Error(`event ${eventId} is not on the ${league} scoreboard`);
  const comp = ev.competitions[0];
  const home = team(comp.competitors.find((c) => c.homeAway === 'home'));
  const away = team(comp.competitors.find((c) => c.homeAway === 'away'));
  const teamsById = { [home.id]: home.abbr, [away.id]: away.abbr };
  const sum = ev.status?.type?.state === 'pre' ? {} : await summary(league, eventId);
  const sit = comp.situation || {};
  if (L.soccer) {
    // football: ESPN's scoreboard has no half-by-half linescores, so build them from the goals,
    // and show each side's goalscorers where US sports show game leaders
    const goals = (comp.details || []).filter((d) => d.scoringPlay).map((d) => ({
      min: parseInt(d.clock?.displayValue, 10) || 0, label: d.clock?.displayValue || '',
      team: String(d.team?.id), who: (d.athletesInvolved?.[0]?.shortName || '') + (d.ownGoal ? ' (OG)' : d.penaltyKick ? ' (pen)' : ''),
      half: /^45'\+|^([0-9]|[1-3][0-9]|4[0-5])'/.test(d.clock?.displayValue || '') ? 0 : 1,
    }));
    const st = ev.status?.type?.state;
    for (const t of [home, away]) {
      if (!t.lines.length && st !== 'pre') {
        const h1 = goals.filter((g) => g.team === String(t.id) && g.half === 0).length;
        const h2 = goals.filter((g) => g.team === String(t.id) && g.half === 1).length;
        t.lines = (ev.status?.period || 1) >= 2 || st === 'post' ? [String(h1), String(h2)] : [String(h1)];
      }
      t.scorers = goals.filter((g) => g.team === String(t.id)).map((g) => ({ name: g.who, value: g.label }));
    }
  }
  return {
    league,
    label: L.label,
    sport: L.sport,
    soccer: !!L.soccer,
    periods: L.periods,
    id: ev.id,
    state: ev.status?.type?.state || 'pre', // pre | in | post
    status: statusText(ev.status, L),
    start: ev.date,
    venue: comp.venue?.fullName || '',
    broadcast: (comp.broadcasts || []).flatMap((b) => b.names || []).join(' · '),
    home,
    away,
    leaders: L.soccer ? soccerLeaders(home, away) : leaders(comp),
    situation: L.sport === 'nfl' && sit.downDistanceText
      ? { text: sit.downDistanceText, possession: teamsById[sit.possession] || '', redZone: !!sit.isRedZone }
      : null,
    lastPlay: sit.lastPlay?.text || '',
    plays: plays(sum, comp, teamsById, L),
    stats: teamStats(sum, L, home, away),
    winProb: winProb(sum),
    flow: flow(sum),
    field: L.sport === 'nfl' && ev.status?.type?.state === 'in' ? field(sit, home, away, teamsById) : null,
    timeline: L.soccer ? timeline(comp, teamsById) : [],
    tracker: L.soccer && sum.commentary ? tracker(sum, comp, home, away) : [],
    box: box(sum, L, home, away),
    shots: shots(sum, teamsById, L),
    run: L.soccer ? null : run(sum, home, away),
    mlb: L.sport === 'mlb' && ev.status?.type?.state === 'in' ? mlbSit(sit) : null,
    drive: sum.drives?.current?.description || '',
    detail: ev.status?.type?.detail || '',
    period: ev.status?.period || 0,
    clock: ev.status?.displayClock || '',
    ticker: (sb.events || []).filter((e) => e.id !== ev.id).map((e) => {
      const c = e.competitions[0];
      const h = c.competitors.find((x) => x.homeAway === 'home');
      const a = c.competitors.find((x) => x.homeAway === 'away');
      const pre = e.status?.type?.state === 'pre';
      return {
        a: a.team.abbreviation, as: pre ? '' : a.score, al: a.team.logo || '',
        h: h.team.abbreviation, hs: pre ? '' : h.score, hl: h.team.logo || '',
        st: pre ? new Date(e.date).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' }) + ' ET'
          : (e.status?.type?.shortDetail || '').toUpperCase(),
      };
    }),
    updated: new Date().toISOString(),
  };
}

// Today's games for a league, with a ready-made YouTube title and description.
async function list(league, date) {
  const L = LEAGUES[league];
  const sb = await scoreboard(league, date);
  return (sb.events || []).map((e) => {
    const c = e.competitions[0];
    const h = c.competitors.find((x) => x.homeAway === 'home').team;
    const a = c.competitors.find((x) => x.homeAway === 'away').team;
    // US leagues: away vs home ("Knicks at Celtics" order); football: home v away
    const [t1, t2] = L.soccer ? [h, a] : [a, h];
    // Same pattern as the channels that do this well: "<Team> vs <Team> | NBA Live Scoreboard & Play-by-Play".
    // Say "Scoreboard" plainly so nobody expects game footage.
    const week = e.week?.number || sb.week?.number;
    const tag = league === 'nfl' && week ? `NFL Week ${week}` : L.name || L.label;
    const title = `${t1.displayName} vs ${t2.displayName} | ${tag} Live Scoreboard & Play-by-Play`;
    return {
      league, id: e.id, start: e.date, state: e.status?.type?.state,
      abbrs: [a.abbreviation, h.abbreviation].filter(Boolean),
      // best (lowest) top-25 ranking of the two teams, college only (99 = unranked)
      rank: Math.min(...c.competitors.map((x) => x.curatedRank?.current || 99).map((r) => (r > 0 && r < 26 ? r : 99))),
      matchup: `${t1.displayName} vs ${t2.displayName}`,
      title: title.length > 100 ? `${t1.displayName} vs ${t2.displayName} | ${tag} Live Scoreboard` : title,
      description: [
        `Live score updates for ${t1.displayName} vs ${t2.displayName} (${L.label}): score, clock, period scores, top performers and play-by-play, updated every few seconds.`,
        '',
        'This stream is a live scoreboard. It does not show game footage.',
        '',
        'More live scores, fixtures and results: https://scorebuzz.net',
        '',
        `#${(L.name || L.label).replace(/\s/g, '')} #LiveScore #ScoreBuzz`,
      ].join('\n'),
    };
  });
}

  </div>
  <div class="panel card" style="flex:1;--tc2:${vivid(t)}"><div class="h">Team stats</div>
    ${st.length ? st.map((r) => {
      const me = which === 'home' ? r.h : r.a, ot = which === 'home' ? r.a : r.h, tot = Math.max(me + ot, 0.0001);
      return `<div class="st"><span class="k">${esc(r.label)}</span><span class="v num">${esc(which === 'home' ? r.home : r.away)}</span><div class="bar ${me > ot ? 'win' : ''}"><i style="width:${(me / tot) * 100}%"></i></div></div>`;
    }).join('') : '<div class="st"><span class="k" style="color:var(--dim)">Live team stats appear here</span></div>'}
  </div>`;
}

// ---------------- centre visuals ----------------
function court(g) {
  const W = 780, H = 400, sx = W / 94, sy = H / 50;
  const ac = vivid(g.away), hc = vivid(g.home);
  // home shoots at the left basket, away at the right (display convention)
  const dots = (g.shots || []).map((s) => {
    const isHome = s.team === g.home.abbr;
    const fx = isHome ? s.y : 94 - s.y, fy = s.x;
    if (fx < 0 || fx > 94 || fy < 0 || fy > 50) return '';
    const c = isHome ? hc : ac, X = fx * sx, Y = fy * sy;
    return s.made ? `<circle cx="${X}" cy="${Y}" r="9" fill="${c}" stroke="#fff" stroke-width="2.5"/>`
      : `<g stroke="${c}" stroke-width="3.5" stroke-linecap="round" opacity=".75"><line x1="${X - 7}" y1="${Y - 7}" x2="${X + 7}" y2="${Y + 7}"/><line x1="${X + 7}" y1="${Y - 7}" x2="${X - 7}" y2="${Y + 7}"/></g>`;
  }).join('');
  const L = 'stroke="#ffffff55" stroke-width="3" fill="none"';
  const key = (x0, dir) => `<rect x="${x0 === 0 ? 0 : W - 19 * sx}" y="${17 * sy}" width="${19 * sx}" height="${16 * sy}" ${L} fill-opacity="0"/>
    <circle cx="${x0 === 0 ? 19 * sx : W - 19 * sx}" cy="${25 * sy}" r="${6 * sx}" ${L}/>
    <path d="M ${x0 === 0 ? 0 : W} ${3 * sy} L ${x0 === 0 ? 14 * sx : W - 14 * sx} ${3 * sy} A ${23.75 * sx} ${23.75 * sy} 0 0 ${dir} ${x0 === 0 ? 14 * sx : W - 14 * sx} ${47 * sy} L ${x0 === 0 ? 0 : W} ${47 * sy}" ${L}/>
    <circle cx="${x0 === 0 ? 5.25 * sx : W - 5.25 * sx}" cy="${25 * sy}" r="7" stroke="var(--acc)" stroke-width="3" fill="none"/>`;
  return `<div style="perspective:1400px"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="transform:rotateX(30deg) scale(.96);transform-origin:50% 55%;margin-top:22px;filter:drop-shadow(0 30px 40px #000a)">
    <defs><linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="${hc}" stop-opacity=".22"/><stop offset=".5" stop-color="#1A2350"/><stop offset="1" stop-color="${ac}" stop-opacity=".22"/></linearGradient></defs>
    <rect width="${W}" height="${H}" rx="10" fill="url(#wood)" stroke="#ffffff44" stroke-width="3"/>
    <line x1="${W / 2}" y1="0" x2="${W / 2}" y2="${H}" ${L}/><circle cx="${W / 2}" cy="${H / 2}" r="${6 * sx}" ${L}/>
    <text x="${W / 2}" y="${H / 2 + 12}" text-anchor="middle" font-size="34" font-weight="900" fill="#ffffff22" font-family="Inter">SCOREBUZZ</text>
    ${key(0, 0)}${key(1, 1)}
    <text x="30" y="${H - 18}" font-size="22" font-weight="900" fill="${hc}" font-family="Inter">${esc(g.home.abbr)} ◀</text>
    <text x="${W - 30}" y="${H - 18}" text-anchor="end" font-size="22" font-weight="900" fill="${ac}" font-family="Inter">▶ ${esc(g.away.abbr)}</text>
    ${dots}</svg></div>
    <div class="legend"><span><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#fff"/></svg>MADE</span><span><svg width="16" height="16" stroke="#fff" stroke-width="3"><line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/></svg>MISSED</span></div>
    <div class="h cap">Shot chart</div>`;
}

function field(g) {
  const W = 820, H = 330, ez = W / 12, yd = (W - 2 * ez) / 100, f = g.field;
  const ac = vivid(g.away), hc = vivid(g.home);
  let lines = '';
  for (let i = 5; i < 100; i += 5) lines += `<line x1="${ez + i * yd}" y1="0" x2="${ez + i * yd}" y2="${H}" stroke="#ffffff${i % 10 ? '1c' : '40'}" stroke-width="${i % 10 ? 1.5 : 2.5}"/>`;
  for (let i = 10; i < 100; i += 10) { const n = i > 50 ? 100 - i : i; lines += `<text x="${ez + i * yd}" y="${H - 22}" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff55" font-family="Barlow Condensed,Inter">${n}</text><text x="${ez + i * yd}" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff55" font-family="Barlow Condensed,Inter" transform="rotate(180 ${ez + i * yd} 37)">${n}</text>`; }
  const bx = f ? ez + f.ball * yd : null, fd = f && f.firstDown != null ? ez + f.firstDown * yd : null;
  return `<div style="perspective:1400px"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="transform:rotateX(24deg);transform-origin:50% 55%;margin-top:26px;filter:drop-shadow(0 30px 40px #000a)">
    <defs><linearGradient id="turf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E7A3C"/><stop offset="1" stop-color="#135A2B"/></linearGradient>
    <pattern id="stripe" width="${yd * 10}" height="${H}" patternUnits="userSpaceOnUse" x="${ez}"><rect width="${yd * 5}" height="${H}" fill="#ffffff08"/></pattern></defs>
    <rect width="${W}" height="${H}" rx="10" fill="url(#turf)"/><rect x="${ez}" width="${W - 2 * ez}" height="${H}" fill="url(#stripe)"/>
    <rect width="${ez}" height="${H}" fill="${ac}" opacity=".85" rx="10"/><rect x="${W - ez}" width="${ez}" height="${H}" fill="${hc}" opacity=".85" rx="10"/>
    <text transform="translate(${ez / 2 + 12} ${H / 2}) rotate(-90)" text-anchor="middle" font-size="40" font-weight="900" fill="#fff" font-family="Inter">${esc(g.away.abbr)}</text>
    <text transform="translate(${W - ez / 2 - 12} ${H / 2}) rotate(90)" text-anchor="middle" font-size="40" font-weight="900" fill="#fff" font-family="Inter">${esc(g.home.abbr)}</text>
    ${lines}
    ${fd != null ? `<line x1="${fd}" y1="0" x2="${fd}" y2="${H}" stroke="#FFD23F" stroke-width="6"/>` : ''}
    ${bx != null ? `<line x1="${bx}" y1="0" x2="${bx}" y2="${H}" stroke="#3DA5FF" stroke-width="6"/><g transform="translate(${bx} ${H / 2})"><ellipse rx="22" ry="14" fill="#8B4513" stroke="#fff" stroke-width="3"/><line x1="-9" y1="0" x2="9" y2="0" stroke="#fff" stroke-width="2.5"/></g>
      <path d="M ${bx + f.dir * 30} ${H / 2 - 18} l ${f.dir * 26} 18 l ${-f.dir * 26} 18 z" fill="#fff"/>` : ''}
    </svg></div>
    <div class="h cap">${f ? esc(f.text) + (g.drive ? ' · ' + esc(g.drive) : '') : 'Field'}</div>`;
}

function rink(g) {
  const W = 800, H = 340, sx = W / 200, sy = H / 85, ac = vivid(g.away), hc = vivid(g.home);
  const dots = (g.shots || []).map((s) => {
    const X = (s.x + 100) * sx, Y = (s.y + 42.5) * sy, c = s.team === g.home.abbr ? hc : ac;
    if (X < 0 || X > W || Y < 0 || Y > H) return '';
    return s.made ? `<circle cx="${X}" cy="${Y}" r="11" fill="${c}" stroke="#fff" stroke-width="3"/>` : `<circle cx="${X}" cy="${Y}" r="6" fill="${c}" opacity=".6"/>`;
  }).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="filter:drop-shadow(0 30px 40px #000a)">
    <rect width="${W}" height="${H}" rx="120" fill="#E9F2FA" fill-opacity=".1" stroke="#ffffff66" stroke-width="4"/>
    <line x1="${W / 2}" y1="0" x2="${W / 2}" y2="${H}" stroke="#FF3B4E" stroke-width="5" opacity=".8"/>
    <line x1="${W * .375}" y1="0" x2="${W * .375}" y2="${H}" stroke="#3D7BFF" stroke-width="5" opacity=".8"/><line x1="${W * .625}" y1="0" x2="${W * .625}" y2="${H}" stroke="#3D7BFF" stroke-width="5" opacity=".8"/>
    <line x1="${11 * sx}" y1="10" x2="${11 * sx}" y2="${H - 10}" stroke="#FF3B4E" stroke-width="2"/><line x1="${W - 11 * sx}" y1="10" x2="${W - 11 * sx}" y2="${H - 10}" stroke="#FF3B4E" stroke-width="2"/>
    <circle cx="${W / 2}" cy="${H / 2}" r="${15 * sx}" fill="none" stroke="#3D7BFF" stroke-width="3" opacity=".8"/>
    ${dots}</svg><div class="h cap">Shots &amp; goals</div>`;
}

// live tracker: ball at the latest action, fading trail of the previous ones, attack zone shading
let ballKey = '', ballPos = null;
function track(g, W, H, hc, ac) {
  const ev = g.tracker || [];
  if (!ev.length || g.state !== 'in') return `<text x="${W / 2}" y="${H / 2 + 8}" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="3" fill="#ffffff99" font-family="Inter">${g.state === 'in' ? 'WAITING FOR THE NEXT ACTION' : ''}</text>`;
  const px = (e) => 14 + e.x / 100 * (W - 28), py = (e) => 14 + e.y / 100 * (H - 28);
  const last = ev[ev.length - 1], col = last.home ? hc : ac, x = px(last), y = py(last);
  const zone = last.att >= 67 ? 'DANGEROUS ATTACK' : last.att >= 40 ? 'ATTACK' : 'IN POSSESSION';
  const zx = last.home ? W * (last.att >= 67 ? 2 / 3 : last.att >= 40 ? 1 / 2 : 0) : 0;
  const zw = last.home ? W - zx : W * (last.att >= 67 ? 1 / 3 : last.att >= 40 ? 1 / 2 : 1);
  const trail = ev.slice(0, -1).map((e, i, a) => `<circle cx="${px(e)}" cy="${py(e)}" r="7" fill="${e.home ? hc : ac}" opacity="${0.25 + 0.5 * (i + 1) / a.length}" stroke="#fff" stroke-width="2"/>`).join('');
  const path = ev.map((e) => `${px(e)},${py(e)}`).join(' ');
  const moved = ballKey !== last.id; const from = moved && ballPos ? ballPos : { x, y };
  ballKey = last.id; ballPos = { x, y };
  const anim = (a, f, t) => from[a] !== t ? `<animate attributeName="${a === 'x' ? 'cx' : 'cy'}" from="${f}" to="${t}" dur="1.2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1" keyTimes="0;1"/>` : '';
  const lab = `${last.min} · ${last.type.toUpperCase()}${last.who ? ' · ' + last.who.split(' ').pop().toUpperCase() : ''}`;
  const lw = Math.min(W - 40, 30 + lab.length * 11.5), lx = Math.max(20, Math.min(W - 20 - lw, x - lw / 2)), ly = y < H / 2 ? y + 22 : y - 64;
  return `<rect x="${zx}" y="0" width="${zw}" height="${H}" fill="${col}" opacity=".16"><animate attributeName="opacity" values=".08;.22;.08" dur="2s" repeatCount="indefinite"/></rect>
    <text x="${last.home ? W - 24 : 24}" y="${H - 22}" text-anchor="${last.home ? 'end' : 'start'}" font-size="15" font-weight="800" letter-spacing="2" fill="#fff" opacity=".85" font-family="Inter">${zone} ${last.home ? '→' : '←'}</text>
    <polyline points="${path}" fill="none" stroke="#ffffff55" stroke-width="2" stroke-dasharray="6 6"/>${trail}
    <circle cx="${x}" cy="${y}" r="14" fill="none" stroke="${col}" stroke-width="4"><animate attributeName="r" values="14;34" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.4s" repeatCount="indefinite"/>${anim('x', from.x, x)}${anim('y', from.y, y)}</circle>
    <circle cx="${x}" cy="${y}" r="11" fill="#fff" stroke="${col}" stroke-width="4">${anim('x', from.x, x)}${anim('y', from.y, y)}</circle>
    <g><rect x="${lx}" y="${ly}" width="${lw}" height="40" rx="8" fill="#0A0E1Ee6" stroke="${col}" stroke-width="3"/>
    <text x="${lx + lw / 2}" y="${ly + 27}" text-anchor="middle" font-size="19" font-weight="800" fill="#fff" font-family="Inter">${esc(lab)}</text></g>`;
}

function pitch(g) {
  const W = 820, H = 240, ac = vivid(g.away), hc = vivid(g.home);
  const sh = (g.stats || []).find((s) => /^shots$/i.test(s.label)), ot = (g.stats || []).find((s) => /target/i.test(s.label));
  const poss = sh ? { home: sh.home + (ot ? ` (${ot.home})` : ''), away: sh.away + (ot ? ` (${ot.away})` : '') } : null;
  let lastX = { true: -99, false: -99 }, flip = { true: false, false: false };
  const tl = (g.timeline || []).map((e) => {
    const x = Math.min(90, e.min) / 90 * (W - 40) + 20, top = e.team === g.home.abbr;
    flip[top] = x - lastX[top] < 150 ? !flip[top] : false; lastX[top] = x;
    const col = e.kind === 'goal' ? (top ? hc : ac) : e.kind === 'red' ? '#FF2D46' : '#FFD23F';
    return `<g transform="translate(${x} ${top ? 30 : 74})">${e.kind === 'goal' ? `<circle r="13" fill="${col}" stroke="#fff" stroke-width="3"/><text y="5" text-anchor="middle" font-size="14">⚽</text>` : `<rect x="-7" y="-10" width="14" height="20" rx="2" fill="${col}"/>`}
      <text y="${top ? (flip[top] ? 34 : -20) : (flip[top] ? -20 : 32)}" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" font-family="Inter">${e.min}' ${esc(e.who.split(' ').pop())}</text></g>`;
  }).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="filter:drop-shadow(0 30px 40px #000a);margin-top:34px">
      <defs><linearGradient id="grass" x1="0" x2="1"><stop offset="0" stop-color="#16733A"/><stop offset="1" stop-color="#0F5A2C"/></linearGradient>
      <pattern id="mow" width="80" height="${H}" patternUnits="userSpaceOnUse"><rect width="40" height="${H}" fill="#ffffff0a"/></pattern></defs>
      <rect width="${W}" height="${H}" rx="12" fill="url(#grass)"/><rect width="${W}" height="${H}" fill="url(#mow)"/>
      <g stroke="#ffffff88" stroke-width="3" fill="none"><rect x="10" y="10" width="${W - 20}" height="${H - 20}" rx="4"/><line x1="${W / 2}" y1="10" x2="${W / 2}" y2="${H - 10}"/><circle cx="${W / 2}" cy="${H / 2}" r="46"/>
      <rect x="10" y="${H / 2 - 80}" width="110" height="160"/><rect x="${W - 120}" y="${H / 2 - 80}" width="110" height="160"/>
      <rect x="10" y="${H / 2 - 36}" width="40" height="72"/><rect x="${W - 50}" y="${H / 2 - 36}" width="40" height="72"/></g>
      ${track(g, W, H, hc, ac)}
    </svg>
    <svg width="${W}" height="104" viewBox="0 0 ${W} 110">
      <line x1="20" y1="52" x2="${W - 20}" y2="52" stroke="#ffffff30" stroke-width="4" stroke-linecap="round"/>
      ${g.state === 'in' ? `<line x1="20" y1="52" x2="${Math.min(90, parseInt(g.clock) || 0) / 90 * (W - 40) + 20}" y2="52" stroke="var(--lime)" stroke-width="4" stroke-linecap="round"/>` : ''}
      <text x="20" y="104" font-size="13" fill="#ffffff66" font-family="Inter" font-weight="700">0'</text><text x="${W / 2}" y="104" text-anchor="middle" font-size="13" fill="#ffffff66" font-family="Inter" font-weight="700">HT</text><text x="${W - 20}" y="104" text-anchor="end" font-size="13" fill="#ffffff66" font-family="Inter" font-weight="700">90'</text>
      ${tl}</svg><div class="h cap">Live tracker</div>`;
}

function diamond(g) {
  const m = g.mlb || { balls: 0, strikes: 0, outs: 0, bases: [false, false, false] };
  const base = (x, y, on) => `<rect x="${x - 26}" y="${y - 26}" width="52" height="52" transform="rotate(45 ${x} ${y})" fill="${on ? 'var(--lime)' : '#ffffff14'}" stroke="#ffffff88" stroke-width="3"/>`;
  const dots = (n, max, c) => Array.from({ length: max }, (_, i) => `<i style="display:inline-block;width:22px;height:22px;border-radius:50%;margin:0 4px;background:${i < n ? c : '#ffffff18'}"></i>`).join('');
  return `<div style="display:flex;align-items:center;gap:60px"><svg width="380" height="340" viewBox="0 0 380 340">
      <path d="M190 320 L40 170 L190 20 L340 170 Z" fill="#7A4A26" fill-opacity=".35" stroke="#ffffff44" stroke-width="3"/>
      ${base(340, 170, m.bases[0])}${base(190, 20, m.bases[1])}${base(40, 170, m.bases[2])}
      <path d="M190 330 l-16 -14 v-14 h32 v14 z" fill="#fff"/></svg>
    <div style="font-size:22px;font-weight:800;line-height:2.4">
      <div><span style="display:inline-block;width:40px;color:var(--mute)">B</span>${dots(m.balls, 4, '#3DDC84')}</div>
      <div><span style="display:inline-block;width:40px;color:var(--mute)">S</span>${dots(m.strikes, 3, '#FFD23F')}</div>
      <div><span style="display:inline-block;width:40px;color:var(--mute)">O</span>${dots(m.outs, 3, '#FF2D46')}</div>
      ${m.batter ? `<div style="margin-top:10px;font-size:20px;color:var(--mute);line-height:1.5">AB <b style="color:#fff">${esc(m.batter)}</b><br>P <b style="color:#fff">${esc(m.pitcher)}</b></div>` : ''}
    </div></div><div class="h cap">At bat</div>`;
}

function compare(g) {
  const [L, R] = g.soccer ? [g.home, g.away] : [g.away, g.home];
  const lc = vivid(L), rc = vivid(R);
  const rows = (g.stats || []).slice(0, 7).map((r) => {
    const lv = g.soccer ? r.home : r.away, rv = g.soccer ? r.away : r.home, ln = g.soccer ? r.h : r.a, rn = g.soccer ? r.a : r.h, t = Math.max(ln + rn, 0.0001);
    return `<div class="row"><span class="v num">${esc(lv)}</span><div class="b l"><i style="width:${ln / t * 100}%;background:${lc}"></i></div><span class="k">${esc(r.label)}</span><div class="b"><i style="width:${rn / t * 100}%;background:${rc}"></i></div><span class="v num r">${esc(rv)}</span></div>`;
  }).join('');
  return `<div class="cmp"><div class="row" style="padding-bottom:16px">${logo(L, '')}<span></span><span class="k" style="font-size:20px;color:#fff">TEAM STATS</span><span></span><div style="justify-self:end">${logo(R, '')}</div></div>${rows || '<div class="pre"><div class="when">Team stats will appear here</div></div>'}</div>`;
}

function boxView(g) {
  if (!g.box) return compare(g);
  const [L, R] = [g.away, g.home], [lb, rb] = [g.box.away, g.box.home];
  const tbl = (t, rows) => `<div style="flex:1"><div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">${logo(t)}<b style="font-size:24px">${esc(t.name)}</b></div>
    <table class="boxt"><tr><th>PLAYER</th>${g.box.cols.map((c) => `<th>${c}</th>`).join('')}</tr>${rows.map((r) => `<tr><td>${esc(r[0])}</td>${r.slice(1).map((v) => `<td class="n">${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div>`;
  return `<div class="cmp" style="flex-direction:row;gap:34px;align-items:flex-start;padding-top:30px">${tbl(L, lb)}${tbl(R, rb)}</div><style>.cmp .lg{width:52px;height:52px}.cmp .lg span{font-size:16px}</style>`;
}

function preView(g) {
  const s = new Date(g.start), mins = Math.max(0, Math.floor((s - Date.now()) / 1000));
  const cd = mins > 0 ? `${Math.floor(mins / 3600) ? Math.floor(mins / 3600) + ':' : ''}${String(Math.floor(mins / 60) % 60).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}` : 'SOON';
  const f = (tz) => s.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tz });
  const [L, R] = g.soccer ? [g.home, g.away] : [g.away, g.home];
  return `<div class="pre"><div class="h">${g.soccer ? 'Kick-off in' : g.sport === 'nba' ? 'Tip-off in' : 'Game starts in'}</div>
    <div class="cd num">${cd}</div>
    <div class="vs">${logo(L)}<b>VS</b>${logo(R)}</div>
    <div class="when">${f('America/New_York')} ET · ${f('Europe/London')} UK${g.broadcast ? ' · ' + esc(g.broadcast) : ''}</div></div>`;
}

function stage(g, ph) {
  if (ph === 'pre') return preView(g);
  if (ph === 'break' || ph === 'final') return (slide % 2 && g.box) ? boxView(g) : compare(g);
  if (g.soccer) return TRK ? '<div id="trkHole" style="width:100%;height:100%"></div>' : pitch(g);
  if (g.sport === 'nfl') return field(g);
  if (g.sport === 'nhl') return rink(g);
  if (g.sport === 'mlb') return diamond(g);
  return court(g);
}

function wpBar(g) {
  const [L, R] = g.soccer ? [g.home, g.away] : [g.away, g.home];
  let lp, rp, label;
  if (g.winProb) { rp = g.soccer ? 100 - g.winProb.home : g.winProb.home; lp = 100 - rp; label = 'WIN PROBABILITY'; }
  else {
    const sh = (g.stats || []).find((s) => /^shots$/i.test(s.label)), ot = (g.stats || []).find((s) => /target/i.test(s.label));
    const poss = (g.stats || []).find((s) => /poss/i.test(s.label));
    if (!poss) return '';
    lp = g.soccer ? poss.h : poss.a; rp = g.soccer ? poss.a : poss.h; label = 'POSSESSION';
  }
  let spark = '';
  if (g.winProb && g.winProb.series.length > 2) {
    const s = g.winProb.series, w = 100 / (s.length - 1);
    spark = `<svg viewBox="0 0 100 30" preserveAspectRatio="none"><polyline fill="none" stroke="#ffffffaa" stroke-width="1.2" vector-effect="non-scaling-stroke" points="${s.map((v, i) => `${i * w},${30 - (g.soccer ? 100 - v : 100 - v) * 0.3}`).join(' ')}"/></svg>`;
  }
  return `<div class="panel wp" style="--away:${vivid(L)};--home:${vivid(R)}">
    <div class="s num">${Math.round(lp)}%<small>${esc(L.abbr)}</small></div>
    <div class="wpwrap">${spark}<div class="wpbar"><i style="width:${lp}%"></i></div><div class="h" style="text-align:center;margin-top:8px;font-size:12px">${label}</div></div>
    <div class="s r num">${Math.round(rp)}%<small>${esc(R.abbr)}</small></div></div>`;
}

function playsPanel(g, ph) {
  if (ph === 'pre') return `<div class="panel plays"><div class="h">Before the game</div><div class="pl" style="grid-template-columns:1fr;padding-left:18px"><span class="x">${esc(g.away.full)} (${esc(g.away.record || '–')}) at ${esc(g.home.full)} (${esc(g.home.record || '–')})</span></div>${g.venue ? `<div class="pl" style="grid-template-columns:1fr;padding-left:18px"><span class="x">📍 ${esc(g.venue)}</span></div>` : ''}<div class="pl" style="grid-template-columns:1fr;padding-left:18px"><span class="x">Live score, play-by-play and stats start at tip-off · no game footage</span></div></div>`;
  const byAbbr = { [g.home.abbr]: g.home, [g.away.abbr]: g.away };
  return `<div class="panel plays"><div class="h">${g.soccer ? 'Key events' : 'Play-by-play'}</div>${g.plays.slice(0, 4).map((p) => {
    const t = byAbbr[p.team];
    return `<div class="pl ${p.big ? 'big' : ''}" style="--pc:${t ? vivid(t) : '#5B638C'}"><span class="bar"></span>${t ? logo(t) : '<span></span>'}<span class="k num" style="font-size:20px">${esc(p.clock)}</span><span class="x">${esc(p.text)}</span>${p.value > 0 && !g.soccer ? `<span class="pts num">+${p.value}</span>` : '<span></span>'}</div>`;
  }).join('') || '<div class="pl" style="grid-template-columns:1fr;padding-left:18px"><span class="x" style="color:var(--dim)">Updates will appear here</span></div>'}</div>`;
}

function statusBar(g, ph) {
  const lead = Number(g.home.score) - Number(g.away.score);
  const leader = lead > 0 ? g.home : g.away;
  const runTeam = g.run ? (g.run.team === g.home.abbr ? g.home : g.away) : null;
  let left = '';
  if (ph === 'pre') left = `<div class="lead" style="color:var(--mute)">${g.sport === 'nba' ? 'GAME DAY' : 'MATCH DAY'}</div>`;
  else if (lead === 0) left = `<div class="lead">${ph === 'final' ? 'DRAW' : 'ALL SQUARE'}</div>`;
  else left = `<div class="lead" style="--lc:${vivid(leader)}"><i></i>${esc(leader.abbr)} ${ph === 'final' ? 'WIN BY' : 'LEAD BY'} ${Math.abs(lead)}${runTeam && ph === 'live' ? `<span class="runb">${esc(runTeam.abbr)} ${g.run.for}-0 RUN</span>` : ''}</div>`;
  const per = g.soccer ? '' : g.sport === 'mlb' ? '' : '';
  const big = ph === 'pre' ? 'UPCOMING' : g.soccer ? (ph === 'live' ? g.clock || g.status : g.status) : ph === 'live' ? (g.clock || '') : g.status;
  const small = ph === 'live' && !g.soccer ? g.status.replace(/^[\d:.]+\s*-\s*/, '') : ph === 'live' ? g.label : ph === 'pre' ? g.label : g.label;
  return `<div class="panel status">${left}<div class="clk"><div class="p">${esc(small)}</div><div class="t num ${/^[\d:.']+$/.test(big) ? '' : 'w'}">${esc(big)}</div></div><div class="lead r">${esc(g.broadcast || g.label)}</div></div>`;
}

// ---------------- render loop ----------------
function render(g) {
  const ph = phase(g);
  document.documentElement.style.setProperty('--acc', ACC[g.sport] || '#FF8A3D');
  document.documentElement.style.setProperty('--away', vivid(g.soccer ? g.home : g.away));
  document.documentElement.style.setProperty('--home', vivid(g.soccer ? g.away : g.home));
  const live = $('live');
  live.className = 'pill' + (g.state === 'in' ? ' live' : '');
  live.querySelector('span').textContent = { pre: 'STARTING SOON', live: 'LIVE', break: 'LIVE', final: 'FINAL' }[ph];
  $('lg').textContent = g.label; $('venue').textContent = g.venue || '—';
  const [L, R] = g.soccer ? [g.home, g.away] : [g.away, g.home];
  const [lw, rw] = g.soccer ? ['home', 'away'] : ['away', 'home'];
  $('app').innerHTML = `
    <div class="side l">${side(L, R, g, lw)}</div>
    <div class="center">${statusBar(g, ph)}<div class="panel stage" id="stage">${stage(g, ph)}</div>${ph === 'pre' ? '' : wpBar(g)}${TRK && g.soccer && ph === 'live' ? '' : playsPanel(g, ph)}</div>
    <div class="side r">${side(R, L, g, rw)}</div>`;
  prev = { home: g.home.score, away: g.away.score };
  placeTracker();

  // big-play popup
  const big = g.plays.find((p) => p.big);
  if (big && seenBig !== null && big.id !== seenBig && ph === 'live') popup(big, g);
  if (big) seenBig = big.id; else if (seenBig === null) seenBig = '';

  // period-change transition
  if (lastPhase && ph !== lastPhase && (ph === 'break' || ph === 'final')) transition(g, ph);
  lastPhase = ph;
  ticker(g);
}

// keep one iframe alive across re-renders (moving it would reload it): it sits in a layer positioned over #trkHole
function placeTracker() {
  const L = $('trkL'), F = $('trkF'), hole = $('trkHole');
  if (!TRK || !hole) { L.style.display = 'none'; return; }
  if (!F.src) F.src = TRK;
  const r = hole.getBoundingClientRect(), root = document.body.getBoundingClientRect();
  const k = Math.min(r.width / 950, r.height / 640);
  const w = 950 * k, h = 640 * k;
  Object.assign(L.style, { display: 'block', left: (r.left - root.left + (r.width - w) / 2) + 'px', top: (r.top - root.top + (r.height - h) / 2) + 'px', width: w + 'px', height: h + 'px' });
  F.style.transform = `scale(${k})`;
}

function popup(p, g) {
  const t = p.team === g.home.abbr ? g.home : p.team === g.away.abbr ? g.away : null;
  const el = $('pop');
  if (!el || !t) return;
  const kind = g.soccer ? 'GOAL!' : g.sport === 'nfl' ? (p.value >= 6 ? 'TOUCHDOWN!' : p.value === 3 ? 'FIELD GOAL' : 'SCORE') : g.sport === 'nhl' ? 'GOAL!' : p.value >= 3 ? 'THREE!' : 'BUCKET';
  el.style.setProperty('--pc', vivid(t));
  el.innerHTML = `${logo(t)}<div><div class="t">${kind} · ${esc(t.name.toUpperCase())}</div><div class="x">${esc(p.text)}</div></div>${p.value && !g.soccer ? `<div class="v num">+${p.value}</div>` : ''}`;
  requestAnimationFrame(() => el.classList.add('on'));
  setTimeout(() => el.classList.remove('on'), 6500);
}

function transition(g, ph) {
  const el = $('trans'), [L, R] = g.soccer ? [g.home, g.away] : [g.away, g.home];
  const title = ph === 'final' ? 'FINAL' : (g.detail || g.status).toUpperCase();
  el.innerHTML = `<div class="half a">${logo(L)}<div class="s num">${esc(L.score)}</div></div><div></div><div class="half b">${logo(R)}<div class="s num">${esc(R.score)}</div></div>
    <div class="mid"><div class="t">${esc(title)}</div><div class="s2">${esc(g.label)} · SCOREBUZZ LIVE</div></div>`;
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 7000);
}

let tickKey = '';
function ticker(g) {
  const key = JSON.stringify(g.ticker);
  if (key === tickKey) return;
  tickKey = key;
  const items = `<span class="tk lab">${esc(g.label)}</span>` + g.ticker.map((t) => `<span class="tk">${tLogo(t.a, t.al)}${esc(t.a)} <b>${esc(t.as)}</b>${tLogo(t.h, t.hl)}${esc(t.h)} <b>${esc(t.hs)}</b><em>${esc(t.st)}</em></span>`).join('')
    + '<span class="tk lab">LIVE SCORES · NO GAME FOOTAGE</span><span class="tk">Fixtures, tables and results at&nbsp;<b style="color:var(--lime);font-family:Inter;font-size:21px">scorebuzz.net</b></span>';
  $('tick').innerHTML = items + items;
  $('tick').style.setProperty('--dur', Math.max(45, g.ticker.length * 10) + 's');
}

// ---- autopilot game picker (static version) ----
// ?slot=N: a reusable "game slot" for a studio project. The game shown comes from settings.json
// "slots": {"1": {"league": "ncaaf", "event": "401858291"}, ...}, so a project's web layer never
// has to change: Claude sets the slot's game in git, retitles the project and schedules it via API.
const SLOT = q.get('slot');
const AUTO = q.get('auto') === '1' || !!SLOT;
let AUTO_LEAGUES = (q.get('leagues') || q.get('league') || 'nba').split(',').filter(Boolean);
let AUTO_TEAMS = (q.get('teams') || '').toUpperCase().split(',').filter(Boolean);
let AUTO_TOP = Number(q.get('top25') || 0);
let PIN = null;
// Remote control: in auto mode the page also reads ./settings.json next to it (committed to GitHub),
// so leagues/teams can be changed or a game pinned without touching the streaming studio.
//   { "leagues": ["nba","nfl"], "teams": ["LAL"], "top25": 10, "pin": {"league": "nba", "event": "401..."} | null }
async function loadSettings() {
  if (q.has('noremote')) return;
  try {
    const r = await window.fetch('settings.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const c = await r.json();
    if (Array.isArray(c.leagues) && c.leagues.length) AUTO_LEAGUES = c.leagues;
    if (Array.isArray(c.teams)) AUTO_TEAMS = c.teams.map((t) => String(t).toUpperCase());
    if (c.top25 !== undefined) AUTO_TOP = Number(c.top25) || 0;
    PIN = c.pin && c.pin.event ? c.pin : null;
    if (SLOT) { const sl = (c.slots || {})[SLOT]; PIN = sl && sl.event ? sl : null; }
  } catch (e) { /* keep URL settings */ }
}
let finalSince = 0;
async function pickGame() {
  const all = [];
  for (const lg of AUTO_LEAGUES) {
    const ymd = (d) => d.toLocaleDateString('en-CA', { timeZone: 'America/New_York' }).replace(/-/g, '');
    for (const day of [undefined, ymd(new Date()), ymd(new Date(Date.now() + 86400e3))]) {   // ESPN's current day, today and tomorrow (ET)
      try { for (const g of await FEED.list(lg, day)) if (!all.some((x) => x.id === g.id)) all.push({ ...g, league: lg }); } catch (e) { /* no games */ }
    }
  }
  const ok = all.filter((g) => !(g.league === 'ncaaf' && AUTO_TOP && g.rank > AUTO_TOP));
  const fav = (g) => AUTO_TEAMS.length && g.abbrs.some((a) => AUTO_TEAMS.includes(String(a).toUpperCase()));
  const live = ok.filter((g) => g.state === 'in');
  if (live.length) {
    live.sort((a, b) => (fav(b) - fav(a)) || (a.rank - b.rank));
    return live[0];
  }
  const pre = ok.filter((g) => g.state === 'pre').sort((a, b) => a.start.localeCompare(b.start));
  const soonFav = pre.find((g) => fav(g) && new Date(g.start) - Date.now() < 3 * 3600e3);
  return soonFav || pre[0] || ok.filter((g) => g.state === 'post').pop() || null;
}
async function autoTick() {
  await loadSettings();
  if (PIN && (PIN.event !== event || PIN.league !== league)) { league = PIN.league; event = String(PIN.event); G = null; finalSince = 0; tickKey = ''; poll(); return; }
  if (PIN) return;
  if (SLOT) { if (!event) $('app').innerHTML = '<div class="err">ScoreBuzz live scoreboard · next game coming up</div>'; return; }
  const cur = G && G.id === event ? G : null;
  if (cur && cur.state === 'in') { finalSince = 0; return; }
  if (cur && cur.state === 'post') { if (!finalSince) finalSince = Date.now(); if (Date.now() - finalSince < 15 * 60000) return; }
  const g = await pickGame();
  if (g && (g.id !== event || g.league !== league)) { league = g.league; event = g.id; G = null; finalSince = 0; tickKey = ''; poll(); }
}

async function poll() {
  try {
    if (!event) return;
    const g = await FEED.game(league, event);
    if (g.error) throw new Error(g.error);
    G = g; render(g);
    window.__ready = true; window.__state = g.state;
  } catch (e) {
    if (!G) $('app').innerHTML = `<div class="err">Waiting for live data… (${esc(e.message)})</div>`;
  }
}
setInterval(() => { $('now').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' }) + ' ET'; }, 1000);
setInterval(() => { slide++; if (G && ['break', 'final'].includes(phase(G))) render(G); }, 12000);
setInterval(() => { if (G && phase(G) === 'pre') render(G); }, 1000);
// subscribe reminder: 8 seconds every 7 minutes (first after 90 s)
const sub = () => { $('sub').classList.add('on'); setTimeout(() => $('sub').classList.remove('on'), 8000); };
setTimeout(() => { sub(); setInterval(sub, 7 * 60000); }, q.has('demo') ? 1000 : 90000);
// demo hooks for previews: ?demo=pop | trans
if (q.get('demo') === 'trans') setTimeout(() => G && transition(G, 'break'), 800);
if (q.get('demo') === 'pop') setTimeout(() => { if (G) { const p = G.plays.find((x) => x.big) || G.plays[0]; p && popup(p, G); } }, 800);
if (AUTO) { autoTick().then(poll); setInterval(autoTick, 60000); } else poll();
setInterval(poll, 5000);
</script>
</body></html>
