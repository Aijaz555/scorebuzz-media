<!doctype html>
<html><head><meta charset="utf-8"><title>ScoreBuzz 3D Match Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<!--
  3D animated match tracker (football), WebGL (three.js, MIT, vendored in ./vendor).
  Usage: match3d.html?league=epl&event=<espn id>[&replay=1]
  The pitch is an ANIMATION driven by ESPN's live play-by-play: each real event (shot, save, corner, foul, card,
  goal) is acted out where it really happened; the passing in between is simulated filler. The page always says so.
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070a12;font-family:Inter,sans-serif;color:#fff}
canvas{display:block}
.num{font-family:'Barlow Condensed',Inter,sans-serif;font-variant-numeric:tabular-nums}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,#0007 100%)}
#bug{position:absolute;left:40px;top:34px;display:flex;align-items:stretch;height:58px;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px #0009;font-weight:900}
#bug .lg{background:#000;color:#c6f432;padding:0 16px;display:flex;align-items:center;font-size:20px;letter-spacing:1px}
#bug .t{display:flex;align-items:center;gap:10px;padding:0 16px;font-size:28px;letter-spacing:1px;background:#141a2e}
#bug .t i{width:10px;height:34px;border-radius:3px;border:1px solid #fff4}
#bug .sc{background:#0b0f1d;padding:0 18px;display:flex;align-items:center;font-size:40px;gap:14px}
#bug .clk{background:#e53935;padding:0 16px;display:flex;align-items:center;font-size:32px;min-width:96px;justify-content:center}
#label{position:absolute;right:40px;top:36px;font-weight:800;font-size:16px;letter-spacing:2px;padding:9px 14px;border-radius:9px;background:#000a;border:1px solid #ffffff22;color:#d6d6d6;text-align:right}
#label b{color:#c6f432}
#poss{position:absolute;left:40px;top:102px;width:400px;font-weight:800;font-size:15px;letter-spacing:2px;color:#ddd;text-shadow:0 2px 6px #000}
#poss .bar{display:flex;height:8px;border-radius:6px;overflow:hidden;margin-top:6px;background:#ffffff22}
#poss .bar i{display:block;height:100%;transition:width 1.5s}
#ev{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(30px);opacity:0;transition:all .45s;display:flex;align-items:center;gap:18px;background:#000d;border:1px solid #ffffff22;border-left:10px solid var(--c,#c6f432);border-radius:12px;padding:14px 26px;max-width:1500px;box-shadow:0 20px 50px #000a}
#ev.on{opacity:1;transform:translateX(-50%)}
#ev .k{font:900 38px 'Barlow Condensed',Inter;letter-spacing:2px;white-space:nowrap}
#ev .x{font-size:24px;font-weight:700;color:#e8e8e8;max-width:1100px}
#ev .m{font:800 32px 'Barlow Condensed',Inter;color:#c6f432}
#big{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
#big.on{animation:big 4.2s forwards}
#big div{font:900 240px 'Barlow Condensed',Inter;letter-spacing:10px;color:#fff;text-shadow:0 0 60px var(--c,#c6f432),0 10px 40px #000;transform:skewX(-8deg)}
@keyframes big{0%{opacity:0;transform:scale(.6)}10%{opacity:1;transform:scale(1.05)}18%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#card{position:absolute;left:50%;top:30%;width:84px;height:120px;margin-left:-42px;border-radius:10px;opacity:0;box-shadow:0 20px 40px #000a}
#card.on{animation:card 2.8s forwards}
@keyframes card{0%{opacity:0;transform:rotate(-30deg) scale(.5)}15%{opacity:1;transform:rotate(8deg) scale(1.1)}25%{transform:rotate(0) scale(1)}80%{opacity:1}100%{opacity:0}}
#tag{position:absolute;transform:translate(-50%,-100%);font-weight:800;font-size:22px;padding:4px 12px;border-radius:8px;background:#000c;border-left:5px solid var(--c,#fff);opacity:0;transition:opacity .3s;white-space:nowrap}
#tag.on{opacity:1}
footer{position:absolute;left:0;right:0;bottom:0;height:70px;background:#000;display:flex;align-items:center;gap:24px;padding:0 28px;font-weight:900;letter-spacing:2px;font-size:22px}
footer .site{color:#c6f432}footer .note{color:#aaa;font-weight:700;font-size:19px;letter-spacing:1px}
footer .sub{margin-left:auto;background:#e53935;padding:10px 20px;border-radius:10px}
#err{position:absolute;inset:0;display:grid;place-items:center;font-size:36px;color:#999}
</style></head><body>
<div id="vig"></div>
<div id="tag"></div>
<div id="bug"><div class="lg" id="lgn">PREMIER LEAGUE</div><div class="t" id="tH"></div><div class="sc num" id="sc">0 - 0</div><div class="t" id="tA"></div><div class="clk num" id="clk">0'</div></div>
<div id="poss"><div>POSSESSION <span id="pv"></span></div><div class="bar"><i id="pH"></i><i id="pA"></i></div></div>
<div id="label">ANIMATED LIVE TRACKER<br><b>REAL EVENTS · NOT MATCH FOOTAGE</b></div>
<div id="ev"><span class="m num" id="evm"></span><span class="k" id="evk"></span><span class="x" id="evx"></span></div>
<div id="big"><div id="bigt">GOAL</div></div>
<div id="card"></div>
<footer><span class="site">SCOREBUZZ.NET</span><span class="note">Live score, stats &amp; play-by-play · animation based on live match data</span><span class="sub">🔔 SUBSCRIBE</span></footer>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
const q = new URLSearchParams(location.search);
const league = q.get('league') || 'epl', event = q.get('event');
const PATHS = { epl: 'soccer/eng.1', ucl: 'soccer/uefa.champions', uel: 'soccer/uefa.europa', laliga: 'soccer/esp.1', seriea: 'soccer/ita.1', bundesliga: 'soccer/ger.1', ligue1: 'soccer/fra.1', mls: 'soccer/usa.1' };
const NAMES = { epl: 'PREMIER LEAGUE', ucl: 'CHAMPIONS LEAGUE', uel: 'EUROPA LEAGUE', laliga: 'LALIGA', seriea: 'SERIE A', bundesliga: 'BUNDESLIGA', ligue1: 'LIGUE 1', mls: 'MLS' };
const REPLAY = q.has('replay');
const $ = (id) => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// engine units: x 0..100 along the pitch (home attacks +x), y 0..100 across. World: metres, centre spot at origin.
const L = 105, W = 68;
const MX = (x) => x / 100 * L - L / 2, MZ = (y) => y / 100 * W - W / 2;

// ================= renderer & stadium =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(1, window.devicePixelRatio || 1)); renderer.setSize(1920, 1080);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0f1e);
scene.fog = new THREE.Fog(0x0a0f1e, 140, 320);
const camera = new THREE.PerspectiveCamera(24, 1920 / 1080, 1, 600);

scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x1d3a1a, 0.9));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
sun.position.set(-35, 70, 45); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 50, bottom: -50, near: 10, far: 200 });
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd2ff, 0.7); fill.position.set(40, 50, -40); scene.add(fill);

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}

// grass with mowing stripes, wear and painted lines
const GL = 125, GW = 90;   // ground incl. run-off
const grass = canvasTex(4096, 2948, (x, w, h) => {
  const s = w / GL, ox = (GL - L) / 2 * s, oy = (GW - W) / 2 * s;
  x.fillStyle = '#2f6d2b'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 18; i++) { x.fillStyle = i % 2 ? '#3b8434' : '#327a2e'; x.fillRect(ox - 10 * s + i * (L + 20) / 18 * s, 0, (L + 20) / 18 * s + 1, h); }
  const img = x.getImageData(0, 0, w, h), d = img.data;   // fine blade noise
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 18; d[i] += n * 0.6; d[i + 1] += n; d[i + 2] += n * 0.4; }
  x.putImageData(img, 0, 0);
  for (const [cx, cy, r] of [[ox + 5 * s, oy + W / 2 * s, 9 * s], [ox + (L - 5) * s, oy + W / 2 * s, 9 * s], [ox + L / 2 * s, oy + W / 2 * s, 7 * s]]) { // goalmouth / centre wear
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, '#6b7a3a66'); g.addColorStop(1, '#6b7a3a00'); x.fillStyle = g; x.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  }
  x.strokeStyle = '#f4f6f1e8'; x.lineWidth = 0.12 * s; x.fillStyle = '#f4f6f1';
  const P = (mx, my) => [ox + mx * s, oy + my * s];
  const rect = (a, b, c, e) => { x.strokeRect(...P(a, b), c * s, e * s); };
  rect(0, 0, L, W); x.beginPath(); x.moveTo(...P(L / 2, 0)); x.lineTo(...P(L / 2, W)); x.stroke();
  x.beginPath(); x.arc(...P(L / 2, W / 2), 9.15 * s, 0, 7); x.stroke();
  x.beginPath(); x.arc(...P(L / 2, W / 2), 0.25 * s, 0, 7); x.fill();
  for (const side of [0, 1]) {
    const gx = side ? L : 0, dir = side ? -1 : 1;
    rect(side ? L - 16.5 : 0, W / 2 - 20.16, 16.5, 40.32); rect(side ? L - 5.5 : 0, W / 2 - 9.16, 5.5, 18.32);
    x.beginPath(); x.arc(...P(gx + dir * 11, W / 2), 0.22 * s, 0, 7); x.fill();
    const a = Math.acos(5.5 / 9.15); x.beginPath(); x.arc(...P(gx + dir * 11, W / 2), 9.15 * s, side ? Math.PI - a : -a, side ? Math.PI + a : a); x.stroke();
    for (const cy of [0, W]) { x.beginPath(); x.arc(...P(gx, cy), 1 * s, 0, 7); x.stroke(); }
  }
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(GL, GW), new THREE.MeshStandardMaterial({ map: grass, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const apron = new THREE.Mesh(new THREE.PlaneGeometry(260, 200), new THREE.MeshStandardMaterial({ color: 0x1f3a1c, roughness: 1 }));
apron.rotation.x = -Math.PI / 2; apron.position.y = -0.02; scene.add(apron);

// crowd texture: rows of seated fans in club colours
function crowdTex(c1, c2) {
  return canvasTex(2048, 1024, (x, w, h) => {
    x.fillStyle = '#151924'; x.fillRect(0, 0, w, h);
    const pal = [c1, c1, c1, c1, c2, '#2a3044', '#d8d8d8', '#3c4258', '#1c1f2b', '#8d2b2b', '#c7c7c7', '#45506b'];
    const skins = ['#e7c3a1', '#c99a73', '#8a5a3c', '#f0d2b6', '#5c3b28'];
    for (let row = 0; row < h; row += 16) {
      x.fillStyle = '#0d1018'; x.fillRect(0, row + 13, w, 3);
      for (let col = Math.random() * 6; col < w; col += 7 + Math.random() * 4) {
        if (Math.random() < 0.06) continue;          // empty seat
        x.fillStyle = pal[Math.floor(Math.random() * pal.length)]; x.fillRect(col, row + 5, 6, 8);
        x.fillStyle = skins[Math.floor(Math.random() * skins.length)]; x.beginPath(); x.arc(col + 3, row + 3.5, 2.6, 0, 7); x.fill();
        if (Math.random() < 0.05) { x.fillStyle = Math.random() < .5 ? c1 : '#fff'; x.fillRect(col - 2, row - 3, 10, 5); } // scarf / flag
      }
    }
  });
}
const stands = [];
function buildStadium(c1, c2) {
  const tex = crowdTex(c1, c2);
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 1, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.12 });
  const mk = (len, depth, rise, x, z, ry) => {
    const g = new THREE.Group();
    const t = tex.clone(); t.needsUpdate = true; t.wrapS = THREE.RepeatWrapping; t.repeat.set(len / 60, depth / 30);
    const m = mat.clone(); m.map = t; m.emissiveMap = t;
    const tier = new THREE.Mesh(new THREE.PlaneGeometry(len, Math.hypot(depth, rise)), m);
    tier.rotation.x = -Math.atan2(rise, depth); tier.position.set(0, rise / 2 + 1.2, -depth / 2);
    g.add(tier); stands.push(m);
    const wall = new THREE.Mesh(new THREE.BoxGeometry(len, 1.4, 0.5), new THREE.MeshStandardMaterial({ color: 0x1a1f2c }));
    wall.position.set(0, 0.6, 0.2); g.add(wall);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(len + 4, 0.8, depth * 0.7), new THREE.MeshStandardMaterial({ color: 0x0c0f18, roughness: 0.6 }));
    roof.position.set(0, rise + 9, -depth * 0.55); g.add(roof);
    const strip = new THREE.Mesh(new THREE.BoxGeometry(len, 0.35, 0.3), new THREE.MeshBasicMaterial({ color: 0xf6f8ff }));
    strip.position.set(0, rise + 8.5, -depth * 0.2); g.add(strip);   // floodlight gantry
    g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  };
  mk(150, 34, 24, 0, -W / 2 - 9, 0);              // main stand opposite the camera
  mk(100, 30, 20, -L / 2 - 11, 0, Math.PI / 2);   // ends
  mk(100, 30, 20, L / 2 + 11, 0, -Math.PI / 2);
  // no stand on the camera side: the broadcast camera sits in it
}

// LED advertising boards
const ledTex = canvasTex(2048, 64, (x, w, h) => {
  x.fillStyle = '#05070c'; x.fillRect(0, 0, w, h);
  x.font = '900 44px Inter, sans-serif'; x.textBaseline = 'middle';
  let px = 20; for (let i = 0; i < 6; i++) { x.fillStyle = i % 2 ? '#ffffff' : '#c6f432'; const t = i % 2 ? 'LIVE SCORES · PLAY-BY-PLAY' : 'SCOREBUZZ.NET'; x.fillText(t, px, h / 2 + 2); px += x.measureText(t).width + 70; }
}, [1, 1]);
function boards() {
  const mk = (len, x, z, ry) => {
    const t = ledTex.clone(); t.needsUpdate = true; t.wrapS = THREE.RepeatWrapping; t.repeat.set(len / 40, 1);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len, 0.9, 0.15), [0, 0, 0, 0, 1, 0].map((k) => k ? new THREE.MeshBasicMaterial({ map: t }) : new THREE.MeshStandardMaterial({ color: 0x111111 })));
    m.position.set(x, 0.45, z); m.rotation.y = ry; scene.add(m); leds.push(t);
  };
  mk(L + 16, 0, -W / 2 - 4, 0); mk(W + 8, -L / 2 - 5, 0, Math.PI / 2); mk(W + 8, L / 2 + 5, 0, -Math.PI / 2);
}
const leds = [];

// goals
function goals() {
  const post = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
  const net = new THREE.MeshStandardMaterial({ map: canvasTex(256, 256, (x, w, h) => { x.clearRect(0, 0, w, h); x.strokeStyle = '#ffffffb0'; x.lineWidth = 2; for (let i = 0; i <= w; i += 16) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); x.beginPath(); x.moveTo(0, i); x.lineTo(w, i); x.stroke(); } }, [4, 2]), transparent: true, side: THREE.DoubleSide, depthWrite: false });
  for (const s of [-1, 1]) {
    const g = new THREE.Group(), gx = s * L / 2;
    const cyl = (len, x, y, z, rz, rx) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, len, 10), post); m.position.set(x, y, z); m.rotation.z = rz || 0; m.rotation.x = rx || 0; m.castShadow = true; g.add(m); };
    cyl(2.44, 0, 1.22, -3.66); cyl(2.44, 0, 1.22, 3.66); cyl(7.32, 0, 2.44, 0, 0, Math.PI / 2);
    const back = new THREE.Mesh(new THREE.PlaneGeometry(7.32, 2.44), net); back.position.set(s * 2, 1.22, 0); back.rotation.y = Math.PI / 2; g.add(back);
    const top = new THREE.Mesh(new THREE.PlaneGeometry(2, 7.32), net); top.position.set(s * 1, 2.44, 0); top.rotation.x = Math.PI / 2; g.add(top);
    for (const z of [-3.66, 3.66]) { const sd = new THREE.Mesh(new THREE.PlaneGeometry(2, 2.44), net); sd.position.set(s * 1, 1.22, z); g.add(sd); }
    g.position.x = gx; scene.add(g);
  }
  for (const [x, z] of [[-L / 2, -W / 2], [L / 2, -W / 2], [-L / 2, W / 2], [L / 2, W / 2]]) {   // corner flags
    const f = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.5, 6), post); f.position.set(x, 0.75, z); scene.add(f);
    const fl = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.3), new THREE.MeshStandardMaterial({ color: 0xffd400, side: THREE.DoubleSide })); fl.position.set(x + 0.2, 1.35, z); scene.add(fl);
  }
}

// ================= players =================
const SKINS = [0xe7c3a1, 0xc99a73, 0x8a5a3c, 0xf0d2b6, 0x5c3b28, 0xd8a982];
const HAIR = [0x1a1410, 0x3b2a1a, 0x0d0d0d, 0x6b4a2a, 0xc9a35a];
const geo = {
  torso: new THREE.CapsuleGeometry(0.17, 0.42, 4, 10), head: new THREE.SphereGeometry(0.115, 14, 10),
  hair: new THREE.SphereGeometry(0.12, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2.1), shorts: new THREE.CylinderGeometry(0.2, 0.23, 0.26, 12),
  thigh: new THREE.CapsuleGeometry(0.075, 0.3, 4, 8), shin: new THREE.CapsuleGeometry(0.06, 0.32, 4, 8), boot: new THREE.BoxGeometry(0.1, 0.07, 0.24),
  arm: new THREE.CapsuleGeometry(0.05, 0.42, 4, 8), sleeve: new THREE.CapsuleGeometry(0.065, 0.1, 4, 8),
};
function makePlayer(shirt, shorts, socks) {
  const M = (c, r = 0.8) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
  const skin = M(SKINS[Math.floor(Math.random() * SKINS.length)], 0.7), ms = M(shirt, 0.75), msh = M(shorts), mso = M(socks), boot = M(0x111111, 0.4);
  const g = new THREE.Group();
  const add = (geom, mat, x, y, z, parent = g) => { const m = new THREE.Mesh(geom, mat); m.position.set(x, y, z); m.castShadow = true; parent.add(m); return m; };
  const torso = add(geo.torso, ms, 0, 1.3, 0); torso.scale.set(1.3, 1, 0.75);
  add(geo.shorts, msh, 0, 0.98, 0);
  add(geo.head, skin, 0, 1.76, 0); add(geo.hair, M(HAIR[Math.floor(Math.random() * HAIR.length)]), 0, 1.78, -0.01);
  const legs = [], arms = [];
  for (const sx of [-1, 1]) {
    const hip = new THREE.Group(); hip.position.set(sx * 0.1, 0.92, 0); g.add(hip);
    add(geo.thigh, skin, 0, -0.2, 0, hip);
    const knee = new THREE.Group(); knee.position.set(0, -0.42, 0); hip.add(knee);
    add(geo.shin, mso, 0, -0.2, 0, knee); add(geo.boot, boot, 0, -0.43, 0.05, knee);
    legs.push({ hip, knee });
    const sh = new THREE.Group(); sh.position.set(sx * 0.27, 1.52, 0); g.add(sh);
    add(geo.sleeve, ms, 0, -0.06, 0, sh); add(geo.arm, skin, 0, -0.27, 0, sh);
    arms.push(sh);
  }
  g.scale.setScalar(1.15); scene.add(g);
  return { g, legs, arms, phase: Math.random() * 6 };
}

// ================= data =================
let D = { home: null, away: null, events: [], seen: new Set(), clock: '', state: 'pre', score: [0, 0], poss: [50, 50] };
function lum(h) { const n = parseInt(h.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; }
function cdist(a, b) { const f = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const p = f(a), r = f(b); return Math.hypot(p[0] - r[0], p[1] - r[1], p[2] - r[2]); }
const hx = (c, d) => (c && /^[0-9a-f]{6}$/i.test(c) ? '#' + c : d);
async function load() {
  const s = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/${PATHS[league]}/summary?event=${event}`, { cache: 'no-store' })).json();
  const comp = s.header.competitions[0], cs = comp.competitors;
  const H = cs.find((c) => c.homeAway === 'home'), A = cs.find((c) => c.homeAway === 'away');
  const team = (c) => ({ id: c.team.id, abbr: c.team.abbreviation, name: c.team.displayName, short: c.team.shortDisplayName || c.team.name, color: hx(c.team.color, '#888888'), alt: hx(c.team.alternateColor, '#222222') });
  if (!D.home) {
    D.home = team(H); D.away = team(A);
    if (cdist(D.home.color, D.away.color) < 130) D.away.color = cdist(D.home.color, D.away.alt) > 130 ? D.away.alt : (lum(D.home.color) > .5 ? '#1b2a6b' : '#f2f2f2');
    D.rosters = {};
    for (const r of s.rosters || []) D.rosters[r.team.id] = (r.roster || []).filter((p) => p.starter).map((p) => ({ n: p.jersey, name: p.athlete?.displayName || '', pos: p.position?.abbreviation || '' }));
  }
  D.score = [Number(H.score || 0), Number(A.score || 0)];
  D.state = comp.status.type.state; D.clock = comp.status.displayClock || ''; D.detail = comp.status.type.shortDetail;
  const bs = s.boxscore?.teams || [];
  const pp = (id) => Number((bs.find((t) => t.team.id === id)?.statistics || []).find((x) => x.name === 'possessionPct')?.displayValue);
  if (pp(D.home.id) >= 0) D.poss = [pp(D.home.id), pp(D.away.id)];
  const byName = { [D.home.name]: 'H', [D.away.name]: 'A', [D.home.short]: 'H', [D.away.short]: 'A' };
  const evs = [];
  for (const c of s.commentary || []) {
    const p = c.play; if (!p) continue;
    const side = byName[p.team?.displayName] || byName[p.team?.shortDisplayName];
    const type = p.type?.text || '';
    if (!side) continue;
    if (p.fieldPositionX == null) { if (/substitution/i.test(type)) evs.push({ id: String(p.id || c.sequence), side, type, text: c.text, min: c.time?.displayValue }); continue; }
    const mir = side === 'A', cv = (x, y) => ({ x: mir ? 100 - x : x, y: mir ? 100 - y : y });
    evs.push({ id: String(p.id || c.sequence), side, type, text: c.text || type, min: c.time?.displayValue || '', at: cv(p.fieldPositionX, p.fieldPositionY ?? 50),
      to: p.fieldPosition2X != null ? cv(p.fieldPosition2X, p.fieldPosition2Y ?? 50) : null, who: p.participants?.[0]?.athlete?.displayName || '', goal: !!p.scoringPlay || /^goal/i.test(type) });
  }
  D.events = evs; overlays();
}

// ================= engine (same rules as the 2D tracker) =================
const P = [];
const lineSlot = (pos) => /^G/.test(pos) ? 0 : /CD|CB|LB|RB|WB|SW|D$/.test(pos) ? 1 : /DM/.test(pos) ? 2 : /AM/.test(pos) ? 4 : /M/.test(pos) ? 3 : 5;
const lat = (pos) => (/(^L|-L$)/.test(pos) ? -1 : /(^R|-R$)/.test(pos) ? 1 : 0);
const DEPTH = [4, 20, 30, 37, 44, 50];
function buildPlayers() {
  for (const side of ['H', 'A']) {
    const t = side === 'H' ? D.home : D.away;
    let list = D.rosters[t.id] || [];
    if (list.length < 11) list = ['G', 'RB', 'CD-R', 'CD-L', 'LB', 'RM', 'CM-R', 'CM-L', 'LM', 'CF-R', 'CF-L'].map((pos, i) => ({ n: String(i + 1), name: '', pos }));
    const lines = {};
    for (const p of list.slice(0, 11)) (lines[lineSlot(p.pos)] ||= []).push(p);
    for (const [k, ps] of Object.entries(lines)) {
      ps.sort((a, b) => lat(a.pos) - lat(b.pos));
      ps.forEach((p, i) => {
        const yy = ps.length === 1 ? 50 : 14 + (72 * i) / (ps.length - 1);
        const gk = k == 0;
        const shirt = gk ? (side === 'H' ? '#33c26b' : '#f5b700') : t.color;
        const shorts = gk ? '#151515' : (lum(t.color) > .7 ? '#1d2230' : lum(t.color) < .15 ? '#f2f2f2' : t.color);
        const o = { side, n: p.n, name: p.name, gk, base: { x: side === 'H' ? DEPTH[k] : 100 - DEPTH[k], y: side === 'H' ? 100 - yy : yy }, wob: rnd(0, 6), face: side === 'H' ? Math.PI / 2 : -Math.PI / 2,
          ...makePlayer(shirt, shorts, gk ? '#151515' : shirt) };
        o.x = o.base.x; o.y = o.base.y; P.push(o);
      });
    }
  }
}
const ball = { x: 50, y: 50, h: 0, from: null, to: null, t: 0, dur: 1, arc: 0, owner: 'H', carrier: null, hold: 0, spin: 0 };
let queue = [];
const dirOf = (side) => (side === 'H' ? 1 : -1);
const dist = (a, b) => Math.hypot((a.x - b.x) * 1.05, (a.y - b.y) * 0.68);
function nearest(side, x, y, skip) { let b = null, d = 1e9; for (const p of P) if (p.side === side && p !== skip && !p.gk) { const e = dist(p, { x, y }); if (e < d) { d = e; b = p; } } return b; }
const keeper = (side) => P.find((p) => p.side === side && p.gk);
function kick(to, speed = 18, arc = 0, after) { ball.from = { x: ball.x, y: ball.y }; ball.to = to; ball.t = 0; ball.dur = Math.max(0.35, dist(ball, to) / speed); ball.arc = arc; ball.after = after; }
function ambient() {
  const s = ball.owner;
  if (Math.random() < 0.12) { const w = s === 'H' ? D.poss[1] : D.poss[0]; if (Math.random() * 100 < w + 15) ball.owner = s === 'H' ? 'A' : 'H'; }
  const mates = P.filter((p) => p.side === ball.owner && !p.gk && p !== ball.carrier);
  const fwd = mates.filter((p) => (p.x - ball.x) * dirOf(ball.owner) > -8 && dist(p, ball) < 32);
  const pool = fwd.length ? fwd : mates, r = pool[Math.floor(Math.random() * pool.length)];
  if (!r) return;
  const lead = { x: clamp(r.x + dirOf(ball.owner) * rnd(1, 5), 2, 98), y: clamp(r.y + rnd(-4, 4), 3, 97) };
  if (dirOf(ball.owner) > 0 && lead.x > 80) lead.x = rnd(62, 78); if (dirOf(ball.owner) < 0 && lead.x < 20) lead.x = rnd(22, 38);
  const far = dist(lead, ball) > 22;
  ball.carrier = r; kick(lead, far ? 24 : 15, far ? 1 : 0.08); ball.hold = rnd(0.4, 1.6);
}
function say(kind, text, side, min) {
  const t = side === 'H' ? D.home : side === 'A' ? D.away : null, ev = $('ev');
  ev.style.setProperty('--c', t ? t.color : '#c6f432');
  $('evk').textContent = kind.toUpperCase(); $('evx').textContent = text || ''; $('evm').textContent = min || '';
  ev.classList.add('on'); clearTimeout(say.t); say.t = setTimeout(() => ev.classList.remove('on'), 6500);
}
let tagged = null, tagUntil = 0, zoomUntil = 0, flashUntil = 0;
function tagOn(p) { if (!p || !p.name) return; tagged = p; tagUntil = performance.now() + 3500; const t = $('tag'); t.textContent = p.name; t.style.setProperty('--c', (p.side === 'H' ? D.home : D.away).color); }
function big(txt, color) { const b = $('big'); $('bigt').textContent = txt; b.style.setProperty('--c', color); b.classList.remove('on'); void b.offsetWidth; b.classList.add('on'); flashUntil = performance.now() + 3000; }
function cardFx(color) { const c = $('card'); c.style.background = color; c.classList.remove('on'); void c.offsetWidth; c.classList.add('on'); }
function playEvent(e) {
  const s = e.side, d = dirOf(s), opp = s === 'H' ? 'A' : 'H', type = `${e.type} ${e.text}`;
  queue = []; ball.owner = s;
  if (!e.at) { if (/substitution/i.test(type)) say('Substitution', e.text, s, e.min); return; }
  const actor = nearest(s, e.at.x, e.at.y);
  const go = (to, sp, arc, then) => queue.push(() => { ball.carrier = actor; kick(to, sp, arc, then); });
  const tm = s === 'H' ? D.home : D.away;
  if (e.goal) {
    go(e.at, 16, 0.2);
    queue.push(() => { zoomUntil = performance.now() + 6000; kick({ x: s === 'H' ? 101.6 : -1.6, y: rnd(46, 54) }, 32, 0.35); tagOn(actor); });
    queue.push(() => { big('GOAL!', tm.color); say('Goal', e.text, s, e.min); ball.hold = 5; });
    queue.push(() => { ball.x = 50; ball.y = 50; ball.owner = opp; ball.hold = 1.5; });
  } else if (/shot|attempt/i.test(type)) {
    const saved = /saved|on target/i.test(type), blocked = /blocked/i.test(type), header = /header/i.test(type);
    const tgt = e.to && e.to.x > -5 && e.to.x < 105 ? e.to : null;
    go(e.at, 16, header ? 1.2 : 0.15);
    queue.push(() => {
      tagOn(actor); zoomUntil = performance.now() + 4500;
      if (blocked) { const b = nearest(opp, e.at.x + d * 4, e.at.y); kick({ x: b ? b.x : e.at.x + d * 5, y: b ? b.y : e.at.y }, 28, 0.05); }
      else if (saved) { const k = keeper(opp); kick({ x: s === 'H' ? 99 : 1, y: tgt ? clamp(tgt.y, 46, 54) : rnd(46, 54) }, 30, 0.3, () => { if (k) { k.dive = performance.now(); } }); }
      else kick({ x: s === 'H' ? 103 : -3, y: tgt ? tgt.y : (Math.random() < .5 ? rnd(37, 43) : rnd(57, 63)) }, 28, 0.9);
      say(blocked ? 'Shot blocked' : saved ? 'Shot saved' : 'Shot wide', e.text, s, e.min);
    });
    queue.push(() => { ball.hold = 1.8; });
    queue.push(() => { const k = keeper(opp); ball.owner = opp; ball.x = s === 'H' ? 94 : 6; ball.y = 50; if (k) ball.carrier = k; ball.hold = 1; });
    queue.push(() => { ball.owner = opp; kick({ x: s === 'H' ? 55 : 45, y: rnd(25, 75) }, 24, 1.3); });
  } else if (/corner/i.test(type)) {
    const cy = e.at.y < 50 ? 0.8 : 99.2;
    go({ x: s === 'H' ? 96 : 4, y: cy < 50 ? 8 : 92 }, 16, 0.1);
    queue.push(() => { ball.x = s === 'H' ? 99.4 : 0.6; ball.y = cy; ball.hold = 2.2; say('Corner', e.text, s, e.min); zoomUntil = performance.now() + 6000; });
    queue.push(() => kick({ x: s === 'H' ? 93 : 7, y: rnd(43, 57) }, 22, 1.4));
    queue.push(() => { ball.owner = opp; kick({ x: s === 'H' ? 75 : 25, y: rnd(30, 70) }, 24, 1.0); });
  } else if (/foul|free kick/i.test(type)) {
    go(e.at, 14, 0.05); queue.push(() => { ball.hold = 2.2; tagOn(actor); say(/free kick/i.test(type) ? 'Free kick' : 'Foul', e.text, s, e.min); });
  } else if (/yellow|red card/i.test(type)) {
    go(e.at, 14, 0.05); queue.push(() => { ball.hold = 2.8; tagOn(actor); cardFx(/red/i.test(type) ? '#e53935' : '#ffd400'); say(/red/i.test(type) ? 'Red card' : 'Yellow card', e.text, s, e.min); });
  } else if (/offside/i.test(type)) {
    go(e.at, 18, 0.4); queue.push(() => { ball.hold = 2; say('Offside', e.text, s, e.min); ball.owner = opp; });
  } else { go(e.at, 15, 0.1); queue.push(() => say(e.type || 'Play', e.text, s, e.min)); }
}

// ================= ball mesh =================
const ballTex = canvasTex(256, 128, (x, w, h) => { x.fillStyle = '#f4f4f4'; x.fillRect(0, 0, w, h); x.fillStyle = '#1b1b1b'; for (let i = 0; i < 14; i++) { const cx = (i * 47) % w, cy = (i * 31) % h; x.beginPath(); for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2; x.lineTo(cx + 9 * Math.cos(a), cy + 9 * Math.sin(a)); } x.fill(); } });
const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 14), new THREE.MeshStandardMaterial({ map: ballTex, roughness: 0.5 }));
ballMesh.castShadow = true; scene.add(ballMesh);

// ================= frame loop =================
let last = performance.now(), camX = 0, fov = 24;
const ang = (a) => Math.atan2(Math.sin(a), Math.cos(a));
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (ball.to) {
    ball.t += dt / ball.dur; const k = Math.min(1, ball.t);
    ball.x = ball.from.x + (ball.to.x - ball.from.x) * k; ball.y = ball.from.y + (ball.to.y - ball.from.y) * k;
    ball.h = Math.sin(Math.PI * k) * ball.arc * 7;
    ball.spin += dt * 12;
    if (k >= 1) { ball.to = null; ball.h = 0; const f = ball.after; ball.after = null; f && f(); }
  } else if (ball.hold > 0) ball.hold -= dt;
  else if (queue.length) queue.shift()();
  else ambient();
  const att = ball.owner, shift = (ball.x - 50) * 0.45;
  const chasers = new Set([nearest('H', ball.x, ball.y), nearest('A', ball.x, ball.y)]);
  for (const p of P) {
    let tx, ty;
    if (p.gk) { tx = p.base.x + shift * 0.08; ty = 50 + (ball.y - 50) * 0.18; }
    else {
      const push = (p.side === att ? 14 : -4) * dirOf(p.side);
      tx = clamp(p.base.x + push + shift, 3, 97); ty = clamp(p.base.y + (ball.y - p.base.y) * 0.22, 3, 97);
      tx += Math.sin(now / 1900 + p.wob) * 1.5; ty += Math.cos(now / 2300 + p.wob) * 1.5;
      if (p === ball.carrier && ball.to) { tx = ball.to.x; ty = ball.to.y; }
      else if (chasers.has(p) && !ball.to) { tx = ball.x - dirOf(p.side) * 0.9; ty = ball.y; }
    }
    // move in metres; sprinters ~7 m/s, jog ~3.5 m/s
    const dxm = (tx - p.x) * 1.05, dym = (ty - p.y) * 0.68, dm = Math.hypot(dxm, dym);
    const vmax = (chasers.has(p) || p === ball.carrier ? 7 : 3.6) * Math.min(1, dm / 2.5);
    const stepm = Math.min(dm, vmax * dt);
    if (dm > 0.02) { p.x += dxm / dm * stepm / 1.05; p.y += dym / dm * stepm / 0.68; }
    const v = stepm / Math.max(dt, 1e-3);
    // face direction of running, or the ball when standing
    const want = v > 0.6 ? Math.atan2(dxm, dym) : Math.atan2((ball.x - p.x) * 1.05, (ball.y - p.y) * 0.68);
    p.face += ang(want - p.face) * Math.min(1, dt * 6);
    p.g.position.set(MX(p.x), 0, MZ(p.y)); p.g.rotation.y = p.face;
    // running gait
    p.phase += dt * (3 + v * 1.6);
    const sw = Math.min(1, v / 6) * 0.9 + 0.04;
    p.legs[0].hip.rotation.x = Math.sin(p.phase) * sw; p.legs[1].hip.rotation.x = -Math.sin(p.phase) * sw;
    p.legs[0].knee.rotation.x = Math.max(0, -Math.sin(p.phase)) * sw * 1.4; p.legs[1].knee.rotation.x = Math.max(0, Math.sin(p.phase)) * sw * 1.4;
    p.arms[0].rotation.x = -Math.sin(p.phase) * sw * 0.8; p.arms[1].rotation.x = Math.sin(p.phase) * sw * 0.8;
    p.g.position.y = Math.abs(Math.sin(p.phase)) * 0.05 * Math.min(1, v / 4);
    p.g.rotation.x = Math.min(0.18, v * 0.025);   // lean into the run
    if (p.dive && now - p.dive < 1200) { const k = (now - p.dive) / 1200; p.g.rotation.z = Math.sin(Math.min(1, k * 2) * Math.PI / 2) * 1.3 * (p.side === 'H' ? 1 : -1); p.g.position.y = Math.sin(k * Math.PI) * 0.6; }
    else p.g.rotation.z *= 0.9;
  }
  ballMesh.position.set(MX(ball.x), 0.2 + ball.h, MZ(ball.y)); ballMesh.rotation.z = -ball.spin; ballMesh.rotation.x = ball.spin * 0.3;
  // broadcast camera: high on the halfway line, panning and zooming with play
  camX += (clamp(MX(ball.x) * 0.8, -34, 34) - camX) * Math.min(1, dt * 1.2);
  const tf = now < zoomUntil ? 15 : 23;
  fov += (tf - fov) * Math.min(1, dt * 1.3);
  camera.fov = fov; camera.updateProjectionMatrix();
  camera.position.set(camX * 0.55, 34, 84);
  camera.lookAt(camX, 0, MZ(ball.y) * 0.3 + 1);
  for (const t of leds) t.offset.x = (t.offset.x + dt * 0.04) % 1;
  for (const m of stands) m.emissiveIntensity = now < flashUntil ? 0.35 + 0.15 * Math.sin(now / 60) : 0.12;
  renderer.render(scene, camera); window.__frames = (window.__frames || 0) + 1;
  if (tagged && now < tagUntil) {   // name label over the player
    const v = new THREE.Vector3(MX(tagged.x), 2.3, MZ(tagged.y)).project(camera);
    const t = $('tag'); t.style.left = (v.x + 1) / 2 * 1920 + 'px'; t.style.top = (1 - v.y) / 2 * 1080 + 'px'; t.classList.add('on');

}

function overlays() {
  const H = D.home, A = D.away;
  $('lgn').textContent = NAMES[league] || league.toUpperCase();
  $('tH').innerHTML = `<i style="background:${H.color}"></i>${H.abbr}`; $('tA').innerHTML = `<i style="background:${A.color}"></i>${A.abbr}`;
  if (!REPLAY) { $('sc').textContent = `${D.score[0]} - ${D.score[1]}`; $('clk').textContent = D.state === 'in' ? D.clock : D.state === 'post' ? 'FT' : D.detail || ''; }
  $('pH').style.width = D.poss[0] + '%'; $('pH').style.background = H.color; $('pA').style.width = D.poss[1] + '%'; $('pA').style.background = A.color;
  $('pv').textContent = `· ${H.abbr} ${D.poss[0]}% – ${D.poss[1]}% ${A.abbr}`;
}

(async () => {
  if (!event) { document.body.insertAdjacentHTML('beforeend', '<div id="err">match3d.html?league=epl&event=ESPN_ID</div>'); return; }
  try { await load(); } catch (e) { document.body.insertAdjacentHTML('beforeend', `<div id="err">Waiting for live data… (${e.message})</div>`); setTimeout(() => location.reload(), 20000); return; }
  buildStadium(D.home.color, D.away.color); boards(); goals(); buildPlayers();
  requestAnimationFrame(frame);
  if (REPLAY) {
    let i = 0, sc = [0, 0];
    const evs = D.events.filter((e) => e.at && parseInt(e.min) >= Number(q.get('from') || 0));
    const next = () => {
      const e = evs[i++]; if (!e) { i = 0; sc = [0, 0]; return setTimeout(next, 4000); }
      $('clk').textContent = e.min || ''; if (e.goal) { sc[e.side === 'H' ? 0 : 1]++; setTimeout(() => ($('sc').textContent = `${sc[0]} - ${sc[1]}`), 2500); }
      playEvent(e); setTimeout(next, Number(q.get('gap') || 7000));
    };
    $('sc').textContent = '0 - 0'; setTimeout(next, 1500);
  } else {
    D.events.forEach((e) => D.seen.add(e.id));
    const lastEv = D.events[D.events.length - 1]; if (lastEv) playEvent(lastEv);
    setInterval(async () => { try { await load(); } catch (e) { return; } for (const e of D.events) if (!D.seen.has(e.id)) { D.seen.add(e.id); playEvent(e); } }, 15000);
  }
})();
