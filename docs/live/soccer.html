<script>
(() => { // wrapped like nba.html / us.html so it can be document.write()n into app.html later
const q = new URLSearchParams(location.search);
const SLOT = q.get('slot');
let league = q.get('league') || 'epl', event = q.get('event'), noSite = q.get('sbtrk') === '0';
function fit() { const R = window.__fitRemote || {}; const W = +R.w || (R.win ? 0 : +q.get('w')) || innerWidth, H = +R.h || (R.win ? 0 : +q.get('h')) || innerHeight, sx = W / 1920, sy = H / 1080;
  const mode = R.fit || q.get('fit') || 'contain', b = document.body;
  if (mode === 'fill') b.style.transform = `scale(${sx},${sy})`; else { const k = Math.min(sx, sy); b.style.transform = `scale(${k})`; b.style.marginLeft = ((W - 1920 * k) / 2) + 'px'; b.style.marginTop = ((H - 1080 * k) / 2) + 'px'; } }
addEventListener('resize', fit); setInterval(fit, 2000); fit();
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const $ = (id) => document.getElementById(id);
const hex = (c, d) => (c && /^[0-9a-f]{6}$/i.test(c) ? '#' + c : d);
const J = async (u) => (await fetch(u, { cache: 'no-store' })).json();
const lum = (h) => { const n = parseInt(h.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };
const darkish = (c, alt) => (lum(c) > 0.7 ? (lum(alt) > 0.7 ? '#1d2a4a' : alt) : c);
const PATH = { epl: 'eng.1', laliga: 'esp.1', seriea: 'ita.1', ligue1: 'fra.1', bundesliga: 'ger.1', mls: 'usa.1', ucl: 'uefa.champions', uel: 'uefa.europa' };
// scorebuzz.net match pages with the live pitch tracker (same paths and crop as app.html, measured 6 Nov 2026)
const SITE = { epl: 'football/english-premier-league', ucl: 'football/champions-league', uel: 'football/europa-league', laliga: 'football/la-liga', seriea: 'football/serie-a', bundesliga: 'football/bundesliga', ligue1: 'football/ligue-1', mls: 'football/mls' };
const CROP = { top: 64, vh: 536 }, VW = 972, X = 14;
const API = () => `https://site.api.espn.com/apis/site/v2/sports/soccer/${PATH[league]}`;
const TZ = () => (league === 'mls' ? ['America/New_York', 'ET'] : ['Europe/London', 'UK']);
const kick = (d) => new Date(d).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: TZ()[0] }) + ' ' + TZ()[1];
const ORD = (n) => n + (['th', 'st', 'nd', 'rd'][(n % 100 >> 3 ^ 1 && n % 10) || 0] || 'th');
const stat = (s, id, name) => (s.boxscore?.teams || []).find((t) => String(t.team.id) === String(id))?.statistics?.find((x) => x.name === name)?.displayValue;

function team(x, s) {
  const t = x.team, color = darkish(hex(t.color, '#1d428a'), hex(t.alternateColor, '#1d428a'));
  const E = s.standings?.groups?.flatMap((g) => g.standings?.entries || []) || [];
  const pos = E.findIndex((e) => String(e.id) === String(t.id)), pts = (x.record || []).find((r) => r.type === 'points')?.summary;
