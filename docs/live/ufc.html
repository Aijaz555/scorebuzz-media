<!doctype html>
<html><head><meta charset="utf-8"><title>ScoreBuzz live · UFC fight tracker</title>
<!-- UFC fight-night stream page (owner's request, 14 Nov 2026: "we have UFC live tracker on demo page, use that").
     Mounts scorebuzz.net's own UFC tracker (https://scorebuzz.net/tracker-ufc.js, ScoreBuzzUFC.mount, v2 since 14 Nov 2026: round timeline + next-fight crawl) full screen,
     fed by https://scorebuzz.net/api/ufc/card (ESPN, CORS open): follows the fight in the cage, "UP NEXT" + tale of the tape
     between fights, FINAL after the card. autoSample is off so the stream never shows an old sample fight.
     app.html hands a slot to this page when settings.slots[N].league is "ufc" ("ufcPage": false turns it off).
     Preview: ufc.html (fit=contain) -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080c;--panel:#0d0f15;--line:#1b1f2b;--ink:#fff;--mute:#9aa3b5;--lime:#BEFF3C;--red:#e5303a;--blue:#2f80ed}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow:hidden;background:var(--bg)}
body{width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;position:relative;background:var(--bg);color:var(--ink);font-family:Inter,'Segoe UI',Arial,sans-serif}
/* top strip */
#hd{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:center;gap:18px;padding:0 26px;background:linear-gradient(90deg,#14060a,#0d0f15 40%,#0d0f15);border-bottom:3px solid var(--red)}
#hd .br{font:800 40px 'Barlow Condensed',sans-serif;letter-spacing:1px}#hd .br i{font-style:normal;color:var(--lime)}
#hd .tg{background:var(--red);border-radius:6px;padding:4px 12px;font:800 24px 'Barlow Condensed',sans-serif;letter-spacing:2px}
#hd .ev{font:800 36px 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
#hd .vn{font:600 24px 'Barlow Condensed',sans-serif;color:var(--mute);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#hd .nf{font:700 20px 'Barlow Condensed',sans-serif;letter-spacing:2px;color:var(--mute)}
/* tracker host: the widget's own blocks laid out as a broadcast grid */
#trk{position:absolute;left:14px;right:14px;top:90px;bottom:84px}
#trk .uf{height:100%;display:grid;grid-template-columns:1360px 1fr;grid-template-rows:56px 765px 40px 1fr;gap:0 14px;background:transparent;border-radius:0;font-size:20px}
#trk .uf-top{grid-column:1;grid-row:1;border-radius:12px 12px 0 0;font-size:22px;padding:0 16px;gap:14px}
#trk .uf-top b{font-size:24px}#trk .uf-live{font-size:16px;padding:4px 10px}
#trk .uf-view{grid-column:1;grid-row:2;height:765px;overflow:hidden}
#trk .uf-view canvas{width:1360px}
#trk .uf-tick{grid-column:1;grid-row:3;background:var(--panel);padding:0 18px;font-size:24px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
#trk .uf-tl{grid-column:1;grid-row:4;background:var(--panel);border-radius:0 0 12px 12px;padding:6px 12px;overflow:hidden;zoom:1.1}
#trk .uf-crawl{grid-column:2;grid-row:4;align-self:stretch;border-radius:0 0 12px 12px;overflow:hidden;display:flex;align-items:center;zoom:1.35}
#trk .uf-ctl{display:none!important}
#trk .uf-card{grid-column:2;grid-row:1 / span 3;background:var(--panel);border-radius:12px 12px 0 0;padding:14px 14px 10px;overflow:hidden;max-height:none}
#trk .uf-card h4{font:800 30px 'Barlow Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;color:var(--lime)}
#trk .uf-list{font-size:19px;max-height:none!important;overflow:hidden}
/* widget overlays scaled up for TV */
#trk .uf-wc{font-size:20px;padding:8px 16px}#trk .uf-wm{font-size:22px}
#trk .uf-bug{zoom:1.5;bottom:14px}
#trk .uf-tp{zoom:1.6}
#trk .uf-l3,#trk .uf-res{zoom:1.5}
#trk .uf-rp{zoom:1.5}
#trk .uf-ban{zoom:1.5}
/* bottom bar */
#ft{position:absolute;left:0;right:0;bottom:0;height:70px;display:flex;align-items:center;gap:22px;padding:0 26px;background:#0d0f15;border-top:1px solid var(--line);font:700 26px 'Barlow Condensed',sans-serif;letter-spacing:1px}
#ft .lab{color:var(--mute);letter-spacing:2px}#ft b{color:var(--lime)}
#ft .sub{margin-left:auto;background:var(--red);border-radius:8px;padding:6px 18px;font-weight:800;letter-spacing:2px}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:800 54px 'Barlow Condensed',sans-serif;color:var(--mute)}
</style></head><body>
<div id="hd"><span class="br">Score<i>Buzz</i></span><span class="tg">UFC</span><span class="ev" id="ev">UFC fight night</span><span class="vn" id="vn"></span><span class="nf">LIVE FIGHT TRACKER · NO FIGHT FOOTAGE</span></div>
<div id="trk"></div>
<div id="ft"><span class="lab">LIVE RESULTS · ROUND BY ROUND · FROM ESPN</span><span>Every fight, every result at&nbsp;<b>scorebuzz.net</b></span><span class="sub">SUBSCRIBE</span></div>
<div id="err">ScoreBuzz UFC fight tracker · loading…</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  function fit() { var R = window.__fitRemote || {}; var W = +R.w || +q.get('w') || innerWidth, H = +R.h || +q.get('h') || innerHeight, sx = W / 1920, sy = H / 1080;
    var mode = R.fit || q.get('fit') || 'contain', b = document.body;
    if (mode === 'fill') b.style.transform = 'scale(' + sx + ',' + sy + ')'; else { var k = Math.min(sx, sy); b.style.transform = 'scale(' + k + ')'; b.style.marginLeft = ((W - 1920 * k) / 2) + 'px'; b.style.marginTop = ((H - 1080 * k) / 2) + 'px'; } }
  addEventListener('resize', fit); setInterval(fit, 2000); fit();
  var FEED = 'https://scorebuzz.net/api/ufc/card';
  // event name + venue in the header (the widget keeps its own copy in .uf-top)
  function head() { fetch(FEED + '?h=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.name) document.getElementById('ev').textContent = d.name;
    if (d && d.venue) document.getElementById('vn').textContent = '· ' + d.venue;
  }).catch(function () {}); }
  head(); setInterval(head, 300000);
  function boot(n) {
    var s = document.createElement('script');
    s.src = 'https://scorebuzz.net/tracker-ufc.js?t=' + Math.floor(Date.now() / 600000);
    s.onload = function () { window.ScoreBuzzUFC.mount(document.getElementById('trk'), { feed: FEED, autoSample: false }); };
    s.onerror = function () { document.getElementById('err').style.display = 'flex'; s.remove(); setTimeout(function () { boot(n + 1); }, 15000); };
    document.head.appendChild(s);
  }
  boot(0);
  // remote reload / fit from settings.json, like the other stream pages
  var seen;
  function remote() { fetch('https://raw.githubusercontent.com/Aijaz555/scorebuzz-media/main/docs/live/settings.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (c) {
    window.__fitRemote = c.fit || {}; fit();
    if (seen === undefined) seen = c.reload == null ? null : c.reload; else if ((c.reload == null ? null : c.reload) !== seen) location.reload();
  }).catch(function () {}); }
  remote(); setInterval(remote, 60000);
})();
</script>
</body></html>
