<!doctype html>
<html><head><meta charset="utf-8"><title>ScoreBuzz live</title>
<!-- ScoreBuzz "broadcast" scoreboard for NHL, NFL, college football and MLB (owner's request, 9 Nov 2026), the same layout
     as docs/live/nba.html: today's games bar, team header with records, a sport strip (NFL timeouts + down & distance,
     NHL shots on goal + power play, MLB count/outs/bases), big score + line score, scorebuzz.net live tracker beside the
     3 latest plays (play-by-play only for MLB), a player panel and game leaders with ESPN headshots.
     Usage: us.html?league=nhl|nfl|ncaaf|mlb&event=<ESPN id>  or  us.html?slot=N. Designed at 1920x1080. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1430;--panel:#0f1d44;--row:#13245a;--line:#24366e;--ink:#f4f7ff;--mute:#9fb0d9;--lime:#c6f432;--red:#e5262e;--hc:#1d428a;--ac:#c8102e}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow:hidden;background:var(--bg)}
body{width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;position:relative;background:var(--bg);color:var(--ink);font-family:Inter,'Segoe UI',Arial,sans-serif}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
#app{position:absolute;inset:0}
/* top: today's games */
.top{position:absolute;left:0;top:0;width:1920px;height:132px;background:#f4f6fb;color:#121826;display:flex}
.gm{width:226px;padding:12px 18px 8px;border-right:2px solid #d6dbe8;display:flex;flex-direction:column;gap:4px}
.gm.cur{background:#fff;box-shadow:inset 0 -6px 0 var(--red)}
.gm .st{font:700 26px 'Barlow Condensed',sans-serif;text-align:center;color:#20283a;height:30px;white-space:nowrap;overflow:hidden}
.gm .st.live{color:var(--red)}
.gm .r{display:flex;align-items:center;gap:10px;font:700 30px 'Barlow Condensed',sans-serif;height:38px}
.gm .r img{width:32px;height:32px;object-fit:contain}.gm .r b{flex:1;letter-spacing:.5px}.gm .r span{font-weight:600;color:#3a4256}
.gm .r span.w{color:#000;font-weight:800}
.sub{position:absolute;right:30px;top:24px;display:flex;flex-direction:column;align-items:center;gap:6px}
.sub .btn{background:var(--red);color:#fff;font:900 34px Inter,sans-serif;letter-spacing:1px;padding:12px 34px;border-radius:12px;box-shadow:0 8px 20px #e5262e66;animation:pulse 2.4s infinite;transform:rotate(-2deg)}
.sub .bz{font:900 22px Inter,sans-serif;color:#121826;letter-spacing:-.3px}.sub .bz b{color:#5b8a00}
@keyframes pulse{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(-2deg) scale(1.06)}}
/* main board */
.board{position:absolute;left:14px;top:146px;width:1250px;height:740px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#132a6b,#0c1a45);border:4px solid #c8102e;border-top:none}
.hdr{height:118px;display:grid;grid-template-columns:1fr 280px 1fr;background:linear-gradient(90deg,var(--hc) 0%,color-mix(in srgb,var(--hc) 75%,#000) 48%,color-mix(in srgb,var(--ac) 75%,#000) 52%,var(--ac) 100%)}
.tm{display:flex;align-items:center;gap:16px;padding:0 22px;min-width:0}
.tm.h{justify-content:flex-end}.tm.a{justify-content:flex-start}
.tm img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 4px 10px #0008)}
.tm .nm{font:800 58px 'Barlow Condensed',sans-serif;line-height:.95;text-transform:uppercase;letter-spacing:.5px}
.tm .rc{font:600 26px 'Barlow Condensed',sans-serif;color:#ffffffd0;white-space:nowrap}
.tm.h .tx{text-align:right}
.clock{margin:14px 0;border-radius:14px;background:#0008;display:flex;align-items:center;justify-content:center;flex-direction:column}
.clock .c{font:800 56px 'Barlow Condensed',sans-serif;color:var(--lime);line-height:1;white-space:nowrap}.clock .c.sm{font-size:44px}
.clock .p{font:700 24px 'Barlow Condensed',sans-serif;color:#fff;letter-spacing:2px;text-transform:uppercase}
.tob{height:52px;background:#dfe4ef;color:#141b2c;display:grid;grid-template-columns:150px 230px 1fr 230px 150px;align-items:center;text-align:center;font:800 32px 'Barlow Condensed',sans-serif;letter-spacing:1px}
.tob .bn{opacity:.25}.tob .bn.on{opacity:1;color:var(--red)}
.dots{display:flex;gap:7px;justify-content:center;background:#141b2c;border-radius:20px;padding:7px 12px;margin:0 14px}
.dots i{width:16px;height:16px;border-radius:50%;background:#f2c14e}.dots i.u{background:transparent;border:2px solid #f2c14e88}
.tob .tl{letter-spacing:6px;font-size:36px}
.sc{height:190px;display:grid;grid-template-columns:330px 1fr 330px;align-items:center}
.big{font:800 190px 'Barlow Condensed',Inter,sans-serif;text-align:center;line-height:1;letter-spacing:-2px}
.big.lo{color:#c9d3ee}
.qt{font:700 38px 'Barlow Condensed',sans-serif}
.qt table{width:100%;border-collapse:collapse}
.qt th{color:#7fb2ff;font-weight:700;padding:2px 6px;border-bottom:2px solid #ffffff55}
.qt td{text-align:center;padding:2px 6px;color:#7fb2ff}.qt td.t{color:#fff;text-align:left;width:90px}.qt td.tot{color:#fff}
.pbp{padding:0 14px 0 64px;display:flex;flex-direction:column}
/* tracker mode (live games): scorebuzz.net court tracker on the left, 3 latest plays on the right */
.low{display:grid;grid-template-columns:700px 1fr;gap:12px;padding:0 12px 0 12px;height:368px}
.trk{position:relative;border-radius:12px;overflow:hidden;background:#0b1326;border:2px solid #ffffff22}
/* NHL (owner 9 Nov 2026): bigger rink tracker, smaller score row to make room */
.board.nhl .sc{height:130px}.board.nhl .big{font-size:132px}.board.nhl .qt{font-size:32px}
.board.nhl .low{grid-template-columns:770px 1fr;height:428px}.board.nhl .low .pl{height:140px}.board.nhl .low .pl img{top:48px}
.board.nhl .low .pl{grid-template-columns:1fr 64px;gap:8px}.board.nhl .low .pl .l1{column-gap:10px;flex-wrap:wrap;white-space:normal;line-height:1.1}.board.nhl .low .pl .s{font-size:26px}
#trkL{position:absolute;overflow:hidden;border-radius:12px;pointer-events:none}#trkL iframe{position:absolute;border:0;width:1000px;transform-origin:0 0;background:#0b1326}
.low .pbp{padding:0 0 0 52px}.low .pl{height:122px;grid-template-columns:1fr 92px;padding:0 12px}.low .pl img{left:-48px;top:40px}
.low .pl .l2{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:22px;line-height:1.25}.low .pl .l1{gap:16px}.low .pl .s{font-size:28px}
.pl{position:relative;height:63px;display:grid;grid-template-columns:1fr 130px;align-items:center;border-bottom:1px solid #ffffff22;padding:0 16px}
.pl img{position:absolute;left:-52px;top:13px;width:38px;height:38px;object-fit:contain}
.pl .l1{font:700 25px 'Barlow Condensed',sans-serif;color:#dbe5ff;display:flex;gap:28px;white-space:nowrap}.pl .l1 b{font-weight:800;color:#fff;letter-spacing:.5px}
.pl .l2{font:500 23px Inter,sans-serif;color:#f0f4ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .s{font:700 30px 'Barlow Condensed',sans-serif;text-align:right;white-space:nowrap}.pl .s .g{color:var(--lime)}
.pl.new{background:linear-gradient(90deg,var(--nc),color-mix(in srgb,var(--nc) 70%,#000));border-radius:8px;border:none}
.pl.new .l1,.pl.new .l1 b{color:#fff}
/* on the court */
.court{position:absolute;left:1276px;top:146px;width:630px;height:740px;background:#0b1636;border-radius:12px;overflow:hidden}
.court h2{font:800 34px 'Barlow Condensed',sans-serif;padding:4px 14px 0;border-bottom:2px dashed #ffffff44;letter-spacing:.5px}
.court .tn{display:flex;align-items:center;gap:14px;font:800 32px 'Barlow Condensed',sans-serif;padding:2px 14px;border-bottom:2px dashed #ffffff33}
.court .tn img{width:40px;height:40px;object-fit:contain}
.court table{width:100%;border-collapse:collapse;font-family:'Barlow Condensed',sans-serif}
.court th{font-weight:800;font-size:25px;text-align:center;padding:2px 0;background:#091128}.court th:first-child{text-align:left;padding-left:14px}
.court td{text-align:center;font-weight:700;font-size:30px;border-bottom:1px solid #ffffff14;height:53px;background:#101e47}
.court tr:nth-child(odd) td{background:#0d1a3f}
.court td.n{text-align:left;padding-left:14px;line-height:1.05}.court td.n{white-space:nowrap}.court td.n b{font-size:31px;font-weight:700}.court td.n span{font-size:18px;color:var(--mute);font-family:Inter,sans-serif;font-weight:600;margin-left:10px}
/* leaders */
.ldr{position:absolute;left:14px;top:896px;width:1892px;height:178px;display:grid;grid-template-columns:1fr 1fr 1fr;background:linear-gradient(180deg,#0f1d44,#081232);border-radius:12px;overflow:hidden}
.lc{position:relative;display:grid;grid-template-columns:128px 1fr 128px;align-items:end;border-right:2px dashed #ffffff33;padding:0 4px}
.lc:last-child{border-right:none}
.lc .hs{height:168px;width:128px;object-fit:cover;object-position:top;align-self:end}
.lc .mid{display:grid;grid-template-columns:1fr auto 1fr;align-self:stretch;padding:10px 6px 0}
.lc .v{font:800 52px 'Barlow Condensed',sans-serif;line-height:1}.lc .v.r{text-align:right}
.lc .cat{font:800 28px 'Barlow Condensed',sans-serif;letter-spacing:2px;align-self:center;color:#dbe5ff}
.lc .who{grid-column:1/4;display:grid;grid-template-columns:1fr 1fr;font-family:'Barlow Condensed',sans-serif;margin-top:4px}
.lc .who div{line-height:1.08}.lc .who .r{text-align:right}
.lc .who div{white-space:nowrap;overflow:hidden}.lc .who b{font-size:27px;font-weight:800;display:block}.lc .who span{font-size:20px;font-weight:600;color:#c5d1f0;display:block}.lc .who i{font-style:normal;font-weight:800;font-size:22px;color:var(--lime)}
.foot{position:absolute;left:0;right:0;bottom:0;height:0}
.pre{padding:30px 40px;font-family:'Barlow Condensed',sans-serif}.pre .k{font:800 64px 'Barlow Condensed',sans-serif;color:var(--lime)}.pre .v{font:600 34px Inter,sans-serif;color:#dbe5ff;margin-top:12px}
.court .inj td{height:46px;font-size:24px}.court .inj td.n b{font-size:27px}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 48px Inter,sans-serif;color:var(--mute)}
</style>
<style>
.tob .mid{display:flex;align-items:center;justify-content:center;gap:16px;letter-spacing:2px;font-size:34px}
.tob .mid img{width:36px;height:36px;object-fit:contain}
.tob .sv{font-size:30px}.tob .sv b{font-size:36px}
.tob .bn{font-size:26px;white-space:nowrap}
.pl{grid-template-columns:minmax(0,1fr) 130px!important}.low .pl{grid-template-columns:minmax(0,1fr) 92px!important}
.tm .nm{white-space:nowrap}.tm .nm.m{font-size:48px}.tm .nm.l{font-size:40px}
.gm .r span.rec{font-size:22px}
.court.cmp td{height:41px;font-size:26px}.court.cmp td.n b{font-size:27px}.court.cmp th{font-size:22px}.court.cmp .tn{font-size:28px}.court.cmp .tn img{width:32px;height:32px}
.court table.fx{table-layout:fixed}.court table.fx th:first-child,.court table.fx td.n{width:auto}.court table.fx td.n{overflow:hidden;text-overflow:ellipsis}
.lc .who span{overflow:hidden;text-overflow:ellipsis}.lc .cat{font-size:24px;letter-spacing:1px}
.cnt{display:flex;gap:22px;align-items:center}.cnt span{display:flex;gap:6px;align-items:center}.cnt i{width:16px;height:16px;border-radius:50%;border:2px solid #141b2c66}.cnt i.on{background:#141b2c;border-color:#141b2c}.cnt i.b.on{background:#1f9d55;border-color:#1f9d55}.cnt i.s.on{background:var(--red);border-color:var(--red)}
.bases{position:relative;width:62px;height:44px}.bases i{position:absolute;width:18px;height:18px;transform:rotate(45deg);border:2px solid #141b2c;background:transparent}.bases i.on{background:#f2a900}
.court td.ln{text-align:left;font-size:26px;padding-left:8px;white-space:nowrap}
.court .gl td{background:#16285e}
</style>
</head>
<body><div id="app"><div class="err">Loading ScoreBuzz live scoreboard…</div></div>
<script>
(() => { // wrapped: app.html may document.write() this page into its own window, so top-level names must not clash
const q = new URLSearchParams(location.search);
const SLOT = q.get('slot');
let league = q.get('league') || 'nhl', event = q.get('event'), noSite = q.get('sbtrk') === '0';
function fit() { const R = window.__fitRemote || {}; const W = +R.w || (R.win ? 0 : +q.get('w')) || innerWidth, H = +R.h || (R.win ? 0 : +q.get('h')) || innerHeight, sx = W / 1920, sy = H / 1080;
  const mode = R.fit || q.get('fit') || 'contain', b = document.body;
  if (mode === 'fill') b.style.transform = `scale(${sx},${sy})`; else { const k = Math.min(sx, sy); b.style.transform = `scale(${k})`; b.style.marginLeft = ((W - 1920 * k) / 2) + 'px'; b.style.marginTop = ((H - 1080 * k) / 2) + 'px'; } }
addEventListener('resize', fit); setInterval(fit, 2000); fit();
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const $ = (id) => document.getElementById(id);
const hex = (c, d) => (c && /^[0-9a-f]{6}$/i.test(c) ? '#' + c : d);
const J = async (u) => (await fetch(u, { cache: 'no-store' })).json();
const lum = (h) => { const n = parseInt(h.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };
const darkish = (c, alt) => (lum(c) > 0.7 ? (lum(alt) > 0.7 ? '#1d2a4a' : alt) : c);
const SPORT = { nhl: 'hockey/nhl', nfl: 'football/nfl', ncaaf: 'football/college-football', mlb: 'baseball/mlb' };
const SITE = { nhl: 'ice-hockey/nhl', nfl: 'american-football/nfl', ncaaf: 'american-football/college-football' }; // scorebuzz.net trackers
const CROP = { nhl: { top: 74, vh: 582 }, nfl: { top: 100, vh: 456 }, ncaaf: { top: 100, vh: 456 } }; // same crops as dark.html
const NAME = { nhl: 'NHL', nfl: 'NFL', ncaaf: 'College Football', mlb: 'MLB' };
const ORD = (n) => n + (['th', 'st', 'nd', 'rd'][(n % 100 >> 3 ^ 1 && n % 10) || 0] || 'th');
const perName = (p) => (league === 'nhl' ? (p <= 3 ? ORD(p) : p === 4 ? 'OT' : 'SO') : league === 'mlb' ? ORD(p) : p <= 4 ? ORD(p) : p === 5 ? 'OT' : `${p - 4}OT`);
const API = () => `https://site.api.espn.com/apis/site/v2/sports/${SPORT[league]}`;

function team(x) {
  const t = x.team, rec = (k) => (x.record || []).find((r) => r.type === k)?.summary;
  const color = darkish(hex(t.color, '#1d428a'), hex(t.alternateColor, '#1d428a'));
  const lines = (x.linescores || []).map((l) => l.displayValue ?? l.value), qsum = lines.reduce((n, v) => n + (+v || 0), 0);
  const dark = (t.logos || []).find((l) => (l.rel || []).includes('dark') && !(l.rel || []).includes('scoreboard'))?.href;
  const rank = x.curatedRank?.current || x.rank;
  return { id: t.id, abbr: t.abbreviation, nick: league === 'ncaaf' ? (t.location || t.shortDisplayName) : (t.name || t.shortDisplayName), logo: t.logos?.[0]?.href || t.logo, logoD: dark || t.logos?.[0]?.href || t.logo, color,
    score: league === 'mlb' ? Number(x.score || 0) : Math.max(Number(x.score || 0), qsum), lines, hits: x.hits, errors: x.errors, rank: rank > 0 && rank <= 25 ? rank : 0,
    rec: [rec('total'), x.homeAway === 'home' ? (rec('home') && rec('home') + ' Home') : (rec('road') && rec('road') + ' Away')].filter(Boolean).join(', ') };
}
// box score: { teamId: { group: [{id,name,jersey,pos,head,stat(label)}] } }
function box(s) {
  const out = {};
  for (const b of s.boxscore?.players || []) {
    const T = out[b.team.id] = {};
    (b.statistics || []).forEach((st, i) => {
      const key = st.name || (league === 'mlb' ? (i === 0 ? 'batting' : 'pitching') : 'g' + i), L = st.labels || [];
      const short = (a) => a.shortName || String(a.displayName || '').replace(/^(\S)\S*\s+/, '$1. ');
      T[key] = (st.athletes || []).filter((a) => !a.didNotPlay).map((a) => ({ id: String(a.athlete.id), name: short(a.athlete), jersey: a.athlete.jersey || '', pos: a.athlete.position?.abbreviation || a.position?.abbreviation || '',
        head: a.athlete.headshot?.href || '', st: (k) => a.stats?.[L.indexOf(k)] ?? '-', n: (k) => parseFloat(a.stats?.[L.indexOf(k)]) || 0 }));
    });
  }
  return out;
}
// latest plays, oldest first, each { clk, label, text, team, home, away, scoring }
function plays(s, sb) {
  if (league === 'nfl' || league === 'ncaaf') {
    const ds = [...(s.drives?.previous || []), ...(s.drives?.current ? [s.drives.current] : [])];
    const seen = new Set(), out = [];
    for (const d of ds) for (const p of d.plays || []) { if (seen.has(p.id)) continue; seen.add(p.id);
      out.push({ clk: `${p.clock?.displayValue || ''} - ${perName(p.period?.number || 1)}`, label: (p.scoringPlay ? (p.scoringType?.displayName || p.type?.text) : p.type?.text || '').toUpperCase(), text: (p.text || '').trim(),
        team: String(p.start?.team?.id || d.team?.id || ''), home: p.homeScore, away: p.awayScore, scoring: p.scoringPlay, seq: +p.sequenceNumber || 0 }); }
    // ESPN's drive lists are not always in game order: order by period, then game clock counting down (stable)
    const secs = (c) => { const m = /(\d+):(\d+)\s*-\s*(\S+)/.exec(c || ''); return m ? +m[1] * 60 + +m[2] : 0; };
    return out.map((p, i) => ({ ...p, i, per: parseInt(p.clk.split(' - ')[1]) || (/OT/.test(p.clk) ? 5 : 0) })).sort((a, b) => a.per - b.per || secs(b.clk) - secs(a.clk) || a.i - b.i);
  }
  if (league === 'mlb') return (s.plays || []).filter((p) => p.type?.type === 'play-result' || (p.scoringPlay && p.type?.type !== 'play-result') || p.type?.type === 'start-inning').map((p) => ({
    clk: p.type?.type === 'start-inning' ? '' : `${p.period?.type || ''} ${ORD(p.period?.number || 1)}`, label: p.type?.type === 'start-inning' ? (p.text || '').toUpperCase() : (p.alternativeType?.alternativeText || p.alternativeType?.text || (p.scoringPlay ? 'RUN SCORES' : 'PLAY')).toUpperCase(),
    text: p.type?.type === 'start-inning' ? '' : p.text || '', team: String(p.team?.id || ''), home: p.homeScore, away: p.awayScore, scoring: p.scoringPlay }));
  const NHL = { 'Shot': 'SHOT ON GOAL', 'Goal': 'GOAL', 'Missed': 'MISSED SHOT', 'Blocked': 'BLOCKED SHOT', 'Hit': 'HIT', 'Face Off': 'FACEOFF', 'Giveaway': 'GIVEAWAY', 'Takeaway': 'TAKEAWAY', 'Stoppage': 'STOPPAGE', 'Period Start': 'PERIOD START', 'Period End': 'END OF PERIOD' };
  const left = (v, per) => { const m = /^(\d+):(\d+)$/.exec(v || ''); if (!m) return v || ''; const t = (per <= 3 ? 1200 : 300) - (+m[1] * 60 + +m[2]); return t < 0 ? v : `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
  return (s.plays || []).map((p) => ({ clk: `${left(p.clock?.displayValue, p.period?.number || 1)} - ${perName(p.period?.number || 1)}`, label: p.scoringPlay ? 'GOAL' : NHL[p.type?.text] || ((p.type?.text || '').toUpperCase() + (p.penalty || /minor|major|penalty/i.test(p.text || '') ? ' · PENALTY' : '')),
    text: p.text || '', team: String(p.team?.id || ''), home: p.homeScore, away: p.awayScore, scoring: p.scoringPlay }));
}
function gameCell(e, cur) {
  const c = e.competitions[0], h = c.competitors.find((x) => x.homeAway === 'home'), a = c.competitors.find((x) => x.homeAway === 'away');
  const st = e.status.type, pre = st.state === 'pre', fin = st.completed;
  const s = pre ? new Date(e.date).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' }) + ' ET' : fin ? st.shortDetail.replace(/^Final/, 'Final') : st.shortDetail.replace(' - ', ' · ');
  const row = (x, o) => `<div class="r"><img src="${x.team.logo}"><b>${esc(x.team.abbreviation)}</b><span class="${pre ? 'rec' : !pre && +x.score > +o.score ? 'w' : ''}">${pre ? esc(x.records?.[0]?.summary || '') : esc(x.score)}</span></div>`;
  return `<div class="gm ${cur ? 'cur' : ''}"><div class="st ${!pre && !fin ? 'live' : ''}">${esc(s)}</div>${row(h, a)}${row(a, h)}</div>`;
}
const dots = (n, max) => `<div class="dots">${Array.from({ length: max }, (_, i) => `<i class="${i < n ? '' : 'u'}"></i>`).join('')}</div>`;
const tstat = (s, id, name) => (s.boxscore?.teams || []).find((t) => t.team.id === id)?.statistics?.find((x) => x.name === name)?.displayValue ?? '';

function render(s, sb) {
  const c = s.header.competitions[0], st = c.status;
  const H = team(c.competitors.find((x) => x.homeAway === 'home')), A = team(c.competitors.find((x) => x.homeAway === 'away'));
  document.documentElement.style.setProperty('--hc', H.color); document.documentElement.style.setProperty('--ac', A.color);
  const sbEv = (sb?.events || []).find((e) => e.id === c.id), sit = sbEv?.competitions?.[0]?.situation || {};
  const per = st.period || 1, n = st.type?.name || '', pre = st.type?.state === 'pre', fin = st.type?.completed, live = st.type?.state === 'in';

  } else if (league === 'nhl') {

    const one = (T) => { const G = B[T.id] || {}, sk = [...(G.forwards || []), ...(G.defenses || [])], gl = G.goalies || [];

      if (rows.length < 3) rows = [...sk].sort((a, b) => (b.n('G') + b.n('A')) - (a.n('G') + a.n('A')) || b.n('SOG') - a.n('SOG')).slice(0, 4);

        ...top('rushing', 'YDS', 2).map((p) => ({ name: p.name, jersey: p.jersey, pos: 'RUSH', vals: [p.st('CAR'), p.st('YDS'), p.st('TD'), p.st('LONG')] })),
        ...top('receiving', 'YDS', 2).map((p) => ({ name: p.name, jersey: p.jersey, pos: 'REC', vals: [p.st('REC'), p.st('YDS'), p.st('TD'), p.st('LONG')] }))];

  } else if (hasBox && league === 'nhl') {
    const best = (T, grp, k, line) => { const L = grp.flatMap((g) => B[T.id]?.[g] || []).sort((a, b) => b.n(k) - a.n(k))[0]; return L && { v: L.st(k), name: L.name, head: L.head, jersey: L.jersey, line: line(L) }; };

// the website's live tracker, cropped out of the match page like dark.html / nba.html
let trkF = null, trkSrc = '';
function placeTracker(url) {
  const box = $('trk'); if (!box || !url) { if (trkF) trkF.parentNode.style.display = 'none'; return; }
  if (!trkF) { const L = document.createElement('div'); L.id = 'trkL'; trkF = document.createElement('iframe'); L.appendChild(trkF); document.body.appendChild(L); }
  if (trkSrc !== url) { trkSrc = url; trkF.src = url + '#trkSlot'; }
  trkF.parentNode.style.display = 'block';
  const X = 14, VW = 972, { top: TOP, vh: VH } = CROP[league];
  const m = /scale\(([\d.]+)(?:,\s*([\d.]+))?\)/.exec(document.body.style.transform || ''), sx = m ? +m[1] : 1, sy = m ? +(m[2] || m[1]) : 1;
  const r = box.getBoundingClientRect(), br = document.body.getBoundingClientRect();
  const left = (r.left - br.left) / sx, top = (r.top - br.top) / sy, w = r.width / sx, h = r.height / sy, k = Math.min(w / VW, h / VH);
  Object.assign(trkF.parentNode.style, { left: left + 'px', top: top + 'px', width: w + 'px', height: h + 'px' });
  Object.assign(trkF.style, { height: (TOP + VH + 20) + 'px', left: ((w - VW * k) / 2 - X * k) + 'px', top: ((h - VH * k) / 2 - TOP * k) + 'px', transform: `scale(${k})` });
}
let last = 0;
async function tick() {
  if (!event) return;
  try {
    const [s, sb] = await Promise.all([J(`${API()}/summary?event=${event}`), J(`${API()}/scoreboard${league === 'ncaaf' ? '?groups=80&limit=200' : ''}`).catch(() => null)]);
    render(s, sb); last = Date.now();
  } catch (e) { console.error(e); if (!last) $('app').innerHTML = '<div class="err">Loading ScoreBuzz live scoreboard…</div>'; }
}
async function slotTick() {
  try {
    const c = await J('https://raw.githubusercontent.com/Aijaz555/scorebuzz-media/main/docs/live/settings.json?t=' + Date.now());
    window.__fitRemote = c.fit || {}; fit();
    if (window.__reloadSeen === undefined) window.__reloadSeen = c.reload ?? null; else if ((c.reload ?? null) !== window.__reloadSeen) location.reload();
    const sl = (c.slots || {})[SLOT];
    if (!sl || !sl.event) { $('app').innerHTML = '<div class="err">ScoreBuzz live scoreboard · next game coming up</div>'; event = null; return; }
    if (!SPORT[sl.league] || c.usPage === false || (Array.isArray(c.usLeagues) && !c.usLeagues.includes(sl.league))) { location.replace(`dark.html${location.search}`); return; }
    noSite = sl.sbtrk === 0;
    if (String(sl.event) !== String(event) || sl.league !== league) { league = sl.league; event = String(sl.event); tick(); }
  } catch (e) { /* keep current */ }
}
if (SLOT) { slotTick(); setInterval(slotTick, 60000); setInterval(tick, 6000); }
else if (!event) $('app').innerHTML = '<div class="err">Add ?league=nhl|nfl|ncaaf|mlb&event=&lt;ESPN game id&gt; or ?slot=N</div>'; else { tick(); setInterval(tick, 6000); }
})();
