<!doctype html>
<html><head><meta charset="utf-8"><title>ScoreBuzz live (dark)</title>
<!-- ScoreBuzz dark US-sports scoreboard (owner's request, 7 Nov 2026): our live page mixed with a navy/gold "big score"
     broadcast layout. NBA, NFL, NHL, MLB. Reads ESPN directly from the browser; the scorebuzz.net live tracker sits in the centre.
     Usage: dark.html?league=nba&event=<ESPN id>   or   dark.html?slot=N (game from docs/live/settings.json, like the main overlay;
     hands back to index.html?slot=N when the slot's league isn't one of these four). Designed at 1920x1080, scaled to the window
     (?fit=fill&w=&h= like the main overlay). -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1326;--navy2:#0f1a33;--panel:#121f3dcc;--line:#263457;--ink:#f3f6ff;--mute:#9aa7c7;--gold:#f2c14e;--lime:#c6f432;--red:#e5484d;--hc:#1d428a;--ac:#c8102e}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow:hidden;background:var(--navy)}body{width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;position:relative;background:var(--navy);color:var(--ink);font-family:Inter,'Segoe UI',Arial,sans-serif}
#bg{position:absolute;inset:0;background:
  radial-gradient(900px 700px at 8% 30%,color-mix(in srgb,var(--hc) 55%,transparent),transparent 70%),
  radial-gradient(900px 700px at 92% 30%,color-mix(in srgb,var(--ac) 50%,transparent),transparent 70%),
  linear-gradient(180deg,#0d1730 0%,#0a1124 55%,#070d1c 100%)}
#bg:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 48px),repeating-linear-gradient(90deg,#ffffff04 0 1px,transparent 1px 48px);mask:radial-gradient(60% 50% at 50% 35%,#000 20%,transparent 100%)}
.wrap{position:absolute;inset:0;padding:26px 44px 14px;display:flex;flex-direction:column;gap:14px}
header{position:relative;display:flex;align-items:center;justify-content:center;height:60px;flex:none;white-space:nowrap}header .brand{position:absolute;left:0}header .right{position:absolute;right:0}
.brand{font-size:38px;font-weight:900;letter-spacing:-1px}.brand b{color:var(--lime)}
.title{font-size:28px;font-weight:900;letter-spacing:5px;text-transform:uppercase;color:var(--ink)}.title b{color:var(--gold)}.title span{color:var(--mute);margin:0 14px}
.right{display:flex;align-items:center;gap:16px;font-size:20px;color:var(--mute);letter-spacing:1px}
.live{background:var(--red);color:#fff;font-weight:900;font-size:22px;letter-spacing:4px;padding:10px 26px;border-radius:8px;display:flex;align-items:center;gap:12px}
.live i{width:12px;height:12px;border-radius:50%;background:#fff;animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.3}}
.hero{display:grid;grid-template-columns:1fr 760px 1fr;align-items:center;height:212px;flex:none}
.team{display:flex;flex-direction:column;align-items:center;gap:12px}
.team img{width:118px;height:118px;object-fit:contain;filter:drop-shadow(0 10px 30px #0009)}
.team .city{font-size:40px;font-weight:900;letter-spacing:1px;text-transform:uppercase;line-height:1}
.team .rk{color:var(--gold);font-size:30px;vertical-align:middle}
.team .nick{font-size:21px;font-weight:600;letter-spacing:6px;text-transform:uppercase;color:var(--mute)}
.team .rec{font-size:17px;font-weight:800;letter-spacing:1px;color:var(--ink);background:#ffffff18;padding:3px 12px;border-radius:999px;margin-left:10px;vertical-align:middle}
.mid{text-align:center}
.mid .per{font-size:30px;font-weight:900;letter-spacing:8px;text-transform:uppercase;color:var(--gold)}
.mid .sc{font-size:150px;font-weight:900;line-height:1;letter-spacing:-6px;font-variant-numeric:tabular-nums;display:flex;justify-content:center;align-items:center;gap:6px}
.mid .sc i{font-style:normal;color:var(--gold);font-size:100px;margin:0 6px;line-height:1;position:relative;top:-14px}
.mid .sc .lo{color:#ffffffaa}
.mid .clk{font-size:30px;font-weight:800;letter-spacing:2px;color:var(--ink);margin-top:-6px}
.mid .lead{display:inline-block;margin-left:18px;font-size:20px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--gold);vertical-align:middle}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 22px;backdrop-filter:blur(6px);overflow:hidden}
.h{font-size:19px;font-weight:900;letter-spacing:5px;text-transform:uppercase;color:#c9d3f0;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
th{font-size:18px;font-weight:800;letter-spacing:2px;color:var(--mute);text-align:center;padding:2px 0 6px}th:first-child{text-align:left}th:last-child{color:var(--gold)}
td{text-align:center;padding:2px 0;border-top:1px solid #ffffff10}td:first-child{text-align:left;display:flex;align-items:center;gap:14px}td.tot{color:var(--gold);font-size:30px}td.x{color:var(--mute)}th.x{color:var(--mute)}
td img{width:40px;height:40px;object-fit:contain}
.row2{display:grid;grid-template-columns:440px 1fr 500px;gap:14px;flex:1;min-height:0;overflow:hidden}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}.col .panel{min-height:0;min-width:0}.col .panel:first-child{flex:1}
.trk{position:relative;padding:0;overflow:hidden;background:#0b1326}.trk .cap{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:14px;letter-spacing:3px;color:var(--mute);text-transform:uppercase;padding:4px;background:#0b1326cc}
#trkL iframe{position:absolute;border:0;width:1000px;transform-origin:0 0;background:#0b1326}
.fh{display:flex;align-items:center;gap:10px;padding:10px 20px 4px;font-size:20px;font-weight:700;color:var(--ink)}.fh img{width:28px;height:28px;object-fit:contain}.fh b{color:var(--gold)}.fh .rz{color:#ff5a5a;font-weight:900;letter-spacing:2px}
.fld{display:block;width:100%;height:calc(100% - 74px);padding:0 16px}
.dia{display:grid;grid-template-columns:1fr 220px;align-items:center;height:calc(100% - 74px);padding:0 24px}.dia svg{height:100%;max-height:230px;width:auto;margin:auto;display:block}.cnt div{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:18px;font-weight:700}.cnt span{width:80px;color:var(--mute);font-size:15px;letter-spacing:2px;text-transform:uppercase}.cnt i{width:20px;height:20px;border-radius:50%;display:inline-block}.cnt .who{font-size:18px;color:var(--mute)}.cnt .who b{color:var(--ink);margin-left:6px}
.stat{display:grid;grid-template-columns:72px 1fr 118px 1fr 72px;align-items:center;gap:10px;padding:5px 0;border-top:1px solid #ffffff10;font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}
.stat:first-of-type{border-top:none}
.stat .n{text-align:center;white-space:nowrap;font-size:13px;font-weight:800;letter-spacing:2px;color:var(--mute);text-transform:uppercase}
.stat .bar{height:9px;border-radius:6px;background:#ffffff14;position:relative;overflow:hidden}
.stat .bar b{position:absolute;top:0;bottom:0;border-radius:6px}
.stat .hv{color:var(--gold);text-align:right}.stat .av{color:#ff8b8b}
.stat.g{grid-template-columns:90px 1fr 170px 1fr 90px}
.stat.g .n{grid-column:auto}
.pbp{display:flex;flex-direction:column;gap:6px}
.play{display:flex;align-items:center;gap:12px;background:#ffffff0a;border-radius:10px;padding:4px 12px;font-size:18px;font-weight:600}
.play img{width:30px;height:30px;object-fit:contain}
.play .t{font-size:15px;font-weight:800;color:var(--gold);letter-spacing:1px;min-width:84px}
.play .x{flex:1;min-width:0;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.play .v{background:var(--lime);color:#111;font-weight:900;font-size:19px;padding:3px 10px;border-radius:8px;white-space:nowrap}
.ldr{display:grid;grid-template-columns:52px 1fr 1fr;gap:10px;align-items:center;padding:5px 0;border-top:1px solid #ffffff10;font-size:20px;font-weight:700;white-space:nowrap}.ldr .k{font-size:14px;font-weight:900;letter-spacing:2px;color:var(--mute)}.ldr .p{display:flex;align-items:center;gap:8px}.ldr .p b{color:var(--gold);font-weight:900}.ldr img{width:30px;height:30px;object-fit:contain}
.ldr:first-of-type{border-top:none}.ldr small{display:block;font-size:16px;color:var(--mute);font-weight:600;letter-spacing:1px}
.ldr .v{font-size:24px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}.ldr .v em{font-style:normal;color:var(--mute);margin:0 6px;font-weight:600}
.ldrs{display:block}
.ticker{display:flex;align-items:center;height:60px;flex:none;background:#0a142bcc;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ticker .lg{flex:none;height:100%;display:flex;align-items:center;padding:0 28px;background:var(--gold);color:#111;font-weight:900;font-size:22px;letter-spacing:4px;position:relative;z-index:2}.ticker .win{flex:1;overflow:hidden}
.ticker .run{display:flex;gap:0;white-space:nowrap;font-size:24px;font-weight:800;animation:run 40s linear infinite}
.ticker .it{display:flex;align-items:center;gap:10px;padding:0 34px;border-right:1px solid #ffffff22}
.ticker img{width:30px;height:30px;object-fit:contain}.ticker .vs{color:var(--gold)}.ticker .st{color:var(--mute);font-size:19px;font-weight:700;letter-spacing:1px}.ticker .fin{color:var(--gold)}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
footer{display:flex;justify-content:space-between;align-items:center;height:48px;flex:none;font-size:19px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mute)}
footer .ok{display:inline-block;width:10px;height:10px;border-radius:50%;background:#3ddc84;margin-right:10px;box-shadow:0 0 8px #3ddc84}
footer b{color:var(--lime);font-weight:900}
.err{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:var(--mute)}
</style></head>
<body><div id="bg"></div>
<div class="wrap" id="app"></div>
<script>
const q = new URLSearchParams(location.search);
const SLOT = q.get('slot');
let league = q.get('league') || 'nba', event = q.get('event'), noSite = q.get('sbtrk') === '0';
const SPORT = { nba: 'basketball/nba', nfl: 'football/nfl', ncaaf: 'football/college-football', nhl: 'hockey/nhl', mlb: 'baseball/mlb' };
const SITE = { nba: 'basketball/nba', nfl: 'american-football/nfl', ncaaf: 'american-football/college-football', nhl: 'ice-hockey/nhl' }; // scorebuzz.net match pages with a live tracker (MLB: built-in; football falls back to the built-in field when the check sets sbtrk: 0)
const CROP = { nba: { top: 64, vh: 512 }, nfl: { top: 100, vh: 456 }, ncaaf: { top: 100, vh: 456 }, nhl: { top: 74, vh: 582 } }; // tracker card crop, same as the main overlay
const LG = { nba: { name: 'NBA', per: 'Quarter', cols: ['Q1', 'Q2', 'Q3', 'Q4'], ot: 'OT' }, nfl: { name: 'NFL', per: 'Quarter', cols: ['Q1', 'Q2', 'Q3', 'Q4'], ot: 'OT' }, ncaaf: { name: 'NCAAF', per: 'Quarter', cols: ['Q1', 'Q2', 'Q3', 'Q4'], ot: 'OT' },
  nhl: { name: 'NHL', per: 'Period', cols: ['P1', 'P2', 'P3'], ot: 'OT' }, mlb: { name: 'MLB', per: 'Inning', cols: ['1', '2', '3', '4', '5', '6', '7', '8', '9'], ot: 'X' } };
// scale the 1920x1080 design to the window (?fit=fill&w=&h= like the main overlay)
// settings.json "fit" ({"win": true, "fit": "fill"} in production) overrides the URL, exactly like the main overlay
function fit() { const R = window.__fitRemote || {}; const W = +R.w || (R.win ? 0 : +q.get('w')) || innerWidth, H = +R.h || (R.win ? 0 : +q.get('h')) || innerHeight, sx = W / 1920, sy = H / 1080;
  const mode = R.fit || q.get('fit') || 'contain', b = document.body; b.style.marginLeft = (+R.x || 0) + 'px'; b.style.marginTop = (+R.y || 0) + 'px';
  if (mode === 'fill') b.style.transform = `scale(${sx},${sy})`; else { const k = Math.min(sx, sy); b.style.transform = `scale(${k})`; b.style.marginLeft = ((+R.x || 0) + (W - 1920 * k) / 2) + 'px'; b.style.marginTop = ((+R.y || 0) + (H - 1080 * k) / 2) + 'px'; } }
addEventListener('resize', fit); setInterval(fit, 2000); fit();
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const $ = (id) => document.getElementById(id);
const hex = (c, d) => (c && /^[0-9a-f]{6}$/i.test(c) ? '#' + c : d);
const J = async (u) => (await fetch(u, { cache: 'no-store' })).json();
let last = null, lastSit = null, tz = 'America/New_York', tzName = '';

function team(x) {
  const t = x.team; const st = {};
  return { id: t.id, abbr: t.abbreviation, city: t.location || t.displayName, nick: t.name || '', short: t.shortDisplayName || t.name || '', rank: (x.curatedRank?.current || x.rank) > 0 && (x.curatedRank?.current || x.rank) <= 25 ? (x.curatedRank?.current || x.rank) : 0, logo: t.logos?.[0]?.href || t.logo || '',
    color: hex(t.color, '#2A3570'), alt: hex(t.alternateColor, '#ffffff'), score: Number(x.score || 0),
    lines: (x.linescores || []).map((l) => l.displayValue ?? ''), rec: (x.record || []).find((r) => r.type === 'total')?.summary || '' };
}
function period(st, g) {
  const p = st.period, n = st.type?.name || '', L = LG[league], reg = L.cols.length, nm = L.per.toLowerCase();
  const start = { nba: 'Tip-off', nfl: 'Kick-off', nhl: 'Puck drop', mlb: 'First pitch' }[league];
  if (/HALFTIME/.test(n)) return ['Halftime', ''];
  if (/FINAL/.test(n)) return [st.type?.shortDetail && /OT|SO|\/\d+/.test(st.type.shortDetail) ? st.type.shortDetail : 'Final', ''];
  if (/SCHEDULED|PRE/.test(n) || st.type?.state === 'pre') return [start, new Date(g.date).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tz }) + ' ' + tzName];
  if (/END/.test(n)) return [`End of ${p > reg ? L.ot + (p - reg > 1 && league !== 'mlb' ? p - reg : '') : nm + ' ' + p}`, ''];
  if (league === 'mlb') return [`${st.type?.shortDetail || L.per + ' ' + p}`, ''];
  if (/SHOOTOUT/.test(n)) return ['Shootout', ''];
  return [p > reg ? `Overtime${p - reg > 1 ? ' ' + (p - reg) : ''}` : `${L.per} ${p}`, st.displayClock || ''];
}
// per-league team stats [label, boxscore stat name, is percentage] and leader categories
const STATS = {
  nba: [['Field goal %', 'fieldGoalPct', 1], ['3-point %', 'threePointFieldGoalPct', 1], ['Free throw %', 'freeThrowPct', 1], ['Rebounds', 'totalRebounds'], ['Assists', 'assists'], ['Turnovers', 'turnovers']],
  nfl: [['Total yards', 'totalYards'], ['Pass yds', 'netPassingYards'], ['Rush yds', 'rushingYards'], ['1st downs', 'firstDowns'], ['3rd down', 'thirdDownEff', 's'], ['Turnovers', 'turnovers']],
  ncaaf: [['Total yards', 'totalYards'], ['Pass yds', 'netPassingYards'], ['Rush yds', 'rushingYards'], ['1st downs', 'firstDowns'], ['3rd down', 'thirdDownEff', 's'], ['Turnovers', 'turnovers']],
  nhl: [['Shots', 'shotsTotal'], ['Hits', 'hits'], ['Blocks', 'blockedShots'], ['Faceoffs', 'faceoffsWon'], ['Power play', 'powerPlayGoals', 's', 'powerPlayOpportunities'], ['PIM', 'penaltyMinutes']],
  mlb: [['Runs', 'batting.runs'], ['Hits', 'batting.hits'], ['Home runs', 'batting.homeRuns'], ['Walks', 'batting.walks'], ['Strikeouts', 'pitching.strikeouts'], ['Errors', 'fielding.errors']],
};
const LEADERS = { nba: [['points', 'PTS'], ['assists', 'AST'], ['rebounds', 'REB']], nfl: [['passingYards', 'PASS'], ['rushingYards', 'RUSH'], ['receivingYards', 'REC']], ncaaf: [['passingYards', 'PASS'], ['rushingYards', 'RUSH'], ['receivingYards', 'REC']],
  nhl: [['goals', 'G'], ['assists', 'A'], ['points', 'PTS']], mlb: [] };
// ---- built-in trackers (ESPN scoreboard "situation") ----
// Football: away end zone left, home end zone right (same convention as the main overlay)
function fieldView(sit, home, away) {
  const W = 800, H = 300, EZ = 70, FL = W - 2 * EZ, X = (y) => EZ + (y / 100) * FL;
  let ball = null, fd = null, dir = 0, poss = null, txt = '';
  if (sit) {
    const m = /([A-Z&]+)\s+(\d+)/i.exec(String(sit.possessionText || ''));
    if (m) { const side = m[1].toUpperCase(), yd = Number(m[2]); ball = side === home.abbr ? 100 - yd : side === away.abbr ? yd : 50; }
    poss = String(sit.possession) === String(home.id) ? home : String(sit.possession) === String(away.id) ? away : null;
    dir = poss === away ? 1 : poss === home ? -1 : 0;
    // during timeouts / between plays ESPN drops possessionText but keeps yardLine = yards to the end zone for the possession team
    if (ball == null && poss && sit.yardLine != null && sit.yardLine > 0) ball = poss === away ? 100 - sit.yardLine : sit.yardLine;
    if (ball != null && sit.distance) fd = Math.max(0, Math.min(100, ball + dir * sit.distance));
    txt = sit.downDistanceText || sit.shortDownDistanceText || (sit.lastPlay?.type?.text === 'Timeout' ? 'Timeout' : '');
  }
  const yards = [10, 20, 30, 40, 50, 40, 30, 20, 10];
  const lines = [...Array(21)].map((_, i) => `<line x1="${X(i * 5)}" y1="20" x2="${X(i * 5)}" y2="${H - 20}" stroke="#ffffff${i % 2 ? '35' : '70'}" stroke-width="${i % 2 ? 1.5 : 2.5}"/>`).join('');
  const nums = yards.map((n, i) => `<text x="${X((i + 1) * 10)}" y="${H / 2 + 12}" text-anchor="middle" font-size="30" font-weight="900" fill="#ffffff80" font-family="Inter">${n}</text>`).join('');
  const ez = (t, x) => `<rect x="${x}" y="20" width="${EZ}" height="${H - 40}" fill="${t.color}"/><text transform="translate(${x + EZ / 2} ${H / 2}) rotate(${x ? 90 : -90})" text-anchor="middle" dominant-baseline="middle" font-size="34" font-weight="900" fill="#fff" font-family="Inter" letter-spacing="4">${esc(t.abbr)}</text>`;
  const fdl = fd != null ? `<line x1="${X(fd)}" y1="20" x2="${X(fd)}" y2="${H - 20}" stroke="#ffd23f" stroke-width="5"/>` : '';
  const los = ball != null ? `<line x1="${X(ball)}" y1="20" x2="${X(ball)}" y2="${H - 20}" stroke="#4aa3ff" stroke-width="5"/>` : '';
  const bm = ball != null ? `<g transform="translate(${X(ball)} ${H / 2})"><ellipse rx="22" ry="14" fill="#8b4513" stroke="#fff" stroke-width="3"/><line x1="-10" y1="0" x2="10" y2="0" stroke="#fff" stroke-width="3"/>${dir ? `<path d="M${dir * 30} -12 L${dir * 48} 0 L${dir * 30} 12 Z" fill="#fff"/>` : ''}</g>` : '';
  const head = `<div class="fh">${poss ? `<img src="${poss.logo}"> ${esc(poss.abbr)} ball` : 'Ball'}${txt ? ` · <b>${esc(txt)}</b>` : ''}${sit?.isRedZone ? ' · <span class="rz">RED ZONE</span>' : ''}</div>`;
  return head + `<svg viewBox="0 0 ${W} ${H}" class="fld"><rect x="0" y="20" width="${W}" height="${H - 40}" fill="#2f7a2a"/>${[...Array(10)].map((_, i) => `<rect x="${X(i * 10)}" y="20" width="${FL / 10}" height="${H - 40}" fill="${i % 2 ? '#2f7a2a' : '#358a30'}"/>`).join('')}${ez(away, 0)}${ez(home, W - EZ)}${lines}${nums}${fdl}${los}${bm}</svg>`;
}
// Baseball: diamond with runners, count and outs
function diamondView(sit, home, away) {
  const on = (k) => !!sit?.[k];
  const base = (x, y, lit) => `<rect x="${x - 16}" y="${y - 16}" width="32" height="32" transform="rotate(45 ${x} ${y})" fill="${lit ? '#ffd23f' : '#ffffff22'}" stroke="#fff" stroke-width="3"/>`;
  const dot = (lit, c) => `<i style="background:${lit ? c : '#ffffff22'}"></i>`;
  const bat = sit?.batter?.athlete?.shortName || sit?.batter?.athlete?.displayName || '', pit = sit?.pitcher?.athlete?.shortName || sit?.pitcher?.athlete?.displayName || '';
  const head = `<div class="fh">${sit?.lastPlay?.text ? esc(sit.lastPlay.text).slice(0, 90) : 'At bat'}</div>`;
  return head + `<div class="dia"><svg viewBox="0 0 300 220"><path d="M150 200 L60 110 L150 20 L240 110 Z" fill="#2f7a2a" stroke="#ffffff55" stroke-width="3"/>
    ${base(240, 110, on('onFirst'))}${base(150, 20, on('onSecond'))}${base(60, 110, on('onThird'))}<rect x="138" y="188" width="24" height="24" fill="#fff"/><circle cx="150" cy="110" r="14" fill="#c9a36a"/></svg>
    <div class="cnt"><div><span>Balls</span>${[1, 2, 3].map((i) => dot((sit?.balls || 0) >= i, '#3ddc84')).join('')}</div><div><span>Strikes</span>${[1, 2].map((i) => dot((sit?.strikes || 0) >= i, '#ffd23f')).join('')}</div><div><span>Outs</span>${[1, 2].map((i) => dot((sit?.outs || 0) >= i, '#ff5a5a')).join('')}</div>
    ${bat ? `<div class="who">AB <b>${esc(bat)}</b></div>` : ''}${pit ? `<div class="who">P <b>${esc(pit)}</b></div>` : ''}</div></div>`;
}
function stat(h, a, name, pct) {
  if (pct === 's') { // text stats (3rd down 4-12, power play 1/2): no bars
    return `<div class="stat"><span class="hv">${esc(h)}</span><span></span><span class="n">${esc(name)}</span><span></span><span class="av">${esc(a)}</span></div>`; }
  const H = Number(h) || 0, A = Number(a) || 0, tot = pct ? 100 : Math.max(1, H + A);
  return `<div class="stat"><span class="hv">${esc(h)}</span><span class="bar"><b style="right:0;width:${pct ? H : (H / tot) * 100}%;background:var(--gold)"></b></span><span class="n">${esc(name)}</span>
